# Catalog rows removed after their vendor shut the model down, kept only so the
# adapters that still exist stay unit-tested (they load their schema from here
# instead of models/). Not loaded by the server and never advertised; see
# `no_retired_model_ids_are_advertised` in tests/catalog_conformance.rs.
models:
  # Bedrock EOL 2026-09-30 (removed from models/bedrock.yaml 2026-10-12).
  - id: bedrock/amazon.nova-canvas-v1:0
    provider: bedrock
    media_type: image
    display_name: Amazon Nova Canvas
    description: Amazon Nova Canvas text-to-image (+ conditioning) via Bedrock InvokeModel (sync).
    pricing: { base_cost_usd: 0.04 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 1024 }
    params:
      negative_prompt: { kind: string, max_length: 1024 }
      seed: { kind: seed, min: 0, max: 2147483646 }
      guidance_scale: { kind: float, min: 1.1, max: 10.0 }
      quality:
        kind: string
        enum_values: [standard, premium]
        default: standard
      # "Each side must be between 320-4096 pixels, inclusive. Each side must be
      # evenly divisible by 16." (Aspect ratio 1:4..4:1 and < 4,194,304 total
      # pixels are not expressible here.)
      # @see https://docs.aws.amazon.com/nova/latest/userguide/image-gen-access.html#image-gen-resolutions
      size:
        kind: size
        mode: freeform
        min_width: 320
        max_width: 4096
        min_height: 320
        max_height: 4096
        multiple_of: 16
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [controlMode, controlStrength]
    tags: [text-to-image, image-to-image]

  # Nova Reel: async; output is written to YOUR S3 bucket. REQUIRES the
  # provider option `s3_output_uri` (e.g. providers.bedrock.options.s3_output_uri:
  # "s3://bucket/prefix/"). Region availability is limited (e.g. us-east-1).
  - id: bedrock/amazon.nova-reel-v1:1
    provider: bedrock
    media_type: video
    display_name: Amazon Nova Reel
    description: Amazon Nova Reel text-to-video / image-to-video (async; output to S3).
    pricing: { base_cost_usd: 0.48 }
    capabilities: { text_to_video: true, image_to_video: true }
    # TEXT_VIDEO `text`: "Must be 1-512 characters in length." (4000 is the
    # MULTI_SHOT_AUTOMATED limit, a task type this adapter never emits.)
    # @see https://docs.aws.amazon.com/nova/latest/userguide/video-gen-access.html
    prompt: { required: true, max_length: 512 }
    params:
      seed: { kind: seed, min: 0, max: 2147483646 }
      # TEXT_VIDEO supports durationSeconds: 6 only. 12-120s (multiples of 6)
      # requires taskType MULTI_SHOT_AUTOMATED, which this adapter does not emit.
      duration_seconds: { kind: float, min: 6.0, max: 6.0, default: 6.0 }
      fps: { kind: int, min: 24, max: 24, default: 24 }
      resolution:
        kind: string
        enum_values: ["1280x720"]
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video]

  # OpenAI shut down the Videos API and Sora 2 on 2026-09-24 (removed from models/openai.yaml 2026-10-12).
  - id: openai/sora
    provider: openai
    media_type: video
    display_name: Sora 2
    description: "DEPRECATED: OpenAI is shutting down the Videos API and every
      Sora 2 model on 2026-09-24 with no replacement offered. Sora 2
      text-to-video and image-to-video (maps to the `sora-2` model)."
    pricing: { base_cost_usd: 0.50 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 4000 }
    params:
      # Sora accepts only clip lengths of 4, 8, or 12s; other values snap to the nearest.
      duration_seconds:
        kind: float
        min: 4.0
        max: 12.0
        default: 4.0
      # aspect_ratio + resolution select the Sora `size` (e.g. 1280x720 / 720x1280).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16"]
        default: "16:9"
      resolution:
        kind: string
        enum_values: [720p]
        default: 720p
    ref_inputs:
      max_total: 1
      default_role: init
      # Image-to-video uploads the first frame as a multipart `input_reference` part.
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video]
