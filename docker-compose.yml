services:
  litegen:
    build: .
    image: litegen:latest
    ports:
      - "4000:4000"
    # Each variable here beats the same setting in a mounted config file
    # (docs/configuration.md): to take a setting from the file, leave it out.
    environment:
      # Origin clients reach this container on; 3D asset URLs are minted
      # absolute from it and are unreachable if it is left at the container's
      # own bind address. Required behind a proxy or on a remote host.
      LITEGEN__SERVER__PUBLIC_BASE_URL: "${LITEGEN_PUBLIC_BASE_URL:-http://127.0.0.1:4000}"
      LITEGEN__DATABASE_URL: "postgres://litegen:litegen@db:5432/litegen"
      LITEGEN__MASTER_KEY: "${LITEGEN_MASTER_KEY:?LITEGEN_MASTER_KEY must be set}"
      LITEGEN_CORS_ORIGINS: "${LITEGEN_CORS_ORIGINS:-}"
      RUST_LOG: "info"
      # Provider keys come in the same way (an empty one counts as unset):
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # A stop gives open requests and the poller's current rows litegen's
    # shutdown grace (server.shutdown_grace_secs; unset, the vendor timeout +
    # 30 s = 150 s), then gives back its poll claims. Docker's own default is
    # 10 s, after which it kills litegen: keep this the grace + 15 s.
    stop_grace_period: 165s
    # Kept results (meshes, videos, images, published references) outlive
    # the container; litegen refuses to start if it cannot write here.
    volumes:
      - litegen_assets:/app/data
      # A config file: copy litegen.example.yaml to litegen.yaml first (for a
      # missing file Docker mounts an empty directory, and litegen refuses to
      # start). The variables above beat what it sets.
      # - ./litegen.yaml:/app/litegen.yaml:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litegen
      POSTGRES_PASSWORD: litegen
      POSTGRES_DB: litegen
    volumes:
      - litegen_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litegen"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  litegen_db:
  litegen_assets:
