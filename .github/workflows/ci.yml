# CI for the whole repository, on every push and pull request.
#
# The repository is public, so GitHub's standard runners cost nothing: every
# job runs on every push, with no path filters (a filtered-out job leaves a
# required check pending forever). Require the one `ci-ok` check in branch
# protection; it fails unless every other job passed.
#
# What a green run means:
# - every suite that needs no vendor key ran on a clean Linux checkout, with
#   the services and runtimes it needs (Postgres, Redis, S3, python3, node, bun);
# - no test skipped itself for a missing service (.github/scripts/no-skips.sh);
# - every generated file matches its source: the OpenAPI document and both
#   SDKs, the landing page's catalog snapshots, the converter's .pyi stub
#   (.github/scripts/unchanged.sh), and docs/mcp/tools.md (a Rust test);
# - the Docker image builds and runs as documented: from environment
#   variables alone, and from a mounted config file
#   (.github/scripts/docker-smoke.sh).
# Live vendor suites stay out (the #[ignore]d live_* tests, dashboard/e2e-live):
# they need paid keys, and pull requests from forks get no secrets.
#
# Actions are pinned to full commit SHAs, with the release in a comment;
# .github/dependabot.yml proposes updates weekly.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch or pull request: a newer push cancels the older run,
  # except on main, where every commit keeps its result.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # bash -eo pipefail: a failing command fails its step, even piped into tee.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # File and line in panics and backtraces at a fraction of full debug info's
  # disk: each of litegen-core's 55 integration suites links the whole crate.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  NODE_VERSION: '26'

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (with the runner's shellcheck)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  core:
    name: litegen-core (clippy, tests, OpenAPI and SDK drift)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: litegen-core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: litegen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        # The Redis-gated tests (shared limits, slots, cache, events and
        # tests/scaling_replicas.rs) skip themselves without it, and
        # no-skips.sh fails the run when one does.
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
      s3:
        # Zenko CloudServer checks SigV4 and presigned URLs. MinIO, which the
        # tests' docs name, no longer publishes images. The digest is the
        # image these tests are verified against locally.
        image: zenko/cloudserver@sha256:b53e57829cf7df357323e60a19c9f98d2218f1b7ccb1d7cea5761a5a227a9ee3
        env:
          REMOTE_MANAGEMENT_DISABLE: '1'
        ports: ['9000:8000']
    env:
      LITEGEN_PG_TEST_URL: postgres://postgres:pw@127.0.0.1:5432/litegen_test
      LITEGEN_REDIS_TEST_URL: redis://127.0.0.1:6379
      LITEGEN_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      LITEGEN_S3_TEST_KEY: accessKey1
      LITEGEN_S3_TEST_SECRET: verySecretKey1
      # The timing tests run alone, in a step of their own: under the whole
      # suite's parallel load their limits measure the machine. The list is
      # the local gates' (mesh-gaps items 4 to 8, and item 6's 2026-11-10
      # follow-up), every one a lib test.
      TIMING_TESTS: >-
        scale_animated_ancestors_are_found_once_per_chain
        many_distinct_key_time_arrays_write_in_linear_time
        composites_are_mixed_once_and_base_indices_cannot_multiply_primitives
        deeply_nested_animations_index_their_channels_in_linear_time
        a_deep_chain_validates_and_round_trips_in_linear_time
        a_multiproperties_group_is_resolved_once_not_per_triangle
        blend_shapes_and_skins_are_charged_as_they_are_built
        the_poll_budget_ends_at_the_deadline_or_the_default
        an_s3_store_presigns_on_the_bucket_endpoint_with_the_ttl
        a_wide_skeleton_and_its_meshes_read_in_linear_time
        skeletons_sharing_one_animation_read_in_linear_time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        # The debug test build alone is about 14 GB (measured on Linux with
        # line-tables-only), clippy's artifacts come on top, and the runner
        # guarantees 14 GB. The image's Android, .NET, Haskell and CodeQL
        # toolchains, which no job uses, free about 20 GB more.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Rust (the version rust-toolchain.toml pins)
        run: rustup toolchain install && cargo --version && cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: litegen-core
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            scripts/mesh-verify/package-lock.json
            sdks/typescript/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The hook runtimes (python3, node, bun)
        run: python3 --version && node --version && bun --version
      - name: scripts/mesh-verify's packages (model3d_chain reads glTF through @gltf-transform/core)
        working-directory: scripts/mesh-verify
        run: npm ci --no-audit --no-fund
      - name: Wait for the S3 server
        run: |
          for _ in $(seq 120); do
            [[ $(curl -s -o /dev/null -w '%{http_code}' "$LITEGEN_S3_TEST_ENDPOINT/") != 000 ]] && exit 0
            sleep 1
          done
          echo "::error::the S3 server never answered"; exit 1
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests (lib, integration suites, examples)
        run: |
          read -ra timing <<< "$TIMING_TESTS"
          skips=(); for t in "${timing[@]}"; do skips+=(--skip "$t"); done
          cargo test --locked --no-fail-fast -- "${skips[@]}" --show-output 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: The timing tests, alone
        run: |
          read -ra timing <<< "$TIMING_TESTS"
          cargo test --locked --lib -- --test-threads=1 "${timing[@]}"
      - name: No test skipped itself
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/no-skips.sh" "$RUNNER_TEMP/tests.log"
      - name: Disk use
        if: ${{ always() }}
        run: df -h / && du -sh target
      - name: OpenAPI and both SDKs match the server
        run: |
          (cd ../sdks/typescript && npm ci --no-audit --no-fund)
          bash ../sdks/scripts/regen-all.sh
          bash "$GITHUB_WORKSPACE/.github/scripts/unchanged.sh" sdks

  release-binary:
    name: litegen release binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: litegen-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (the version rust-toolchain.toml pins)
        run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: litegen-core
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build
        run: cargo build --locked --release --bin litegen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: litegen-release
          path: litegen-core/target/release/litegen
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t litegen:ci .
      # Environment variables only (no database setting), a mounted config
      # file, uid 1000, the refusal without a master key, Postgres from parts.
      # A failed check prints its container's log.
      - name: The image runs as documented
        run: bash .github/scripts/docker-smoke.sh litegen:ci

  dashboard:
    name: dashboard (lint, unit tests, build, stories)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            sdks/typescript/package-lock.json
            packages/3d-viewer/package-lock.json
      - name: '@litegen/sdk (the dashboard imports its built dist/)'
        working-directory: sdks/typescript
        run: npm ci --no-audit --no-fund && npm run build
      - name: "@litegen/3d-viewer's own packages"
        working-directory: packages/3d-viewer
        run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build-storybook
      - run: npm run test:stories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: dashboard-stories-results
          path: dashboard/test-results-stories/
          retention-days: 7

  dashboard-e2e:
    name: dashboard e2e (${{ matrix.suite }})
    needs: release-binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: main
            config: playwright.config.ts
          - suite: access
            config: playwright.access.config.ts
          - suite: hooks
            config: playwright.hooks.config.ts
          - suite: multitenant
            config: playwright.multitenant.config.ts
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            sdks/typescript/package-lock.json
            packages/3d-viewer/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: litegen-release
          path: ${{ runner.temp }}/litegen
      - name: The release binary (the suites boot it)
        run: |
          chmod +x "$RUNNER_TEMP/litegen/litegen"
          echo "LITEGEN_E2E_BINARY=$RUNNER_TEMP/litegen/litegen" >> "$GITHUB_ENV"
      - name: '@litegen/sdk (the dashboard imports its built dist/)'
        working-directory: sdks/typescript
        run: npm ci --no-audit --no-fund && npm run build
      - name: "@litegen/3d-viewer's own packages"
        working-directory: packages/3d-viewer
        run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Playwright (${{ matrix.config }})
        run: npx playwright test --config "${{ matrix.config }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: dashboard-e2e-${{ matrix.suite }}
          path: |
            dashboard/test-results*/
            dashboard/playwright-report/
          retention-days: 7

  landing:
    # No lint step: the app has no ESLint config, and `next lint` without
    # one stops at an interactive setup prompt. `next build` type-checks.
    name: landing page (script tests, snapshot drift, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:scripts 2>&1 | tee "$RUNNER_TEMP/node-test.log"
      - name: No test skipped itself
        run: bash "$GITHUB_WORKSPACE/.github/scripts/no-skips.sh" "$RUNNER_TEMP/node-test.log"
      - name: The catalog snapshots and the OpenAPI copy match models/ and sdks/openapi.json
        run: |
          # The sync scripts fail open (they keep the committed snapshot and
          # exit 0 when they can't read the source), so their warning fails here.
          for s in sync-capabilities sync-models sync-openapi; do node "scripts/$s.mjs"; done 2>&1 | tee "$RUNNER_TEMP/sync.log"
          if grep -q 'warning:' "$RUNNER_TEMP/sync.log"; then
            echo "::error::a sync script fell back to its committed snapshot"; exit 1
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/unchanged.sh" apps/landing
      - run: npm run build
      - name: The built reference page shows each model's exact price, its unit and what it does
        run: npm run test:built

  price-api:
    name: price API (lint, unit, e2e, build, catalog coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/price-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: price
          POSTGRES_PASSWORD: price
          POSTGRES_DB: price_api_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U price"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://price:price@127.0.0.1:5433/price_api_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/price-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: Every litegen model has a price
        run: npm run coverage:check

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk-python:
    name: Python SDK (${{ matrix.python }})
    needs: release-binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pyproject's floor and the newest release.
        python: ['3.10', '3.14']
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: litegen-release
          path: ${{ runner.temp }}/litegen
      - name: The binary the integration tests boot
        # tests/conftest.py boots litegen-core/target/debug/litegen. The
        # release build serves the same API, so it goes where the tests look.
        run: |
          mkdir -p ../../litegen-core/target/debug
          install -m 755 "$RUNNER_TEMP/litegen/litegen" ../../litegen-core/target/debug/litegen
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -rs 2>&1 | tee "$RUNNER_TEMP/pytest.log"
      - name: No test skipped itself
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/no-skips.sh" "$RUNNER_TEMP/pytest.log"

  viewer:
    name: 3D viewer (packages/3d-viewer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/3d-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/3d-viewer/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  converter:
    name: 3D converter (Rust, npm package, PyPI wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/3d-converter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (its rust-toolchain.toml, with the wasm32 target)
        run: rustup toolchain install && cargo --version && rustup target list --installed
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/3d-converter
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/3d-converter/js/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The wheel's floor and the newest release; the last one listed is `python3`.
          python-version: |
            3.10
            3.14
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.13
      - name: wasm-bindgen and wasm-opt
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-wasm-tools.sh"
      - name: Clippy (every crate, then the npm crate for wasm32)
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked -p litegen-3d-converter-js --target wasm32-unknown-unknown -- -D warnings
      - name: Core tests
        run: cargo test --locked -p litegen-3d-converter
      - name: npm package (build, then test the built package)
        run: |
          node js/scripts/build.mjs
          cd js && npm ci --no-audit --no-fund && npm test 2>&1 | tee "$RUNNER_TEMP/node-test.log"
      - name: PyPI wheel (the stub, then the wheel)
        run: |
          bash python/scripts/build.sh
          bash "$GITHUB_WORKSPACE/.github/scripts/unchanged.sh" packages/3d-converter/python/litegen_3d_converter.pyi
      - name: Python tests on 3.10 and 3.14
        working-directory: packages/3d-converter/python
        run: |
          for py in 3.10 3.14; do
            uv venv --python "$py" ".venv$py"
            uv pip install --python ".venv$py/bin/python" -r requirements-test.txt dist/*.whl
            ".venv$py/bin/python" -m pytest -q -rs tests 2>&1 | tee -a "$RUNNER_TEMP/pytest.log"
          done
      - name: No test skipped itself
        if: ${{ !cancelled() }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/no-skips.sh" "$RUNNER_TEMP/node-test.log"
          bash "$GITHUB_WORKSPACE/.github/scripts/no-skips.sh" "$RUNNER_TEMP/pytest.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: converter-js-dist
          path: packages/3d-converter/js/dist/
          if-no-files-found: error
          retention-days: 3

  converter-app:
    name: 3D converter app (apps/3d-converter)
    needs: converter
    runs-on: ubuntu-latest
    # Its e2e suite draws WebGL in software on one worker: about 10 min on a
    # fast Mac, more on the runner.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/3d-converter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/3d-converter/package-lock.json
            packages/3d-viewer/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The app links @litegen/3d-converter, whose package is its built dist/.
          name: converter-js-dist
          path: packages/3d-converter/js/dist
      - name: "@litegen/3d-viewer's own packages"
        working-directory: packages/3d-viewer
        run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps --only-shell chromium
      # PW_PROJECT starts only that suite's server (the built app, or the
      # built Storybook); without it each suite waits for both.
      - run: npm run test:e2e
        env:
          PW_PROJECT: e2e
      - run: npm run build-storybook
      - run: npm run test:stories
        env:
          PW_PROJECT: stories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: converter-app-results
          path: apps/3d-converter/test-results/
          retention-days: 7

  mcp:
    name: MCP (smoke and OAuth sign-in, with the MCP SDK)
    needs: release-binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/mcp-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/mcp-smoke/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: litegen-release
          path: ${{ runner.temp }}/litegen
      - run: chmod +x "$RUNNER_TEMP/litegen/litegen" && npm ci --no-audit --no-fund
      - name: Smoke (/mcp and /admin/mcp with a key, and a generation)
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/serve.sh" smoke 4000 LITEGEN__MASTER_KEY=ci-master-key
          export LITEGEN_API_KEY=ci-master-key
          LITEGEN_MCP_URL=http://127.0.0.1:4000/mcp node smoke.mjs --generate mock/visual-image-gen
          LITEGEN_MCP_URL=http://127.0.0.1:4000/admin/mcp node smoke.mjs
      - name: OAuth sign-in end to end (fresh single-tenant server)
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/serve.sh" oauth 4001 LITEGEN__MASTER_KEY=ci-master-key LITEGEN__MCP__OAUTH__ACCESS_TOKEN_TTL_SECS=3
          LITEGEN_BASE_URL=http://127.0.0.1:4001 node oauth-e2e.mjs
      - name: The servers' logs
        if: ${{ always() }}
        run: tail -n 60 "$RUNNER_TEMP"/litegen-*.log || true

  scripts:
    name: scripts (model-drift, SDK spec fetch, deploy and mesh-verify unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/mesh-verify/package-lock.json
      - name: model-drift (offline; the weekly drift run itself fetches vendor pages)
        run: node --test 'scripts/model-drift/test/*.test.mjs' 2>&1 | tee "$RUNNER_TEMP/node-test.log"
      - name: fetch-openapi.sh (copies of it against stub gateways and a stub server; needs bash, curl and python3)
        run: node --test --test-concurrency=1 'sdks/scripts/*.test.mjs' 2>&1 | tee -a "$RUNNER_TEMP/node-test.log"
      - name: deploy.js ships the landing export its own build wrote (no npm, wrangler or SSH is run)
        run: node --test 'scripts/deploy/*.test.mjs' 2>&1 | tee -a "$RUNNER_TEMP/node-test.log"
      - name: Khronos's material-layer schemas (one mesh-verify test reads them)
        run: |
          bash .github/scripts/khronos-schemas.sh "$RUNNER_TEMP/khronos-schemas"
          echo "KHRONOS_SCHEMAS=$RUNNER_TEMP/khronos-schemas" >> "$GITHUB_ENV"
      - name: xmllint (one mesh-verify test validates Collada against a local schema with it)
        run: command -v xmllint || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils; }
      - name: mesh-verify
        working-directory: scripts/mesh-verify
        run: npm ci --no-audit --no-fund && node --test '*.test.mjs' 2>&1 | tee -a "$RUNNER_TEMP/node-test.log"
      - name: No test skipped itself
        if: ${{ !cancelled() }}
        run: bash .github/scripts/no-skips.sh "$RUNNER_TEMP/node-test.log"

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [actionlint, core, release-binary, docker, dashboard, dashboard-e2e, landing, price-api, sdk-typescript, sdk-python, viewer, converter, converter-app, mcp, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
