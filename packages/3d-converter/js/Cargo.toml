[package]
name = "litegen-3d-converter-js"
description = "The wasm-bindgen binding behind the npm package @litegen/3d-converter."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
litegen-3d-converter = { path = "../core" }
# Exact: the CLI that generates the JS glue (packages/3d-converter/.tools/bin)
# must be this same version.
wasm-bindgen = "=0.2.130"
js-sys = "0.3.107"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11"
serde_path_to_error = "0.1"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }

[dev-dependencies]
serde_json = "1"
