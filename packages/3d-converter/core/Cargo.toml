[package]
name = "litegen-3d-converter"
description = "Convert 3D models between glb, gltf, obj, stl, ply, 3mf, dae, fbx, usdz and usda: litegen's converter as a library."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "litegen_3d_converter"

[dependencies]
litegen-mesh = { path = "../mesh" }
# File names are compared in Unicode's composed form (NFC): macOS and the zips
# it makes decompose names, while exporters write references composed. The
# version litegen-core already locks.
unicode-normalization = "0.1"

[dev-dependencies]
# The same spec as litegen-mesh's, for tests that encode WebP textures.
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }
serde_json = "1"
toml = "1"
