  - id: openai/gpt-image-2
    provider: openai
    media_type: image
    display_name: GPT Image 2
    docs_url: https://developers.openai.com/api/reference/resources/images/methods/generate
    description: OpenAI GPT Image 2. Text-to-image plus prompt-driven editing
      and inpainting via the images/edits endpoint. Arbitrary resolutions
      (both dimensions divisible by 16, aspect ratio between 1:3 and 3:1).
    # GPT Image 2 at 1024 × 1024, "Low $0.006", "Medium $0.053", "High
    # $0.211" (the guide's "Historical output costs" table). The default
    # quality is `auto`, which OpenAI picks per image, so it bills at the
    # medium anchor: OpenAI publishes no price for `auto`.
    # @see https://developers.openai.com/api/docs/guides/image-generation.md (2026-11-09)
    pricing:
      base_cost_usd: 0.053
      # By quality, OpenAI's own 1024 × 1024 prices, then by size past
      # 1024 × 1024, as GPT Image bills its output tokens.
      # @see https://developers.openai.com/api/docs/guides/image-generation.md (Historical output costs, 2026-11-09)
      variable_pricing:
        - { when: { quality: low }, usd: 0.006 }
        - { when: { quality: high }, usd: 0.211 }
        - { multiply_per_megapixel_above: 1.048576 }
    # The model page lists images/edits as "Supported" and inpainting as a
    # supported feature; the adapter routes a reference image to images/edits.
    # @see https://developers.openai.com/api/docs/models/gpt-image-2
    capabilities: { text_to_image: true, image_to_image: true, inpainting: true }
    prompt: { required: true, max_length: 32000 }
    params:
      # PixelGenie L9; "The default format is `png`, but you can also request
      # `jpeg` or `webp`." (guide, "Output format"); background "Must be one of
      # `transparent`, `opaque`, or `auto` (default value)" (reference): litegen
      # sends none when the caller names none. (2026-11-09)
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      background: { kind: string, enum_values: [transparent, opaque] }
      # gpt-image-2 size constraints: max edge <= 3840, both edges multiples of
      # 16, long:short <= 3:1, 655,360..=8,294,400 total pixels; 2160x3840 (4K
      # portrait) is a listed size. Per-edge bounds cannot hold the pixel rule,
      # so they hold its implication: no edge under 480 reaches 655,360 px
      # within 3:1. Resolutions above 2560x1440 are experimental.
      # @see https://developers.openai.com/api/docs/guides/image-generation (GPT Image 2 settings)
      size:
        kind: size
        mode: freeform
        min_width: 480
        max_width: 3840
        min_height: 480
        max_height: 3840
        multiple_of: 16
        # "The total pixel count must be between 655,360 and 8,294,400 (4K)."
        # and "Long edge to short edge ratio must not exceed `3:1`" (guide,
        # 2026-11-09) — refused before billing, not snapped.
        min_pixels: 655360
        max_pixels: 8294400
        max_aspect: 3.0
      quality:
        kind: string
        enum_values: [auto, low, medium, high]
        default: auto
      # 3D doc §4: "A mask-only vendor receives the box drawn as a mask".
      region: { kind: region, input: mask, label: Region, description: "The rectangle to edit, sent drawn as the mask." }
    # "You can use one or more images as a reference to generate a new image":
    # `image` is "an array of images" (maxItems 16), sent as repeated image[]
    # parts, and "If you provide multiple input images, the mask will be
    # applied to the first image" — so the edited image (`init`) goes first.
    # @see https://developers.openai.com/api/docs/guides/image-generation.md (2026-11-03)
    ref_inputs:
      max_total: 17
      default_role: init
      provider_format: { form: multipart, field_map: { init: image, reference: image, mask: mask } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 15 }
        mask: { required: false, min_count: 0, max_count: 1, convention: transparent_edits }
    # `user` is deprecated in favour of `safety_identifier` (guide: "Send the
    # same identifier as `safety_identifier` instead."; reference: "Deprecated:
    # use `safety_identifier` instead. This parameter remains accepted for
    # backward compatibility and is used when `safety_identifier` is omitted,
    # null, or empty."), and still accepted.
    # @see https://developers.openai.com/api/docs/guides/image-generation (2026-11-09)
    # @see https://developers.openai.com/api/reference/resources/images/methods/generate (2026-11-09)
    extra_allowlist: [output_compression, moderation, user, safety_identifier]
    extra_params:
      # From OpenAI's OpenAPI (drift snapshot openai/openapi.txt).
      output_compression: { kind: int, min: 0, max: 100, default: 100 }
      moderation: { kind: string, enum_values: ["low", "auto"], default: "auto" }
      user: { kind: string }
      safety_identifier: { kind: string, max_length: 128 }
    tags: [text-to-image, image-to-image, inpainting]
