      # tokens for low / medium / high / xhigh / max at 1024x1024; `auto`
      # stays at medium — and by size past 1024x1024.
      # @see https://developers.openai.com/api/docs/guides/image-generation#calculating-costs (counts re-derived from the component's script, 2026-11-09)
      variable_pricing:
