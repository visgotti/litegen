models:
  # DALL-E 2 and DALL-E 3 were shut down on 2026-05-12. OpenAI's stated
  # replacements are "gpt-image-2, gpt-image-1, or gpt-image-1-mini".
  # gpt-image-1-mini / gpt-image-1.5 / chatgpt-image-latest are themselves
  # scheduled for shutdown on 2026-12-01, and gpt-image-1 on 2026-10-23
  # (replacement gpt-image-2), so gpt-image-2 is the only long-lived id here.
  # @see https://developers.openai.com/api/docs/deprecations
  - id: openai/gpt-image-2
    provider: openai
    media_type: image
    display_name: GPT Image 2
    description: OpenAI GPT Image 2. Text-to-image plus prompt-driven editing
      and inpainting via the images/edits endpoint. Arbitrary resolutions
      (both dimensions divisible by 16, aspect ratio between 1:3 and 3:1).
    pricing: { base_cost_usd: 0.04 }
    # The model page lists images/edits as "Supported" and inpainting as a
    # supported feature; the adapter routes a reference image to images/edits.
    # @see https://developers.openai.com/api/docs/models/gpt-image-2
    capabilities: { text_to_image: true, image_to_image: true, inpainting: true }
    prompt: { required: true, max_length: 32000 }
    params:
      # gpt-image-2 accepts arbitrary WIDTHxHEIGHT; resolutions above 2560x1440
      # are experimental and 3840x2160 is the ceiling.
      size:
        kind: size
        mode: freeform
        min_width: 256
        max_width: 3840
        min_height: 256
        max_height: 2160
        multiple_of: 16
      quality:
        kind: string
        enum_values: [auto, low, medium, high]
        default: auto
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: multipart, field_map: { init: image, mask: mask } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [background, output_format, output_compression, moderation, user]
    tags: [text-to-image, image-to-image, inpainting]

  - id: openai/gpt-image-1
    provider: openai
    media_type: image
    display_name: GPT Image 1
    # Shutdown announced for 2026-10-23, replacement gpt-image-2.
    # @see https://developers.openai.com/api/docs/deprecations
    description: "DEPRECATED: OpenAI shuts gpt-image-1 down on 2026-10-23
      (replacement gpt-image-2). OpenAI GPT Image 1. Text-to-image plus
      prompt-driven editing and inpainting via the images/edits endpoint."
    pricing: { base_cost_usd: 0.04 }
    capabilities: { text_to_image: true, image_to_image: true, inpainting: true }
    prompt: { required: true, max_length: 32000 }
    params:
      size:
        kind: size
        mode: enum
        values:
          - [1024, 1024]
          - [1536, 1024]
          - [1024, 1536]
      quality:
        kind: string
        enum_values: [auto, low, medium, high]
        default: auto
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: multipart, field_map: { init: image, mask: mask } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [background, output_format, output_compression, moderation, user]
    tags: [text-to-image, image-to-image, inpainting]

  - id: openai/sora
    provider: openai
    media_type: video
    display_name: Sora 2
    description: "DEPRECATED: OpenAI is shutting down the Videos API and every
      Sora 2 model on 2026-09-24 with no replacement offered. Sora 2
      text-to-video and image-to-video (maps to the `sora-2` model)."
    pricing: { base_cost_usd: 0.50 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 4000 }
    params:
      # Sora accepts only clip lengths of 4, 8, or 12s; other values snap to the nearest.
      duration_seconds:
        kind: float
        min: 4.0
        max: 12.0
        default: 4.0
      # aspect_ratio + resolution select the Sora `size` (e.g. 1280x720 / 720x1280).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16"]
        default: "16:9"
      resolution:
        kind: string
        enum_values: [720p]
        default: 720p
    ref_inputs:
      max_total: 1
      default_role: init
      # Image-to-video uploads the first frame as a multipart `input_reference` part.
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video]

  - id: openai/sora-2-pro
    provider: openai
    media_type: video
    display_name: Sora 2 Pro
    description: "DEPRECATED: shutting down 2026-09-24 with the rest of the
      Videos API. Higher-fidelity Sora 2 Pro (maps to `sora-2-pro`); adds 1080p sizes."
    pricing: { base_cost_usd: 1.00 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 4000 }
    params:
      duration_seconds:
        kind: float
        min: 4.0
        max: 12.0
        default: 4.0
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16"]
        default: "16:9"
      resolution:
        kind: string
        enum_values: [720p, 1080p]
        default: 1080p
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video, premium]
