models:
  # ─── Photon (image) ───────────────────────────────────────────────────────
  # Async: POST /generations/image -> poll GET /generations/{id}.
  # Reference images are CDN URLs only (materializer uploads base64/blob first).
  - id: luma/photon-1
    provider: luma
    media_type: image
    display_name: Luma Photon
    description: Luma Photon text-to-image with image/style/character references.
    docs_url: https://docs.lumalabs.ai/reference/generateimage
    pricing: { base_cost_usd: 0.015 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 1000 }
    params:
      # "format … The format of the image": ImageFormat `jpg | png` ("default":
      # "jpg"), sent as `format` (jpeg → jpg). PixelGenie L9's "Luma always
      # returns JPEG" predates it.
      # @see https://docs.lumalabs.ai/reference/generateimage.md (2026-11-03)
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","3:4","4:3","9:16","16:9","9:21","21:9"]
        default: "16:9"
    ref_inputs:
      max_total: 4
      default_role: init
      provider_format: { form: url }
      # @see https://docs.lumalabs.ai/docs/image-generation.md (2026-10-30):
      #   "You should upload and use your own cdn image urls, currently this is
      #   the only way to pass an image" — no data: URIs, so litegen publishes
      #   an uploaded reference at its own URL (L4).
      data_uri: false
      roles:
        init:      { required: false, min_count: 0, max_count: 4 }
        style:     { required: false, min_count: 0, max_count: 4 }
        character: { required: false, min_count: 0, max_count: 4 }
        modify:    { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

  - id: luma/photon-flash-1
    provider: luma
    media_type: image
    display_name: Luma Photon Flash
    description: Faster, cheaper Photon variant.
    docs_url: https://docs.lumalabs.ai/reference/generateimage
    pricing: { base_cost_usd: 0.002 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 1000 }
    params:
      # "format … The format of the image": ImageFormat `jpg | png` ("default":
      # "jpg"), sent as `format` (jpeg → jpg). PixelGenie L9's "Luma always
      # returns JPEG" predates it.
      # @see https://docs.lumalabs.ai/reference/generateimage.md (2026-11-03)
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","3:4","4:3","9:16","16:9","9:21","21:9"]
        default: "16:9"
    ref_inputs:
      max_total: 4
      default_role: init
      provider_format: { form: url }
      # @see https://docs.lumalabs.ai/docs/image-generation.md (2026-10-30):
      #   "You should upload and use your own cdn image urls, currently this is
      #   the only way to pass an image" — no data: URIs, so litegen publishes
      #   an uploaded reference at its own URL (L4).
      data_uri: false
      roles:
        init:      { required: false, min_count: 0, max_count: 4 }
        style:     { required: false, min_count: 0, max_count: 4 }
        character: { required: false, min_count: 0, max_count: 4 }
        modify:    { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image, fast]

  - id: luma/dream-machine
    provider: luma
    media_type: video
    display_name: Luma Dream Machine
    description: Luma Dream Machine text/image-to-video (sent as ray-2) with first and last keyframes, 5 or 9 s, optional loop.
    docs_url: https://docs.lumalabs.ai/reference/creategeneration
    # Sent as ray-2, so priced as luma/ray-2 at 1080p and 4k: "Create cost (for
    # 5s Ray 2 video)" "1080p | 0.95", "4k | 1.05". Luma publishes no 9 s price
    # and none below 1080p, so 9 s bills the 5 s price and the base stays as set.
    # @see https://docs.lumalabs.ai/changelog/upscale.md (2026-11-09)
    pricing:
      base_cost_usd: 0.35
      variable_pricing:
        - { when: { resolution: 1080p }, usd: 0.95 }
        - { when: { resolution: 4k }, usd: 1.05 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "Prompt is too short, minimum length is 3 characters", "Prompt is too long,
    # maximum length is 5000 characters".
    # @see https://docs.lumalabs.ai/docs/errors.md (2026-10-30)
    prompt: { required: true, min_length: 3, max_length: 5000 }
    params:
      # GenerationRequest.loop, sent as Luma's own `loop`; "Loop is not supported for
      # keyframes", so the adapter refuses a loop with a last frame.
      # @see https://docs.lumalabs.ai/docs/errors.md (2026-10-30)
      loop: { kind: bool, default: false }
      # Sent as ray-2. VideoModelOutputDuration enum: "5s" | "9s" (3s is not a
      # value). VideoModelOutputResolution enum: 540p | 720p | 1080p | 4k.
      # @see https://docs.lumalabs.ai/reference/creategeneration
      duration_seconds: { kind: float, min: 5.0, max: 9.0, values: [5.0, 9.0] }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","4:3","3:4","21:9","9:21"]
      resolution:
        kind: string
        enum_values: [540p, 720p, 1080p, 4k]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: url }
      # @see https://docs.lumalabs.ai/docs/image-generation.md (2026-10-30):
      #   "You should upload and use your own cdn image urls, currently this is
      #   the only way to pass an image" — no data: URIs, so litegen publishes
      #   an uploaded reference at its own URL (L4).
      data_uri: false
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    tags: [text-to-video, image-to-video]

  - id: luma/ray-2
    provider: luma
    media_type: video
    display_name: Luma Ray 2
    description: Luma Ray 2 text/image-to-video with first and last keyframes, 5 or 9 s, 540p to 4K, optional loop.
    docs_url: https://docs.lumalabs.ai/reference/creategeneration
    # "Create cost (for 5s Ray 2 video)": "1080p | 0.95", "4k | 1.05". Luma
    # publishes no 9 s price and none below 1080p, so 9 s bills the 5 s price
    # and the base stays as set.
    # @see https://docs.lumalabs.ai/changelog/upscale.md (2026-11-09)
    pricing:
      base_cost_usd: 0.40
      variable_pricing:
        - { when: { resolution: 1080p }, usd: 0.95 }
        - { when: { resolution: 4k }, usd: 1.05 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "Prompt is too short, minimum length is 3 characters", "Prompt is too long,
    # maximum length is 5000 characters".
    # @see https://docs.lumalabs.ai/docs/errors.md (2026-10-30)
    prompt: { required: true, min_length: 3, max_length: 5000 }
    params:
      # GenerationRequest.loop, sent as Luma's own `loop`; "Loop is not supported for
      # keyframes", so the adapter refuses a loop with a last frame.
      # @see https://docs.lumalabs.ai/docs/errors.md (2026-10-30)
      loop: { kind: bool, default: false }
      duration_seconds: { kind: float, min: 5.0, max: 9.0, values: [5.0, 9.0] }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","4:3","3:4","21:9","9:21"]
      # "possible values for resolution: 540p, 720p, 1080p, 4k" (create, ray-2).
      # @see https://docs.lumalabs.ai/reference/creategeneration
      # @see https://docs.lumalabs.ai/changelog/upscale
      resolution:
        kind: string
        enum_values: [540p, 720p, 1080p, 4k]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: url }
      # @see https://docs.lumalabs.ai/docs/image-generation.md (2026-10-30):
      #   "You should upload and use your own cdn image urls, currently this is
      #   the only way to pass an image" — no data: URIs, so litegen publishes
      #   an uploaded reference at its own URL (L4).
      data_uri: false
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video]

  - id: luma/ray-flash-2
    provider: luma
    media_type: video
    display_name: Luma Ray Flash 2
    description: Luma Ray Flash 2 text/image-to-video, faster and cheaper than Ray 2, with first and last keyframes, 5 or 9 s, optional loop.
    docs_url: https://docs.lumalabs.ai/reference/creategeneration
    pricing: { base_cost_usd: 0.20 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "Prompt is too short, minimum length is 3 characters", "Prompt is too long,
    # maximum length is 5000 characters".
    # @see https://docs.lumalabs.ai/docs/errors.md (2026-10-30)
    prompt: { required: true, min_length: 3, max_length: 5000 }
    params:
      # GenerationRequest.loop, sent as Luma's own `loop`; "Loop is not supported for
      # keyframes", so the adapter refuses a loop with a last frame.
      # @see https://docs.lumalabs.ai/docs/errors.md (2026-10-30)
      loop: { kind: bool, default: false }
      duration_seconds: { kind: float, min: 5.0, max: 9.0, values: [5.0, 9.0] }
      # POST /generations/video takes the same AspectRatio and
      # VideoModelOutputResolution enums for ray-flash-2 as for ray-2.
      # @see https://docs.lumalabs.ai/reference/creategeneration
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","4:3","3:4","21:9","9:21"]
      resolution:
        kind: string
        enum_values: [540p, 720p, 1080p, 4k]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: url }
      # @see https://docs.lumalabs.ai/docs/image-generation.md (2026-10-30):
      #   "You should upload and use your own cdn image urls, currently this is
      #   the only way to pass an image" — no data: URIs, so litegen publishes
      #   an uploaded reference at its own URL (L4).
      data_uri: false
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video, fast]
