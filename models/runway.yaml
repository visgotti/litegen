models:
  # ─── Gen-4 image ──────────────────────────────────────────────────────────
  # Async: POST /text_to_image -> poll GET /tasks/{id}. ratio is pixel WxH.
  - id: runway/gen4_image
    provider: runway
    media_type: image
    display_name: Runway Gen-4 Image
    description: Runway Gen-4 text-to-image with @tag reference images.
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1text_to_image/post
    pricing: { base_cost_usd: 0.08 }
    capabilities: { text_to_image: true, image_to_image: true }
    # promptText: "A non-empty string up to 1000 characters".
    # @see https://docs.dev.runwayml.com/openapi.json (POST /v1/text_to_image)
    prompt: { required: true, max_length: 1000 }
    params:
      seed: { kind: seed, min: 0, max: 4294967295 }
      aspect_ratio:
        kind: aspect_ratio
        # Runway's ratio enum has no true 3:2 pair, so 3:2 / 2:3 are not offered.
        allowed: ["16:9","9:16","1:1","4:3","3:4","21:9"]
        default: "16:9"
    ref_inputs:
      max_total: 3
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 3 }
    extra_allowlist: [contentModeration]
    tags: [text-to-image, image-to-image]

  - id: runway/gen4_image_turbo
    provider: runway
    media_type: image
    display_name: Runway Gen-4 Image Turbo
    description: Faster, cheaper Gen-4 image (requires at least one reference image).
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1text_to_image/post
    pricing: { base_cost_usd: 0.02 }
    # Not text_to_image: a prompt-only request cannot succeed (referenceImages
    # is required: "An array of one to three images to be used as references
    # for the generated image output").
    # @see https://docs.dev.runwayml.com/openapi.json (POST /v1/text_to_image, 2026-10-30)
    capabilities: { image_to_image: true }
    # promptText: "A non-empty string up to 1000 characters".
    # @see https://docs.dev.runwayml.com/openapi.json (POST /v1/text_to_image)
    prompt: { required: true, max_length: 1000 }
    params:
      seed: { kind: seed, min: 0, max: 4294967295 }
      aspect_ratio:
        kind: aspect_ratio
        # Runway's ratio enum has no true 3:2 pair, so 3:2 / 2:3 are not offered.
        allowed: ["16:9","9:16","1:1","4:3","3:4","21:9"]
        default: "16:9"
    ref_inputs:
      max_total: 3
      default_role: init
      provider_format: { form: url }
      roles:
        # referenceImages is required for gen4_image_turbo ("An array of one to
        # three images"); required: false let a zero-ref request through to a 400.
        # @see https://docs.dev.runwayml.com/openapi.json (POST /v1/text_to_image)
        init: { required: true, min_count: 1, max_count: 3 }
    extra_allowlist: [contentModeration]
    tags: [image-to-image, fast]

  # ─── Resold image models ────────────────────────────────────────────────
  # Third-party image models Runway sells on the same POST /v1/text_to_image
  # endpoint and task API as gen4_image, carried as runway routes beside each
  # vendor's own (the hub-route policy, 2026-11-04). Each row is its model's
  # branch of the request union: litegen's aspect_ratio (and resolution tier,
  # where the branch has several) picks one of the branch's `ratio` sizes
  # (image/runway.rs RESOLD); outputCount is never sent (one image a call).
  # Not carried: recraft_v4_1_flash and recraft_v4_1_vector (no price on the
  # pricing guide).
  # @see https://docs.dev.runwayml.com/openapi.json (2026-11-10)
  # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-11-10)
  - id: runway/gpt_image_2
    provider: runway
    media_type: image
    display_name: GPT Image 2 (Runway)
    description: OpenAI's GPT Image 2 through Runway's API — text-to-image and edits from up to 16 images, 1K to 4K.
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1text_to_image/post
    # "Credits can be purchased for $0.01 per credit"; gpt_image_2:
    #   `gpt_image_2` is billed as credits per image × `outputCount`. The `auto` resolution is billed at the 4K tier. Default quality is `high`.
    #   | `high`   | 20        | 41                |
    # The default request is 20 credits = $0.20.
    # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-11-10)
    pricing:
      base_cost_usd: 0.2
      variable_pricing:
        - { when: { quality: low }, usd: 0.01 }
        - { when: { quality: low, resolution: "4K" }, usd: 0.02 }
        - { when: { quality: medium }, usd: 0.05 }
        - { when: { quality: medium, resolution: "4K" }, usd: 0.11 }
        - { when: { quality: high, resolution: "4K" }, usd: 0.41 }
        - { when: { quality: auto }, usd: 0.2 }
        - { when: { quality: auto, resolution: "4K" }, usd: 0.41 }
    # The gpt_image_2 branch of POST /v1/text_to_image (required ["promptText","ratio","model"]).
    # @see https://docs.dev.runwayml.com/openapi.json (2026-11-10)
    capabilities: { text_to_image: true, image_to_image: true }
    # promptText: maxLength 32000.
    prompt: { required: true, max_length: 32000 }
    params:
      # aspect_ratio × resolution → `ratio`: one size per cell of the branch's `ratio` enum
      # (image/runway.rs GPT_IMAGE_2_SIZES).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
        default: "1:1"
      resolution: { kind: string, enum_values: ["1K", "2K", "4K"], default: "1K" }
      quality: { kind: string, enum_values: [low, medium, high, auto], default: high }
      background: { kind: string, enum_values: [transparent, opaque] }
    ref_inputs:
      max_total: 16
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 16 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

  - id: runway/gpt_image_2_5_flare
    provider: runway
    media_type: image
    display_name: GPT Image 2.5 Flare (Runway)
    description: OpenAI's GPT Image 2.5 Flare through Runway's API — text-to-image and edits from up to 16 images, 1K to 4K.
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1text_to_image/post
    # "Credits can be purchased for $0.01 per credit"; gpt_image_2_5_flare:
    #   `gpt_image_2_5_flare` and `gpt_image_2_5_sunburst` are billed on the same tables, as (credits per image + 1 credit per reference image) × `outputCount`
    #   | `high`   | 11 | 8 | 7 | 6 | 5 | 4 | (1K: 1:1, 4:5/5:4, 3:4/4:3, 2:3/3:2, 9:16/16:9, 21:9)
    # The default request is 11 credits = $0.11.
    # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-11-10)
    pricing:
      base_cost_usd: 0.11
