  - id: runway/happyhorse_1_0
    provider: runway
    media_type: video
    display_name: HappyHorse 1.0 (Runway)
    description: HappyHorse 1.0 through Runway's API — text-to-video, image-to-video (first frame); 3–15 s, 720p to 1080p.
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1image_to_video/post
    # "Credits can be purchased for $0.01 per credit"; happyhorse_1_0:
    #   | `happyhorse_1_0` (720p) | 15 credits per second
    #   | `happyhorse_1_0` (1080p) | 30 credits per second
    # The default request (720p, 5 s) is 15 × 5 = 75 credits = $0.75.
    # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-11-10)
    pricing:
      base_cost_usd: 0.75
      variable_pricing:
        - { per_second_usd: 0.15 }
        - { when: { resolution: "1080p" }, per_second_usd: 0.3 }
    # The happyhorse_1_0 branches of POST /v1/text_to_video and /v1/image_to_video:
    # text-to-video requires ["promptText","model"], image-to-video ["promptImage","model"].
    # @see https://docs.dev.runwayml.com/openapi.json (2026-11-10)
    capabilities: { text_to_video: true, image_to_video: true }
    # promptText is optional on image-to-video only: a text-to-video request (no first frame) without one is refused at validation, before anything is quoted or reserved.
    prompt: { required: false, required_for_text_to_video: true, min_length: 2, max_length: 2500 }
    params:
      duration_seconds: { kind: int, min: 3, max: 15, default: 5 }
      # `ratio`: text-to-video always sent; image-to-video not sent: the image sets the shape. Each aspect × tier is one size of the branch's enum (video/runway.rs HAPPYHORSE_1_0_SIZES).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "3:4", "4:3", "9:16", "16:9"]
        default: "16:9"
        # image_to_video's happyhorse_1_0 branch: duration, model, promptImage,
        # promptText, resolution — no ratio, so a frame sets the shape (E5).
        # @see https://docs.dev.runwayml.com/openapi.json (2026-11-11)
        frames_set_shape: without_references
      # `resolution` on image-to-video (text-to-video takes the tier through `ratio`).
      resolution: { kind: string, enum_values: [720p, 1080p], default: 720p }
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video]
