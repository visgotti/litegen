models:
  # ─── Gen-4 image ──────────────────────────────────────────────────────────
  # Async: POST /text_to_image -> poll GET /tasks/{id}. ratio is pixel WxH.
  - id: runway/gen4_image
    provider: runway
    media_type: image
    display_name: Runway Gen-4 Image
    description: Runway Gen-4 text-to-image with @tag reference images.
    pricing: { base_cost_usd: 0.08 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 5500 }
    params:
      seed: { kind: seed, min: 0, max: 4294967295 }
      aspect_ratio:
        kind: aspect_ratio
        # Runway's ratio enum has no true 3:2 pair, so 3:2 / 2:3 are not offered.
        allowed: ["16:9","9:16","1:1","4:3","3:4","21:9"]
        default: "16:9"
    ref_inputs:
      max_total: 3
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 3 }
    extra_allowlist: [contentModeration]
    tags: [text-to-image, image-to-image]

  - id: runway/gen4_image_turbo
    provider: runway
    media_type: image
    display_name: Runway Gen-4 Image Turbo
    description: Faster, cheaper Gen-4 image (requires at least one reference image).
    pricing: { base_cost_usd: 0.02 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 5500 }
    params:
      seed: { kind: seed, min: 0, max: 4294967295 }
      aspect_ratio:
        kind: aspect_ratio
        # Runway's ratio enum has no true 3:2 pair, so 3:2 / 2:3 are not offered.
        allowed: ["16:9","9:16","1:1","4:3","3:4","21:9"]
        default: "16:9"
    ref_inputs:
      max_total: 3
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 1, max_count: 3 }
    extra_allowlist: [contentModeration]
    tags: [text-to-image, image-to-image, fast]

  # gen3a_turbo was removed from the Runway API on 2026-07-30 ("Requests that
  # use these model identifiers will fail"). gen4_turbo is the fast tier and
  # gen4.5 the quality tier.
  # @see https://docs.dev.runwayml.com/api-details/api_changelog/
  - id: runway/gen4-turbo
    provider: runway
    media_type: video
    display_name: Runway Gen-4 Turbo
    description: Runway Gen-4 Turbo image-to-video and text-to-video.
    pricing: { base_cost_usd: 0.25 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 1000 }
    params:
      duration_seconds: { kind: int, min: 2, max: 10, default: 5 }
      seed: { kind: seed, min: 0, max: 4294967295 }
      # Runway video `ratio` is a pixel-pair string. The gen4 enum is exactly
      # these six values; 1280:768 / 768:1280 were gen3-era and now 400.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1280:720","720:1280","1104:832","832:1104","960:960","1584:672"]
        default: "1280:720"
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [contentModeration]
    tags: [text-to-video, image-to-video, fast]

  - id: runway/gen4.5
    provider: runway
    media_type: video
    display_name: Runway Gen-4.5
    description: Runway Gen-4.5, the highest-quality Runway video tier.
    pricing: { base_cost_usd: 0.50 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 1000 }
    params:
      duration_seconds: { kind: int, min: 2, max: 10, default: 5 }
      seed: { kind: seed, min: 0, max: 4294967295 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1280:720","720:1280","1104:832","832:1104","960:960","1584:672"]
        default: "1280:720"
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [contentModeration, outputFormat]
    tags: [text-to-video, image-to-video, premium]
