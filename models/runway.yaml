    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1text_to_image/post
    # "Credits can be purchased for $0.01 per credit"; ideogram_vector:
    #   On text to image, it is billed by `quality`, which defaults to `medium`. `high` costs more when the request includes reference images.
    #   | Text to image, `low`                       | 14                |
    #   | Text to image, `medium`                    | 17                |
    #   | Text to image, `high`                      | 22                |
    #   | Text to image, `high` with reference images | 35               |
    # The default request is 17 credits = $0.17.
    # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-11-10)
    pricing:
      base_cost_usd: 0.17
      variable_pricing:
        - { when: { quality: low }, usd: 0.14 }
        - { when: { quality: high }, usd: 0.22 }
        - { when: { quality: high, references: "*" }, usd: 0.35 }
    # The ideogram_vector branch of POST /v1/text_to_image (required ["promptText","model"]).
    # @see https://docs.dev.runwayml.com/openapi.json (2026-11-10)
    capabilities: { text_to_image: true, image_to_image: true }
    # promptText: maxLength 9500.
    prompt: { required: true, max_length: 9500 }
    params:
      quality: { kind: string, enum_values: [low, medium, high], default: medium }
      seed: { kind: seed, min: 0, max: 2147483647 }
    ref_inputs:
      max_total: 5
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 5 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image, vector]

  # gen3a_turbo was removed from the Runway API on 2026-07-30 ("Requests that
  # use these model identifiers will fail"). gen4_turbo is the fast tier and
  # gen4.5 the quality tier.
  # @see https://docs.dev.runwayml.com/api-details/api_changelog/
  - id: runway/gen4-turbo
    provider: runway
    media_type: video
    display_name: Runway Gen-4 Turbo
    description: Runway Gen-4 Turbo image-to-video (requires a first-frame image).
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1image_to_video/post
    # gen4_turbo: "5 credits per second", "$0.01 per credit": the default 5 s is $0.25.
    # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-10-30)
    pricing:
      base_cost_usd: 0.25
      variable_pricing:
        - { per_second_usd: 0.05 }
    # gen4_turbo is only in the POST /v1/image_to_video model union (promptImage
    # required); /v1/text_to_video has no gen4_turbo branch. Its branch is
    # `required: ["promptImage","ratio","model"]`: promptText is optional,
    # "A non-empty string up to 1000 characters", and none is sent when empty.
    # @see https://docs.dev.runwayml.com/openapi.json (2026-10-30)
    capabilities: { image_to_video: true }
    prompt: { required: false, max_length: 1000 }
    params:
      duration_seconds: { kind: int, min: 2, max: 10, default: 5 }
      seed: { kind: seed, min: 0, max: 4294967295 }
      # Runway video `ratio` is a pixel-pair string. The gen4 enum is exactly
      # these six values; 1280:768 / 768:1280 were gen3-era and now 400.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1280:720","720:1280","1104:832","832:1104","960:960","1584:672"]
        default: "1280:720"
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: url }
      # promptImage is required by gen4_turbo's /v1/image_to_video branch: a
      # row with no text mode is refused without an image, sent as first_frame
      # or as init (the role this row took before first_frame).
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [contentModeration]
    tags: [image-to-video, fast]

  - id: runway/gen4.5
    provider: runway
    media_type: video
    display_name: Runway Gen-4.5
    description: Runway Gen-4.5, the highest-quality Runway video tier.
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1image_to_video/post
    # gen4.5: 12 credits per second at $0.01 per credit, so the default 5 s
    # request is 60 credits = $0.60. Verified 2026-09-11.
    # @see https://docs.dev.runwayml.com/guides/pricing.md
    pricing:
      base_cost_usd: 0.6
      variable_pricing:
        - { per_second_usd: 0.12 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 1000 }
    params:
      duration_seconds: { kind: int, min: 2, max: 10, default: 5 }
      seed: { kind: seed, min: 0, max: 4294967295 }
      # gen4.5 on /v1/text_to_video takes only 1280:720 | 720:1280 (the six-value
      # enum is /v1/image_to_video's). One list serves both modes, so it is the
      # text-to-video one; the four i2v-only ratios stay on gen4-turbo.
      # @see https://docs.dev.runwayml.com/openapi.json (POST /v1/text_to_video)
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1280:720","720:1280"]
        default: "1280:720"
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: url }
      # The start frame, as first_frame or as init (the role this row took
      # before first_frame).
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        init: { required: false, min_count: 0, max_count: 1 }
    # No outputFormat / proresProfile: every format but mp4 is another
    # container ("a ProRes .mov", "a .zip of PNG frames", 10-bit .mp4s) at a
    # surcharge (the pricing table: "`prores`, `png_sequence` | 5 credits per
    # second" and "10-bit and HDR profiles (`hdr10`, `hlg`, … ) | 20 credits
    # per second; 40 credits per second when the output is larger than 4
    # megapixels (roughly 4K)"), and this row prices and delivers an H.264
    # .mp4.
    # @see https://docs.dev.runwayml.com/openapi.json (POST /v1/text_to_video, 2026-10-30)
    # @see https://docs.dev.runwayml.com/guides/pricing.md#professional-and-hdr-output-formats (2026-11-09)
    extra_allowlist: [contentModeration]
    tags: [text-to-video, image-to-video, premium]

  # ─── Resold video models ────────────────────────────────────────────────
  # Third-party video models Runway sells on the same POST /v1/text_to_video
  # and /v1/image_to_video endpoints and task API as gen4.5, carried as runway
  # routes beside each vendor's own (the hub-route policy, 2026-11-04). Each
  # row covers its model's two branches: a start frame (and a last frame where
  # promptImage takes position "last") sends image-to-video, otherwise
  # text-to-video; reference images go in `references` on the mode that takes
  # them. aspect_ratio and resolution reach Runway as each mode takes them:
  # one size of the branch's `ratio` enum, the aspect itself, `auto_<tier>`,
  # or a `resolution` field (video/runway.rs RESOLD). Reference video and
  # audio (`referenceVideos`, `referenceAudio`) are not taken.
  # @see https://docs.dev.runwayml.com/openapi.json (2026-11-10)
  # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-11-10)
  - id: runway/veo3.1
    provider: runway
    media_type: video
    display_name: Veo 3.1 (Runway)
    description: Google's Veo 3.1 through Runway's API — text-to-video, image-to-video (first and last frame); 4–8 s, 720p to 1080p.
    docs_url: https://docs.dev.runwayml.com/api/#tag/Start-generating/paths/~1v1~1image_to_video/post
    # "Credits can be purchased for $0.01 per credit"; veo3.1:
    #   | `veo3.1 (audio)` | 40 credits per second
    #   | `veo3.1 (no audio)` | 20 credits per second
    # The default request (720p, audio, 8 s) is 40 × 8 = 320 credits = $3.2.
    # @see https://docs.dev.runwayml.com/guides/pricing.md (2026-11-10)
    pricing:
      base_cost_usd: 3.2
      variable_pricing:
        - { per_second_usd: 0.4 }
        - { when: { audio: false }, per_second_usd: 0.2 }
    # The veo3.1 branches of POST /v1/text_to_video and /v1/image_to_video:
    # text-to-video requires ["promptText","ratio","model"], image-to-video ["promptImage","ratio","model"].
    # @see https://docs.dev.runwayml.com/openapi.json (2026-11-10)
    capabilities: { text_to_video: true, image_to_video: true }
    # promptText is optional on image-to-video only: a text-to-video request (no first frame) without one is refused at validation, before anything is quoted or reserved.
    prompt: { required: false, required_for_text_to_video: true, max_length: 1000 }
    params:
      duration_seconds: { kind: int, min: 4, max: 8, default: 8, values: [4, 6, 8] }
      # `audio` "default": true; sent only when asked.
      audio: { kind: bool, default: true }
      seed: { kind: seed, min: 0, max: 4294967295 }
      negative_prompt: { kind: string, max_length: 1000 }
      # `ratio`: text-to-video always sent; image-to-video always sent. Each aspect × tier is one size of the branch's enum (video/runway.rs VEO3_1_SIZES).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["9:16", "16:9"]
        default: "16:9"
      resolution: { kind: string, enum_values: [720p, 1080p], default: 720p }
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        # A last frame needs a first: Veo "does not support generating with only a last frame", and every promptImage array leads with its first frame (runway.rs `resold_request`).
        last_frame: { required: false, min_count: 0, max_count: 1, needs_first_frame: true }
    extra_allowlist: []
    tags: [text-to-video, image-to-video]

