      # `ratio`: text-to-video always sent; image-to-video sent only when an aspect or a tier is asked (else the image sets the shape); a tier alone is `auto_<tier>`. Each aspect × tier is one size of the branch's enum (video/runway.rs WAN3_SIZES).
      aspect_ratio:
