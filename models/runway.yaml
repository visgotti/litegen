    prompt: { required: true, max_length: 10000 }
    params:
      # aspect_ratio × resolution → `ratio`: one size per cell of the branch's `ratio` enum
      # (image/runway.rs IDEOGRAM_4_5_SIZES).
      # `ratio` is optional on this branch: with no aspect_ratio or resolution asked, none is sent (an edit keeps its image's size); a resolution alone is 1:1 at that tier.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "2:1", "1:2"]
      resolution: { kind: string, enum_values: ["1K", "2K"], default: "1K" }
      quality: { kind: string, enum_values: [very_low, low, medium, high] }
      region: { kind: region, input: mask, label: Region, description: "The rectangle to edit, sent drawn as the mask." }
    ref_inputs:
      max_total: 6
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 5 }
        mask: { required: false, min_count: 0, max_count: 1, convention: black_edits }
    extra_allowlist: [preciseEdit, contextWindow]
    extra_params:
      # A switch: `true` turns it on (the price above, and image/runway.rs `switched_on`).
      preciseEdit: { kind: bool }
    tags: [text-to-image, image-to-image, inpainting]

  - id: runway/ideogram_vector
    provider: runway
    media_type: image
    display_name: Ideogram Vector (Runway)
