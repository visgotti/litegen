  - id: replicate/video
    provider: replicate
    media_type: video
    display_name: Replicate Video (generic)
    description: AnimateDiff text-to-video on Replicate (lucataco/animate-diff).
    docs_url: https://replicate.com/lucataco/animate-diff/versions/beecf59c4aee8d81bf04f0381033dfa10dc16e845b4ae00d281e2fa377e48a9f
    # Billed by GPU time: "costs approximately $0.10 to run" (re-read
    # 2026-09-11).
    # @see https://replicate.com/lucataco/animate-diff
    pricing: { base_cost_usd: 0.10 }
    # The pinned AnimateDiff version's input is exactly {prompt, n_prompt, seed,
    # steps, guidance_scale, motion_module, path}: no image input, so no
    # image_to_video and no ref_inputs; no duration/frame input, so no
    # duration_seconds (it was declared "for intent/pricing", but pricing is flat
    # and the value was never forwarded)
    # (https://replicate.com/lucataco/animate-diff/versions/beecf59c4aee8d81bf04f0381033dfa10dc16e845b4ae00d281e2fa377e48a9f).
    capabilities: { text_to_video: true }
    prompt: { required: true, max_length: 2000 }
    params:
      negative_prompt: { kind: string, max_length: 2000 }
      # "Seed (0 = random, maximum: 2147483647)" on the pinned version.
      # @see https://replicate.com/lucataco/animate-diff/versions/beecf59c4aee8d81bf04f0381033dfa10dc16e845b4ae00d281e2fa377e48a9f (2026-11-09)
      seed: { kind: seed, min: 0, max: 2147483647 }
    # steps/guidance_scale reach AnimateDiff through `extra`. `version` is not
    # allowlisted: extra keys land in `input`, which has no `version`; pin a
    # different version with a `model_mapping` override instead.
    extra_allowlist: [steps, guidance_scale]
    extra_params:
      # From the version's schema (drift snapshot replicate/animate-diff-versions.txt).
      steps: { kind: int, min: 1, max: 100, default: 25 }
      guidance_scale: { kind: float, min: 1, max: 10, default: 7.5 }
    tags: [text-to-video]
