models:
  - id: replicate/flux-pro
    provider: replicate
    media_type: image
    display_name: Flux Pro
    description: Black Forest Labs Flux Pro via Replicate.
    docs_url: https://replicate.com/black-forest-labs/flux-pro/api/schema
    pricing: { base_cost_usd: 0.055 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (litegen says jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # The model's field is `guidance`, 2-5 (https://replicate.com/black-forest-labs/flux-pro/api/schema).
      # No steps: the model marks `steps` deprecated.
      guidance_scale: { kind: float, min: 2.0, max: 5.0, default: 3.0 }
      aspect_ratio:
        kind: aspect_ratio
        # flux-pro's enum has no 21:9 / 9:21 (https://replicate.com/black-forest-labs/flux-pro/api/schema)
        allowed: ["1:1","16:9","2:3","3:2","4:5","5:4","9:16","3:4","4:3"]
        default: "1:1"
    extra_allowlist: [safety_tolerance, output_quality]
    tags: [text-to-image, premium]

  # black-forest-labs/flux-1.1-pro, an official model (POST
  # /v1/models/black-forest-labs/flux-1.1-pro/predictions, no version). Its
  # input is {prompt, aspect_ratio, width, height, image_prompt, seed,
  # safety_tolerance 1-6, output_format, output_quality, prompt_upsampling}:
  # no guidance or steps input, and no negative prompt.
  # @see https://replicate.com/black-forest-labs/flux-1.1-pro/api/schema (re-read 2026-09-11)
  - id: replicate/flux-1.1-pro
    provider: replicate
    media_type: image
    display_name: Flux 1.1 Pro
    description: Black Forest Labs FLUX1.1 [pro] via Replicate.
    docs_url: https://replicate.com/black-forest-labs/flux-1.1-pro/api/schema
    # "$0.04 per output image" (re-read 2026-09-11).
    # @see https://replicate.com/black-forest-labs/flux-1.1-pro
    pricing: { base_cost_usd: 0.04 }
    # Text-to-image only: the model's image input is `image_prompt` (Redux),
    # but the adapter sends reference images as `image`, which this model does
    # not declare.
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (litegen says jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        # The enum minus `custom`: width/height apply only with
        # aspect_ratio=custom, which the adapter never sends, so no `size`.
        allowed: ["1:1","16:9","3:2","2:3","4:5","5:4","9:16","3:4","4:3"]
        default: "1:1"
    extra_allowlist: [safety_tolerance, output_quality, prompt_upsampling]
    tags: [text-to-image, premium]

  - id: replicate/flux-dev
    provider: replicate
    media_type: image
    display_name: Flux Dev
    description: Flux Dev — open weights via Replicate.
    docs_url: https://replicate.com/black-forest-labs/flux-dev/api/schema
    pricing: { base_cost_usd: 0.025 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (litegen says jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      seed: { kind: seed, min: 0, max: 4294967294 }
      guidance_scale: { kind: float, min: 0.0, max: 10.0, default: 3.5 }
      steps: { kind: int, min: 1, max: 50, default: 28 }
      # With an init image the shape is the image's: "The aspect ratio of your
      # output will match this image".
      # @see https://replicate.com/black-forest-labs/flux-dev/api/schema (2026-10-30)
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","21:9","2:3","3:2","4:5","5:4","9:16","9:21","3:4","4:3"]
        default: "1:1"
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [output_quality]
    tags: [text-to-image, image-to-image]

  - id: replicate/flux-schnell
    provider: replicate
    media_type: image
    display_name: Flux Schnell
    description: Fastest Flux variant.
    docs_url: https://replicate.com/black-forest-labs/flux-schnell/api/schema
    pricing: { base_cost_usd: 0.003 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (litegen says jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      # Not reproducible by default: `go_fast` (default true) "outputs will not
      # be deterministic when this is enabled, even if you set a seed".
      # @see https://replicate.com/black-forest-labs/flux-schnell/api/schema (2026-10-30)
      seed: { kind: seed, min: 0, max: 4294967294 }
      steps: { kind: int, min: 1, max: 4, default: 4 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","21:9","2:3","3:2","4:5","5:4","9:16","9:21","3:4","4:3"]
        default: "1:1"
    extra_allowlist: [output_quality]
    tags: [text-to-image, fast]

  - id: replicate/sdxl
    provider: replicate
    media_type: image
    display_name: SDXL on Replicate
    description: SDXL hosted on Replicate.
    docs_url: https://replicate.com/stability-ai/sdxl/versions
    # Replicate bills this community model by GPU time: "costs approximately
    # $0.0015 to run on Replicate, or 666 runs per $1" (re-read 2026-10-30;
    # that is the latest version, 7762fd07, and the pinned 39ed52f2 is still
    # listed). $0.005 covers our 100-step max.
    # @see https://replicate.com/stability-ai/sdxl
    pricing: { base_cost_usd: 0.005 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 2000 }
    params:
      negative_prompt: { kind: string, max_length: 2000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      steps: { kind: int, min: 10, max: 100, default: 50 }
      guidance_scale: { kind: float, min: 1.0, max: 20.0, default: 7.5 }
      size:
        kind: size
        mode: freeform
        min_width: 512
        max_width: 1536
        min_height: 512
        max_height: 1536
        multiple_of: 8
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

  - id: replicate/sd3
    provider: replicate
    media_type: image
    display_name: SD3 on Replicate
    description: SD3 hosted on Replicate.
    docs_url: https://replicate.com/stability-ai/stable-diffusion-3/api/schema
    pricing: { base_cost_usd: 0.035 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (litegen says jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      negative_prompt: { kind: string, max_length: 5000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # The model's fields are `steps` (1-28) and `cfg` (default 3.5) (https://replicate.com/stability-ai/stable-diffusion-3/api/schema)
      steps: { kind: int, min: 10, max: 28, default: 28 }
      guidance_scale: { kind: float, min: 0.0, max: 10.0, default: 3.5 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","21:9","9:21","2:3","3:2","4:5","5:4"]
        default: "1:1"
    extra_allowlist: []
    tags: [text-to-image]

  - id: replicate/video
    provider: replicate
    media_type: video
    display_name: Replicate Video (generic)
    description: AnimateDiff text-to-video on Replicate (lucataco/animate-diff).
    docs_url: https://replicate.com/lucataco/animate-diff/versions/beecf59c4aee8d81bf04f0381033dfa10dc16e845b4ae00d281e2fa377e48a9f
    # Billed by GPU time: "costs approximately $0.10 to run" (re-read
    # 2026-09-11).
    # @see https://replicate.com/lucataco/animate-diff
    pricing: { base_cost_usd: 0.10 }
    # The pinned AnimateDiff version's input is exactly {prompt, n_prompt, seed,
    # steps, guidance_scale, motion_module, path}: no image input, so no
    # image_to_video and no ref_inputs; no duration/frame input, so no
    # duration_seconds (it was declared "for intent/pricing", but pricing is flat
    # and the value was never forwarded)
    # (https://replicate.com/lucataco/animate-diff/versions/beecf59c4aee8d81bf04f0381033dfa10dc16e845b4ae00d281e2fa377e48a9f).
    capabilities: { text_to_video: true }
    prompt: { required: true, max_length: 2000 }
    params:
      negative_prompt: { kind: string, max_length: 2000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
    # steps/guidance_scale reach AnimateDiff through `extra`. `version` is not
    # allowlisted: extra keys land in `input`, which has no `version`; pin a
    # different version with a `model_mapping` override instead.
    extra_allowlist: [steps, guidance_scale]
    tags: [text-to-video]
