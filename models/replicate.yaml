models:
  - id: replicate/flux-pro
    provider: replicate
    media_type: image
    display_name: Flux Pro
    description: Black Forest Labs Flux Pro via Replicate.
    docs_url: https://replicate.com/black-forest-labs/flux-pro/api/schema
    pricing: { base_cost_usd: 0.055 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (Replicate's jpg is litegen's jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # The model's field is `guidance`, 2-5 (https://replicate.com/black-forest-labs/flux-pro/api/schema).
      # No steps: the model marks `steps` deprecated.
      guidance_scale: { kind: float, min: 2.0, max: 5.0, default: 3.0 }
      aspect_ratio:
        kind: aspect_ratio
        # flux-pro's enum has no 21:9 / 9:21 (https://replicate.com/black-forest-labs/flux-pro/api/schema)
        allowed: ["1:1","16:9","2:3","3:2","4:5","5:4","9:16","3:4","4:3"]
        default: "1:1"
    extra_allowlist: [safety_tolerance, output_quality]
    extra_params:
      # From the model's schema (drift snapshots replicate/flux-*-schema.txt).
      safety_tolerance: { kind: int, min: 1, max: 6, default: 2 }
      output_quality: { kind: int, min: 0, max: 100, default: 80 }
    tags: [text-to-image, premium]

  # black-forest-labs/flux-1.1-pro, an official model (POST
  # /v1/models/black-forest-labs/flux-1.1-pro/predictions, no version). Its
  # input is {prompt, aspect_ratio, width, height, image_prompt, seed,
  # safety_tolerance 1-6, output_format, output_quality, prompt_upsampling}:
  # no guidance or steps input, and no negative prompt.
  # @see https://replicate.com/black-forest-labs/flux-1.1-pro/api/schema (re-read 2026-09-11)
  - id: replicate/flux-1.1-pro
    provider: replicate
    media_type: image
    display_name: Flux 1.1 Pro
    description: Black Forest Labs FLUX1.1 [pro] via Replicate.
    docs_url: https://replicate.com/black-forest-labs/flux-1.1-pro/api/schema
    # "$0.04 per output image" (re-read 2026-09-11).
    # @see https://replicate.com/black-forest-labs/flux-1.1-pro
    pricing: { base_cost_usd: 0.04 }
    # Text-to-image only: the model's image input is `image_prompt` (Redux),
    # but the adapter sends reference images as `image`, which this model does
    # not declare.
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (Replicate's jpg is litegen's jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        # The enum minus `custom`: width/height apply only with
        # aspect_ratio=custom, which the adapter never sends, so no `size`.
        allowed: ["1:1","16:9","3:2","2:3","4:5","5:4","9:16","3:4","4:3"]
        default: "1:1"
    extra_allowlist: [safety_tolerance, output_quality, prompt_upsampling]
    extra_params:
      # From the model's schema (drift snapshots replicate/flux-*-schema.txt).
      safety_tolerance: { kind: int, min: 1, max: 6, default: 2 }
      output_quality: { kind: int, min: 0, max: 100, default: 80 }
      prompt_upsampling: { kind: bool, default: false }
    tags: [text-to-image, premium]

  - id: replicate/flux-dev
    provider: replicate
    media_type: image
    display_name: Flux Dev
    description: Flux Dev — open weights via Replicate.
    docs_url: https://replicate.com/black-forest-labs/flux-dev/api/schema
    pricing: { base_cost_usd: 0.025 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # "prompt_strength … Prompt strength when using img2img. 1.0 corresponds
      # to full destruction of information in image" (0-1, default 0.8), sent
      # as prompt_strength; a text-only request ignores it.
      # @see https://replicate.com/black-forest-labs/flux-dev/api/schema (2026-11-03)
      strength: { kind: float, min: 0.0, max: 1.0, default: 0.8 }
      # PixelGenie L9: output_format webp | jpg | png, default webp (Replicate's jpg is litegen's jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      seed: { kind: seed, min: 0, max: 4294967294 }
      guidance_scale: { kind: float, min: 0.0, max: 10.0, default: 3.5 }
      steps: { kind: int, min: 1, max: 50, default: 28 }
      # With an init image the shape is the image's: "The aspect ratio of your
      # output will match this image".
      # @see https://replicate.com/black-forest-labs/flux-dev/api/schema (2026-10-30)
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","21:9","2:3","3:2","4:5","5:4","9:16","9:21","3:4","4:3"]
        default: "1:1"
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [output_quality]
    extra_params:
      # From the model's schema (drift snapshots replicate/flux-*-schema.txt).
      output_quality: { kind: int, min: 0, max: 100, default: 80 }
    tags: [text-to-image, image-to-image]

  - id: replicate/flux-schnell
    provider: replicate
    media_type: image
    display_name: Flux Schnell
    description: Fastest Flux variant.
    docs_url: https://replicate.com/black-forest-labs/flux-schnell/api/schema
    pricing: { base_cost_usd: 0.003 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (Replicate's jpg is litegen's jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      # Not reproducible by default: `go_fast` (default true) "outputs will not
      # be deterministic when this is enabled, even if you set a seed".
      # @see https://replicate.com/black-forest-labs/flux-schnell/api/schema (2026-10-30)
      seed: { kind: seed, min: 0, max: 4294967294 }
      steps: { kind: int, min: 1, max: 4, default: 4 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","21:9","2:3","3:2","4:5","5:4","9:16","9:21","3:4","4:3"]
        default: "1:1"
    extra_allowlist: [output_quality]
    extra_params:
      # From the model's schema (drift snapshots replicate/flux-*-schema.txt).
      output_quality: { kind: int, min: 0, max: 100, default: 80 }
    tags: [text-to-image, fast]

  # FLUX 3 Image on Replicate: an official model, served versionless (POST
  # /v1/models/black-forest-labs/flux-3-image/predictions). Input: prompt,
  # images ("Up to 10 reference images the prompt edits or draws from"),
  # resolution 768sq | 1k | 1.5k | 2k | 4k (default 1k; "Input images are
  # resized to the closest bin, up to 2k"), aspect_ratio (auto or 15 ratios),
  # output_format webp | jpg | png, output_quality 0-100, safety_tolerance 0-4,
  # grounding (default true). No width/height and no seed.
  # @see https://replicate.com/black-forest-labs/flux-3-image/api/schema (2026-11-03)
  - id: replicate/flux-3-image
    provider: replicate
    media_type: image
    display_name: FLUX 3 Image (Replicate)
    description: Black Forest Labs FLUX 3 Image on Replicate — generation and editing with up to ten references and web-grounded prompts.
    docs_url: https://replicate.com/black-forest-labs/flux-3-image/api/schema
    # "$0.0205 per output image [image_output_count] when target resolution
    # equals 768sq", $0.024 at 1k (the default), $0.035 at 1.5k, $0.05 at 2k,
    # $0.3035 at 4k.
    # @see https://replicate.com/black-forest-labs/flux-3-image/api/schema (2026-11-03)
    pricing:
      base_cost_usd: 0.024
      variable_pricing:
        - { when: { resolution: "0.75K" }, usd: 0.0205 }
        - { when: { resolution: "1.5K" }, usd: 0.035 }
        - { when: { resolution: "2K" }, usd: 0.05 }
        - { when: { resolution: "4K" }, usd: 0.3035 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true }
    params:
      # "Format of the output images": webp (Replicate's default) | jpg | png;
      # litegen asks for png unless told otherwise, jpeg sent as jpg.
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9","2:1","16:9","3:2","7:5","4:3","5:4","1:1","4:5","3:4","5:7","2:3","9:16","1:2","9:21"]
      # litegen's tier as Replicate's: 0.75K is 768sq.
      resolution: { kind: string, enum_values: ["0.75K", "1K", "1.5K", "2K", "4K"], default: "1K" }
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 10 }
    extra_allowlist: [grounding, safety_tolerance, output_quality]
    extra_params:
      # From the comment above.
      grounding: { kind: bool, default: true }
      safety_tolerance: { kind: int, min: 0, max: 4 }
      output_quality: { kind: int, min: 0, max: 100 }
    tags: [text-to-image, image-to-image]

  - id: replicate/sdxl
    provider: replicate
    media_type: image
    display_name: SDXL on Replicate
    description: SDXL hosted on Replicate.
    docs_url: https://replicate.com/stability-ai/sdxl/versions
    # Replicate bills this community model by GPU time: "costs approximately
    # $0.0043 to run on Replicate, or 232 runs per $1, but this varies
    # depending on your inputs" (re-read 2026-11-09). $0.005 covers that
    # estimate; Replicate publishes none per step count, so a run near our
    # 100-step max may cost more than it bills.
    # @see https://replicate.com/stability-ai/sdxl (2026-11-09)
    pricing: { base_cost_usd: 0.005 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 2000 }
    params:
      # "prompt_strength … Prompt strength when using img2img. 1.0 corresponds
      # to full destruction of information in image" (0-1, default 0.8), sent
      # as prompt_strength; a text-only request ignores it.
      # @see https://replicate.com/stability-ai/sdxl/api/schema (2026-11-03)
      strength: { kind: float, min: 0.0, max: 1.0, default: 0.8 }
      negative_prompt: { kind: string, max_length: 2000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      steps: { kind: int, min: 10, max: 100, default: 50 }
      guidance_scale: { kind: float, min: 1.0, max: 20.0, default: 7.5 }
      size:
        kind: size
        mode: freeform
        min_width: 512
        max_width: 1536
        min_height: 512
        max_height: 1536
        multiple_of: 8
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

  - id: replicate/sd3
    provider: replicate
    media_type: image
    display_name: SD3 on Replicate
    description: SD3 hosted on Replicate.
    docs_url: https://replicate.com/stability-ai/stable-diffusion-3/api/schema
    pricing: { base_cost_usd: 0.035 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format webp | jpg | png, default webp (Replicate's jpg is litegen's jpeg).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: webp }
      negative_prompt: { kind: string, max_length: 5000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # The model's fields are `steps` (1-28) and `cfg` (default 3.5) (https://replicate.com/stability-ai/stable-diffusion-3/api/schema)
      steps: { kind: int, min: 10, max: 28, default: 28 }
      guidance_scale: { kind: float, min: 0.0, max: 10.0, default: 3.5 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","21:9","9:21","2:3","3:2","4:5","5:4"]
        default: "1:1"
    extra_allowlist: []
    tags: [text-to-image]


  # Stability AI's SD 3.5 on Replicate (official models, versionless: POST
  # /v1/models/stability-ai/stable-diffusion-3.5-*/predictions), carried as
  # Replicate routes beside stability/* (the user, 2026-11-04: "like how
  # litellm can still use openrouter"). Inputs: prompt, aspect_ratio, cfg,
  # seed, image, output_format, negative_prompt, prompt_strength (no steps).
  # @see https://replicate.com/stability-ai/stable-diffusion-3.5-large/llms.txt (2026-11-04)

  - id: replicate/sd3.5-large
    provider: replicate
    media_type: image
    display_name: Stable Diffusion 3.5 Large (Replicate)
    description: Stability AI SD 3.5 Large on Replicate — text-to-image and image-to-image.
    docs_url: https://replicate.com/stability-ai/stable-diffusion-3.5-large/api/schema
    # "price": "$0.065", "title": "per output image" (the model page's price).
    pricing: { base_cost_usd: 0.065 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true }
    params:
      # "aspect_ratio … ignored if you are using an input image" (default 1:1).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "1:1", "21:9", "2:3", "3:2", "4:5", "5:4", "9:16", "9:21"]
        default: "1:1"
      # "output_format" webp | jpg | png (default webp); litegen's jpeg goes as jpg.
      output_format: { kind: string, enum_values: [webp, jpeg, png], default: webp }
      negative_prompt: { kind: string }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # "cfg … The guidance scale" (1-10, default 5).
      guidance_scale: { kind: float, min: 1.0, max: 10.0, default: 5.0 }
      # "prompt_strength … when using image to image. 1.0 corresponds to full
      # destruction of information in image" (0-1, default 0.85).
      strength: { kind: float, min: 0.0, max: 1.0, default: 0.85 }
    # "image … Input image for image to image mode" (a URL or a data URI).
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

