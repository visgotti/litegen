models:
  # PixVerse (app-api.pixverse.ai). Async; API-KEY header + per-request Ai-trace-id.
  # Refs are pre-uploaded (multipart) to /image/upload -> img_id, then referenced.
  - id: pixverse/v4.5
    provider: pixverse
    media_type: video
    display_name: PixVerse v4.5
    description: PixVerse v4.5 text/image-to-video + first/last-frame transition.
    pricing: { base_cost_usd: 0.45 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      seed: { kind: seed, min: 0, max: 2147483647 }
      duration_seconds: { kind: float, min: 5.0, max: 8.0, default: 5.0 }
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","4:3","1:1","3:4","9:16"]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
          last_frame: image
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [motion_mode, style, template_id, negative_prompt]
    tags: [text-to-video, image-to-video]

  - id: pixverse/v5
    provider: pixverse
    media_type: video
    display_name: PixVerse v5
    description: PixVerse v5 text/image-to-video.
    pricing: { base_cost_usd: 0.45 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      seed: { kind: seed, min: 0, max: 2147483647 }
      duration_seconds: { kind: float, min: 5.0, max: 8.0, default: 5.0 }
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","4:3","1:1","3:4","9:16"]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
          last_frame: image
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    # No generate_audio_switch: "Supported in v5.5/v5.6/v6/c1 models".
    # https://docs.platform.pixverse.ai/text-to-video-generation-13016634e0.md
    extra_allowlist: [motion_mode, negative_prompt]
    tags: [text-to-video, image-to-video]

  # Timed keyframes (PixelGenie 3D doc §5) on PixVerse's Multi-Transition.
  # @see https://docs.platform.pixverse.ai/multi-transition-video-43051215e0.md (2026-10-30)
  #   POST /openapi/v2/video/multi_transition/generate: model (v3.5 | v4 |
  #   v4.5 | v5), quality (360p | 540p | 720p | 1080p), multi_transition
  #   (minItems 2) of { img_id, duration (integer ≥ 0), prompt (≤ 2048) },
  #   motion_mode (normal | fast). "Supply frames in order; each duration
  #   describes the segment leading to the next frame. For the final item,
  #   omit duration or set it to 0." No maxItems is given; 16 keyframes span
  #   the longest priced clip (15 s) at whole seconds.
  # @see https://docs.platform.pixverse.ai/model-capability-map-2394982m0.md (2026-10-30)
  #   Multi-Transition Video: V5 "Supported"; V6 Max, C1, V6 and V5.6 not.
  - id: pixverse/v5-multi-transition
    provider: pixverse
    media_type: video
    display_name: PixVerse v5 Multi-Transition
    description: >-
      Keyframe-to-video on PixVerse v5. Two to sixteen `keyframe` images, the
      first at 0 s and each at a whole second, become one clip that passes
      through each in turn and ends on the last; the prompt describes every
      segment.
    docs_url: https://docs.platform.pixverse.ai/multi-transition-video-43051215e0.md
    # @see https://docs.platform.pixverse.ai/pixverse-api-pricing-2394995m0.md (2026-10-30)
    #   "Multi-Transition — Fixed duration tiers for motion_mode=normal"; "USD
    #   amounts use total Credits ÷ 225". 5 seconds at 360p / 540p: "45
    #   Credits", US$0.200. The clip's length is the caller's, so the tiers
    #   (540p credits: 1 s 23, 2 s 27, 3 s 32, 4 s 36, 5 s 45, 6 s 59, 7 s
    #   72, 8 s 90, 9 s 95, 10 s 99, 15 s 135; 720p ×4/3; 1080p ×8/3) are
    #   recorded for variable pricing.
    pricing:
      base_cost_usd: 0.20
      variable_pricing:
        credit_usd: 0.0044444
        credits_by_seconds_540p: { "1": 23, "2": 27, "3": 32, "4": 36, "5": 45, "6": 59, "7": 72, "8": 90, "9": 95, "10": 99, "15": 135 }
    capabilities: { image_to_video: true }
    prompt: { required: true, max_length: 2048 }
    params:
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
    ref_inputs:
      max_total: 16
      default_role: keyframe
      provider_format:
        form: multipart
        field_map:
          keyframe: image
      roles:
        keyframe: { required: true, min_count: 2, max_count: 16, timing: any, time_step_s: 1.0 }
    # motion_mode fast doubles the price: it waits for variable pricing.
    extra_allowlist: []
    tags: [image-to-video, keyframes]

  - id: pixverse/v3.5
    provider: pixverse
    media_type: video
    display_name: PixVerse v3.5
    description: PixVerse v3.5 text/image-to-video + transition.
    # 540p (the adapter's default quality), normal motion, 5s: 45 credits at
    # $0.01 ($10 = 1,000 credits): https://docs.platform.pixverse.ai/pricing-796039m0.md (2026-09-11)
    pricing: { base_cost_usd: 0.45 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      seed: { kind: seed, min: 0, max: 2147483647 }
      duration_seconds: { kind: float, min: 5.0, max: 8.0, default: 5.0 }
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","4:3","1:1","3:4","9:16"]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
          last_frame: image
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [motion_mode, style, template_id, negative_prompt]
    tags: [text-to-video, image-to-video]

  # ─── V6 / C1 (added 2026-09-11, model-drift) ───────────────────────────────
  # PixVerse's two recommended models; the capability matrix files every other
  # model under "Legacy models". Both serve text/, img/ and transition/generate
  # (the three endpoints the adapter calls); fusion/ and extend/ are not wired.
  # https://docs.platform.pixverse.ai/capability-matrix-2144288m0.md
  - id: pixverse/v6
    provider: pixverse
    media_type: video
    display_name: PixVerse V6
    description: PixVerse V6 text/image-to-video + first/last-frame transition, 1-15s, optional native audio.
    # 540p (the adapter's default quality), 5s, no audio: 7 credits/s x 5 = 35
    # credits at $0.01 ($10 = 1,000 credits):
    # https://docs.platform.pixverse.ai/pricing-796039m0.md (2026-09-11)
    pricing: { base_cost_usd: 0.35 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      seed: { kind: seed, min: 0, max: 2147483647 }
      # "v6/c1 : 1~15" on text/, img/ and transition/generate ("1080p supports up to 15s").
      # https://docs.platform.pixverse.ai/text-to-video-generation-13016634e0.md
      duration_seconds: { kind: float, min: 1.0, max: 15.0, default: 5.0 }
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
        default: 540p
      aspect_ratio:
        kind: aspect_ratio
        # "v6/c1 models : 16:9, 4:3, 1:1, 3:4, 9:16, 2:3, 3:2, 21:9" (text/generate;
        # img/ and transition/ take the shape of the image).
        allowed: ["16:9","4:3","1:1","3:4","9:16","2:3","3:2","21:9"]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
          last_frame: image
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    # generate_audio_switch (default false; "Supported in v5.5/v5.6/v6/c1") and
    # generate_multi_clip_switch ("Supported in v5.5/v6"; text/ and img/ only).
    # The price above is the no-audio rate (audio: 9 credits/s at 540p). No
    # negative_prompt, motion_mode or sound_effect_* / lip_sync_* (v5 and below).
    # https://docs.platform.pixverse.ai/v6-2056814m0.md
    extra_allowlist: [generate_audio_switch, generate_multi_clip_switch]
    tags: [text-to-video, image-to-video]

  - id: pixverse/c1
    provider: pixverse
    media_type: video
    display_name: PixVerse C1
    description: PixVerse C1 cinematic text/image-to-video + first/last-frame transition, 1-15s, optional native audio.
    # 540p (the adapter's default quality), 5s, no audio: 8 credits/s x 5 = 40
    # credits at $0.01 ($10 = 1,000 credits):
    # https://docs.platform.pixverse.ai/pricing-796039m0.md (2026-09-11)
    pricing: { base_cost_usd: 0.40 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      seed: { kind: seed, min: 0, max: 2147483647 }
      # "Any integer from 1–15s (1080p supports up to 15s)" on every C1 endpoint.
      # https://docs.platform.pixverse.ai/c1-2067883m0.md
      duration_seconds: { kind: float, min: 1.0, max: 15.0, default: 5.0 }
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
        default: 540p
      aspect_ratio:
        kind: aspect_ratio
        # "v6/c1 models : 16:9, 4:3, 1:1, 3:4, 9:16, 2:3, 3:2, 21:9" (text/generate).
        # https://docs.platform.pixverse.ai/text-to-video-generation-13016634e0.md
        allowed: ["16:9","4:3","1:1","3:4","9:16","2:3","3:2","21:9"]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
          last_frame: image
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    # generate_audio_switch only: C1 does multi-clip "with prompt", and
    # generate_multi_clip_switch is "Supported in v5.5/v6". The price above is
    # the no-audio rate (audio: 10 credits/s at 540p).
    # https://docs.platform.pixverse.ai/c1-2067883m0.md
    extra_allowlist: [generate_audio_switch]
    tags: [text-to-video, image-to-video, premium]
