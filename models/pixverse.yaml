        - { when: { duration_seconds: 29, resolution: 720p }, usd: 1.6 }
        - { when: { duration_seconds: 11, resolution: 1080p }, usd: 1.6 }
        - { when: { duration_seconds: 12, resolution: 1080p }, usd: 1.6 }
        - { when: { duration_seconds: 13, resolution: 1080p }, usd: 1.6 }
        - { when: { duration_seconds: 14, resolution: 1080p }, usd: 1.6 }
