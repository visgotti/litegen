        - { when: { duration_seconds: 21 }, usd: 1.0 }
        - { when: { duration_seconds: 22 }, usd: 1.0 }
        - { when: { duration_seconds: 23 }, usd: 1.0 }
        - { when: { duration_seconds: 24 }, usd: 1.0 }
        - { when: { duration_seconds: 26 }, usd: 1.2 }
        - { when: { duration_seconds: 27 }, usd: 1.2 }
        - { when: { duration_seconds: 28 }, usd: 1.2 }
        - { when: { duration_seconds: 29 }, usd: 1.2 }
        - { when: { duration_seconds: 11, resolution: 720p }, usd: 0.8 }
        - { when: { duration_seconds: 12, resolution: 720p }, usd: 0.8 }
