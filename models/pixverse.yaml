        - { when: { duration_seconds: 7 }, usd: 0.32 }
        - { when: { duration_seconds: 8 }, usd: 0.4 }
        - { when: { duration_seconds: 9 }, usd: 0.42222 }
        - { when: { duration_seconds: 10 }, usd: 0.44 }
        - { when: { duration_seconds: 15 }, usd: 0.6 }
        - { when: { duration_seconds: 20 }, usd: 0.8 }
        - { when: { duration_seconds: 25 }, usd: 1.0 }
        - { when: { duration_seconds: 30 }, usd: 1.2 }
        - { when: { duration_seconds: 1, resolution: 720p }, usd: 0.13333 }
        - { when: { duration_seconds: 2, resolution: 720p }, usd: 0.16 }
        - { when: { duration_seconds: 3, resolution: 720p }, usd: 0.18667 }
        - { when: { duration_seconds: 4, resolution: 720p }, usd: 0.21333 }
        - { when: { duration_seconds: 5, resolution: 720p }, usd: 0.26667 }
        - { when: { duration_seconds: 6, resolution: 720p }, usd: 0.34667 }
        - { when: { duration_seconds: 7, resolution: 720p }, usd: 0.42667 }
        - { when: { duration_seconds: 8, resolution: 720p }, usd: 0.53333 }
        - { when: { duration_seconds: 9, resolution: 720p }, usd: 0.56 }
        - { when: { duration_seconds: 10, resolution: 720p }, usd: 0.58667 }
        - { when: { duration_seconds: 15, resolution: 720p }, usd: 0.8 }
        - { when: { duration_seconds: 20, resolution: 720p }, usd: 1.06667 }
        - { when: { duration_seconds: 25, resolution: 720p }, usd: 1.33333 }
        - { when: { duration_seconds: 30, resolution: 720p }, usd: 1.6 }
        - { when: { duration_seconds: 1, resolution: 1080p }, usd: 0.26667 }
        - { when: { duration_seconds: 2, resolution: 1080p }, usd: 0.32 }
        - { when: { duration_seconds: 3, resolution: 1080p }, usd: 0.37333 }
        - { when: { duration_seconds: 4, resolution: 1080p }, usd: 0.42667 }
        - { when: { duration_seconds: 5, resolution: 1080p }, usd: 0.53333 }
        - { when: { duration_seconds: 6, resolution: 1080p }, usd: 0.69333 }
        - { when: { duration_seconds: 7, resolution: 1080p }, usd: 0.85333 }
        - { when: { duration_seconds: 8, resolution: 1080p }, usd: 1.06667 }
