        kind: aspect_ratio
        # "v6/c1 models : 16:9, 4:3, 1:1, 3:4, 9:16, 2:3, 3:2, 21:9" (text/generate).
        # https://docs.platform.pixverse.ai/text-to-video-13016634e0.md (2026-10-30)
        allowed: ["16:9","4:3","1:1","3:4","9:16","2:3","3:2","21:9"]
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
          last_frame: image
      roles:
