models:
  # PixVerse (app-api.pixverse.ai). Async; API-KEY header + per-request Ai-trace-id.
  # Refs are pre-uploaded (multipart) to /image/upload -> img_id, then referenced.
  - id: pixverse/v4.5
    provider: pixverse
    media_type: video
    display_name: PixVerse v4.5
    description: PixVerse v4.5 text/image-to-video.
    docs_url: https://docs.platform.pixverse.ai/text-to-video-13016634e0
    # @see https://docs.platform.pixverse.ai/pixverse-api-pricing-2394995m0.md (2026-10-30)
    # "225 Credits = USD 1; 1 Credit ≈ USD 0.004444" (the earlier page, $10 per
    # 1,000 credits, is gone).
    # Not listed there any more ("no public rate is provided"); the 45 credits
    # the 540p 5 s clip cost before are priced at that rate.
    pricing:
      base_cost_usd: 0.2
    capabilities: { text_to_video: true, image_to_video: true }
    # img/generate: "prompt: type: string … maxLength: 2048" (text/ and
    # transition/ take 5000), and one limit serves every mode.
    # @see https://docs.platform.pixverse.ai/image-to-video-and-video-templates-13016633e0.md (2026-10-30)
    prompt: { required: true, max_length: 2048 }
    params:
      seed: { kind: seed, min: 0, max: 2147483647 }
      # "Duration in seconds. C1/V6: 1-15; V5.5/V5.6: 5, 8, or 10; older
      # models: 5 or 8." (img/generate)
      duration_seconds: { kind: float, min: 5.0, max: 8.0, default: 5.0, values: [5.0, 8.0] }
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
      # text/generate only: img/ and transition/ take the shape of the image.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","4:3","1:1","3:4","9:16"]
        # img/generate's properties (model, prompt, duration, quality, seed,
        # img_id, ...) and transition/generate's (prompt, model, duration,
        # quality, seed, first_frame_img, last_frame_img, ...) hold no
        # aspect_ratio, so a frame sets the shape (E5).
        # @see https://docs.platform.pixverse.ai/image-to-video-and-video-templates-13016633e0.md (2026-11-11)
        # @see https://docs.platform.pixverse.ai/first-and-last-frame-video-43051213e0.md (2026-11-11)
        frames_set_shape: without_references
    # No last frame: transition/generate's model enum is "c1 - v6 - v5.6 - v5".
    # @see https://docs.platform.pixverse.ai/first-and-last-frame-video-43051213e0.md (2026-10-30)
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
    # text/ and img/ define no negative_prompt, motion_mode or style, and
    # template_id bills per template ("Use the selected template's
    # `credit_consume` value"), which a flat price cannot.
    extra_allowlist: []
    tags: [text-to-video, image-to-video]

  - id: pixverse/v5
    provider: pixverse
    media_type: video
    display_name: PixVerse v5
    description: PixVerse v5 text/image-to-video.
    docs_url: https://docs.platform.pixverse.ai/text-to-video-13016634e0
    # @see https://docs.platform.pixverse.ai/pixverse-api-pricing-2394995m0.md (2026-10-30)
    # "225 Credits = USD 1; 1 Credit ≈ USD 0.004444" (the earlier page, $10 per
    # 1,000 credits, is gone).
    # V5: "Fixed Credits per request for the selected duration" — 5 s at
    # 360p/540p 45 credits, 720p 60, 1080p 120; 8 s 90, 90, 120, 240.
    pricing:
      base_cost_usd: 0.2
      variable_pricing:
        - { when: { duration_seconds: 8 }, usd: 0.4 }
        - { when: { resolution: 720p }, usd: 0.2666667 }
        - { when: { resolution: 720p, duration_seconds: 8 }, usd: 0.5333333 }
        - { when: { resolution: 1080p }, usd: 0.5333333 }
        - { when: { resolution: 1080p, duration_seconds: 8 }, usd: 1.0666667 }
    capabilities: { text_to_video: true, image_to_video: true }
    # img/generate: "prompt: type: string … maxLength: 2048" (text/ and
    # transition/ take 5000), and one limit serves every mode.
    # @see https://docs.platform.pixverse.ai/image-to-video-and-video-templates-13016633e0.md (2026-10-30)
    prompt: { required: true, max_length: 2048 }
    params:
      seed: { kind: seed, min: 0, max: 2147483647 }
      # "Duration in seconds. C1/V6: 1-15; V5.5/V5.6: 5, 8, or 10; older
      # models: 5 or 8." (img/generate)
      duration_seconds: { kind: float, min: 5.0, max: 8.0, default: 5.0, values: [5.0, 8.0] }
      resolution:
        kind: string
        enum_values: [360p, 540p, 720p, 1080p]
      # text/generate only: img/ and transition/ take the shape of the image.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","4:3","1:1","3:4","9:16"]
        # img/generate's properties (model, prompt, duration, quality, seed,
        # img_id, ...) and transition/generate's (prompt, model, duration,
        # quality, seed, first_frame_img, last_frame_img, ...) hold no
        # aspect_ratio, so a frame sets the shape (E5).
        # @see https://docs.platform.pixverse.ai/image-to-video-and-video-templates-13016633e0.md (2026-11-11)
        # @see https://docs.platform.pixverse.ai/first-and-last-frame-video-43051213e0.md (2026-11-11)
        frames_set_shape: without_references
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format:
        form: multipart
        field_map:
          first_frame: image
          last_frame: image
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
    # No generate_audio_switch: img/ "Generate native audio with V5.5, V5.6, V6,
    # or C1." (text/ and transition/ now give it no per-model note). No
    # negative_prompt or motion_mode: text/, img/ and transition/ define neither.
    # https://docs.platform.pixverse.ai/image-to-video-and-video-templates-13016633e0.md (2026-11-09)
    extra_allowlist: []
    tags: [text-to-video, image-to-video]

  # Timed keyframes (PixelGenie 3D doc §5) on PixVerse's Multi-Transition.
  # @see https://docs.platform.pixverse.ai/multi-transition-video-43051215e0.md (2026-10-30)
  #   POST /openapi/v2/video/multi_transition/generate: model (v3.5 | v4 |
  #   v4.5 | v5), quality (360p | 540p | 720p | 1080p), multi_transition
  #   (minItems 2) of { img_id, duration (integer ≥ 0), prompt (≤ 2048) },
  #   motion_mode (normal | fast). "Supply frames in order; each duration
  #   describes the segment leading to the next frame. For the final item,
  #   omit duration or set it to 0." No maxItems is given; 31 keyframes span
  #   the longest priced clip (30 s) at whole seconds.
  # @see https://docs.platform.pixverse.ai/model-capability-map-2394982m0.md (2026-10-30)
  #   Multi-Transition Video: V5 "Supported"; V6 Max, C1, V6 and V5.6 not.
  - id: pixverse/v5-multi-transition
    provider: pixverse
    media_type: video
    display_name: PixVerse v5 Multi-Transition
    description: >-
      Keyframe-to-video on PixVerse v5. Two to 31 `keyframe` images, the
      first at 0 s and each at a whole second, become one clip that passes
      through each in turn and ends on the last; the prompt describes every
      segment.
    docs_url: https://docs.platform.pixverse.ai/multi-transition-video-43051215e0.md
    # @see https://docs.platform.pixverse.ai/pixverse-api-pricing-2394995m0.md (2026-10-30)
    #   "Multi-Transition — Fixed duration tiers for motion_mode=normal"; "USD
    #   amounts use total Credits ÷ 225". 5 seconds at 360p / 540p: "45
    #   Credits", US$0.200. One tier per listed length (1–10, 15, 20, 25 and
    #   30 s) and resolution (360p and 540p share theirs; litegen sends 540p
    #   when none is asked for); "For durations not listed, refer to the
    #   current production pricing table" — those bill the next listed tier
    #   up (11–14 s the 15 s price, and so on), never less than a shorter
    #   listed clip. A keyframe past 30 s is refused (`max_time_s`).
