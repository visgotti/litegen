    docs_url: https://platform.vidu.com/docs/api-reference/video-models/vidu-q3/reference-to-video
    description: Vidu Q3 Mix reference-to-video (1-7 subject images), 3-15 s, 720p or 1080p.
    # "Reference-to-video | viduq3-mix | 3-16 | 720p 24, 1080p 29
    # credits/second": the default (720p, 5 s) is 120 credits, $0.60.
    pricing:
      base_cost_usd: 0.60
      variable_pricing:
        - { per_second_usd: 0.12 }
        - { when: { resolution: 1080p }, per_second_usd: 0.145 }
    capabilities: { image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      seed: { kind: seed, min: 1, max: 2147483647 }
      duration_seconds: { kind: int, min: 3, max: 15, default: 5 }
      resolution: { kind: string, enum_values: [720p, 1080p], default: 720p }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","9:16","1:1","3:4","4:3"]
    ref_inputs:
      max_total: 7
      default_role: reference
      provider_format: { form: url }
      roles:
        reference: { required: true, min_count: 1, max_count: 7 }
    tags: [reference-to-video]

  # viduq3-pro-fast: img2video ("Only 1 image is accepted"; prompt up to 20000
