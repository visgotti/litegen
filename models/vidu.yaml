    display_name: Vidu Q3 Pro Fast
    docs_url: https://platform.vidu.com/docs/api-reference/video-models/vidu-q3/image-to-video
    description: Vidu Q3 Pro Fast image-to-video with native audio, 1-16 s, 720p or 1080p.
    # The default (720p, 5 s) is 60 credits, $0.30.
    pricing:
      base_cost_usd: 0.30
      variable_pricing:
        - { per_second_usd: 0.06 }
        - { when: { resolution: 1080p }, per_second_usd: 0.075 }
    capabilities: { image_to_video: true }
    prompt: { required: true, max_length: 20000 }
    params:
      audio: { kind: bool, default: true }
      seed: { kind: seed, min: 1, max: 2147483647 }
      duration_seconds: { kind: int, min: 1, max: 16, default: 5 }
      resolution: { kind: string, enum_values: [720p, 1080p], default: 720p }
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: true, min_count: 1, max_count: 1 }
    tags: [image-to-video, audio, fast]

  # viduq2: text2video only — its reference2video operation takes `subjects`
  # (named subject groups), not the `images` list the adapter sends. Prompt
  # "Maximum length is 5000 characters"; duration 1-10; resolution 540p /
  # 720p / 1080p; aspect ratio 16:9 / 9:16 / 3:4 / 4:3 / 1:1; audio
  # "Default: true".
  # @see https://platform.vidu.com/docs/api-reference/video-models/vidu-q2/text-to-video.md (2026-11-03)
  - id: vidu/viduq2
    provider: vidu
    media_type: video
    display_name: Vidu Q2
    docs_url: https://platform.vidu.com/docs/api-reference/video-models/vidu-q2/text-to-video
    description: Vidu Q2 text-to-video with native audio, 1-10 s.
    # "Text-to-video | Q2 | 540P 10 credits for the 1st second, +2 credits/
    # second thereafter | 720P 15 … +5 | 1080P 20 … +10": a rate a second plus
    # a fixed part (720p 5s + 10; 540p 2s + 8; 1080p 10s + 10). The default
    # (720p, 5 s) is 35 credits, $0.175.
    pricing:
      base_cost_usd: 0.175
      variable_pricing:
        - { per_second_usd: 0.025 }
        - { add_usd: 0.05 }
        - { when: { resolution: 540p }, per_second_usd: 0.01 }
        - { when: { resolution: 540p }, add_usd: 0.04 }
        - { when: { resolution: 1080p }, per_second_usd: 0.05 }
        - { when: { resolution: 1080p }, add_usd: 0.05 }
    capabilities: { text_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      audio: { kind: bool, default: true }
      seed: { kind: seed, min: 1, max: 2147483647 }
      duration_seconds: { kind: int, min: 1, max: 10, default: 5 }
      resolution: { kind: string, enum_values: [540p, 720p, 1080p], default: 720p }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","9:16","3:4","4:3","1:1"]
    tags: [text-to-video, audio]

  # viduq2-turbo: img2video (1 image; prompt "maximum length is 2000
  # characters"; audio "Default: false") and start-end2video (2 images; no
  # audio field). Duration: img2video takes 1-10 but gives its resolutions as
  # "viduq2-turbo (2-8s): default 720p, options: 540p, 720p, 1080p", and one
  # range serves both endpoints, so 2-8 s; start-end2video's 360p is unpriced.
  # @see https://platform.vidu.com/docs/api-reference/video-models/vidu-q2/image-to-video.md (2026-11-03)
  # @see https://platform.vidu.com/docs/api-reference/video-models/vidu-q2/start-end-to-video.md (2026-11-03)
  - id: vidu/viduq2-turbo
    provider: vidu
    media_type: video
    display_name: Vidu Q2 Turbo
    docs_url: https://platform.vidu.com/docs/api-reference/video-models/vidu-q2/image-to-video
    description: Vidu Q2 Turbo image-to-video and first-last frame, 2-8 s.
    # "Image-to-video & First-last frame | Q2-turbo | 540P 6 credits for the
    # 1st second, +2 credits/second thereafter | 720P 8 credits for the 1st
    # second, 10 credits for the 2nd second, +10 credits/second starting from
    # the 3rd second | 1080P 35 … +10": 540p 2s + 4, 720p 10s - 2, 1080p
    # 10s + 25. The default (720p, 5 s) is 48 credits, $0.24. "The direct
    # audio/video output feature for image-to-video … consumes an additional
    # 15 credits" ($0.075).
    pricing:
      base_cost_usd: 0.24
      variable_pricing:
        - { per_second_usd: 0.05 }
        - { add_usd: -0.01 }
        - { when: { resolution: 540p }, per_second_usd: 0.01 }
        - { when: { resolution: 540p }, add_usd: 0.02 }
        - { when: { resolution: 1080p }, per_second_usd: 0.05 }
        - { when: { resolution: 1080p }, add_usd: 0.125 }
        - { when: { audio: true }, add_usd: 0.075 }
    capabilities: { image_to_video: true }
    prompt: { required: true, max_length: 2000 }
    params:
      audio: { kind: bool, default: false }
      seed: { kind: seed, min: 1, max: 2147483647 }
      duration_seconds: { kind: int, min: 2, max: 8, default: 5 }
      resolution: { kind: string, enum_values: [540p, 720p, 1080p], default: 720p }
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: true, min_count: 1, max_count: 1 }
        # A last frame needs a first: img2video takes its one image as the first frame (vidu.rs refuses a last frame alone).
        last_frame:  { required: false, min_count: 0, max_count: 1, needs_first_frame: true }
    tags: [image-to-video, fast]

  # viduq1-classic: img2video (1 image; prompt "maximum length is 2000
