  # "Image-to-video | viduq3-pro-fast | 1080p 15, 720p 12 credits/second", so
  # the row offers those two resolutions and no last frame (its start-end2video
  # operation has no price).
  # @see https://platform.vidu.com/docs/api-reference/video-models/vidu-q3/image-to-video.md (2026-11-03)
  - id: vidu/viduq3-pro-fast
