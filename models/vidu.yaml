models:
  # Vidu (api.vidu.com). Async: POST /ent/v2/{text2video,img2video,reference2video,
  # start-end2video} -> poll GET /ent/v2/tasks/{id}/creations. Auth: Authorization: Token.
  - id: vidu/viduq1
    provider: vidu
    media_type: video
    display_name: Vidu Q1
    description: Vidu Q1 text/image/reference/start-end to video.
    pricing: { base_cost_usd: 0.30 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # Model Map: viduq1 is 5s only, 1080p only.
      duration_seconds: { kind: float, min: 5.0, max: 5.0, default: 5.0 }
      resolution:
        kind: string
        enum_values: [1080p]
      aspect_ratio:
        kind: aspect_ratio
        # "3:4 & 4:3 only support q2 & q3 model": https://platform.vidu.com/docs/text-to-video.md
        allowed: ["16:9","9:16","1:1"]
    ref_inputs:
      max_total: 7
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
        reference:   { required: false, min_count: 0, max_count: 7 }
    extra_allowlist: [movement_amplitude, style, bgm, off_peak, callback_url]
    tags: [text-to-video, image-to-video, reference-to-video]

  - id: vidu/vidu2.0
    provider: vidu
    media_type: video
    display_name: Vidu 2.0
    description: Vidu 2.0 image/reference to video (no text-to-video).
    pricing: { base_cost_usd: 0.20 }
    # Model Map marks Text-to-Video as unsupported for vidu2.0.
    capabilities: { image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      duration_seconds: { kind: float, min: 4.0, max: 8.0, default: 4.0 }
      resolution:
        kind: string
        enum_values: [360p, 720p, 1080p]
      aspect_ratio:
        kind: aspect_ratio
        # Only reference2video takes aspect_ratio for vidu2.0; "3:4&4:3 only support q2 model":
        # https://platform.vidu.com/docs/reference-to-video.md
        allowed: ["16:9","9:16","1:1"]
    ref_inputs:
      max_total: 7
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
        reference:   { required: false, min_count: 0, max_count: 7 }
    # No `style`: it is a text2video-only field and vidu2.0 has no text2video.
    # https://platform.vidu.com/docs/text-to-video.md
    extra_allowlist: [movement_amplitude, bgm, off_peak, callback_url]
    tags: [image-to-video, reference-to-video]

  - id: vidu/viduq2-pro
    provider: vidu
    media_type: video
    display_name: Vidu Q2 Pro
    description: Vidu Q2 Pro high-quality image/reference to video (no text-to-video).
    pricing: { base_cost_usd: 0.40 }
    # Model Map marks Text-to-Video as unsupported for viduq2-pro.
    capabilities: { image_to_video: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # 1s floor and 540p hold on img2video, start-end2video and reference2video; the
      # 8s ceiling is start-end2video's (img2video/reference2video go to 10):
      # https://platform.vidu.com/docs/start-end-to-video.md
      duration_seconds: { kind: float, min: 1.0, max: 8.0, default: 5.0 }
      resolution:
        kind: string
        enum_values: [540p, 720p, 1080p]
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9","9:16","1:1","3:4","4:3"]
    ref_inputs:
      max_total: 7
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame:  { required: false, min_count: 0, max_count: 1 }
        reference:   { required: false, min_count: 0, max_count: 7 }
    extra_allowlist: [movement_amplitude, bgm, off_peak, callback_url]
    tags: [image-to-video, reference-to-video, premium]
