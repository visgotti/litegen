models:
  - id: mock/image-gen
    provider: mock
    media_type: image
    display_name: Mock Image
    description: Mock image provider for tests.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 1000 }
    params:
      seed: { kind: seed, min: 0, max: 4294967294 }
      size:
        kind: size
        mode: enum
        values: [[512,512],[1024,1024]]
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [test_flag]
    tags: [mock, test]

  - id: mock/visual-image-gen
    provider: mock
    media_type: image
    display_name: Mock Visual Image
    description: Renders a deterministic colored PNG with circle accents derived from the prompt hash. Use to verify the provider flow end-to-end with visible output.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 4000 }
    params:
      size:
        kind: size
        mode: enum
        values: [[512, 512], [1024, 1024]]
    extra_allowlist: []
    tags: [mock, test, visual]

  - id: mock/visual-video-gen
    provider: mock
    media_type: video
    display_name: Mock Visual Video
    description: Animated GIF with a colored square on a random path. Use to verify the provider flow end-to-end with visible output.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_video: true }
    prompt: { required: true, max_length: 4000 }
    params:
      duration_seconds: { kind: float, min: 1.0, max: 5.0 }
    extra_allowlist: []
    tags: [mock, test, visual]

  - id: mock/video-gen
    provider: mock
    media_type: video
    display_name: Mock Video
    description: Mock video provider for tests.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 1000 }
    params:
      duration_seconds: { kind: float, min: 1.0, max: 10.0 }
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: url }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [mock, test]

  # ─── Extended image mock models ──────────────────────────────────────────────

  - id: mock/all-params-image
    provider: mock
    media_type: image
    display_name: Mock All-Params Image
    description: Every image param kind exposed — size enum, aspect_ratio, seed, guidance_scale, steps, negative_prompt, quality, style. Use to test the full validation surface.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 4000 }
    params:
      size:
        kind: size
        mode: enum
        values: [[512,512],[1024,1024],[1024,1792],[1792,1024]]
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","4:3","3:4"]
        default: "1:1"
      seed: { kind: seed, min: 0, max: 4294967294 }
      guidance_scale: { kind: float, min: 0.0, max: 20.0, default: 7.5 }
      steps: { kind: int, min: 1, max: 100, default: 30 }
      negative_prompt: { kind: string, max_length: 1000 }
      quality: { kind: string, enum_values: [standard, hd, ultra], default: standard }
      style: { kind: string, enum_values: [vivid, natural, anime, photographic], default: natural }
    extra_allowlist: []
    tags: [mock, test, all-params]

  - id: mock/freeform-size-image
    provider: mock
    media_type: image
    display_name: Mock Freeform-Size Image
    description: Freeform size validation — any width/height within [256,2048] that is a multiple of 8. Use to test the freeform size path.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 4000 }
    params:
      size:
        kind: size
        mode: freeform
        min_width: 256
        max_width: 2048
        min_height: 256
        max_height: 2048
        multiple_of: 8
    tags: [mock, test, freeform-size]

  - id: mock/url-refs-image
    provider: mock
    media_type: image
    display_name: Mock URL-Refs Image
    description: Image-to-image with URL-form ref inputs. Use to test the URL ref materialization path.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 4000 }
    params:
      strength: { kind: float, min: 0.0, max: 1.0, default: 0.8 }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    tags: [mock, test, refs-url]

  - id: mock/url-only-image
    provider: mock
    media_type: image
    display_name: Mock URL-Only Image
    description: >-
      Takes references only as fetchable URLs, refusing data URIs the way Luma
      does. litegen publishes an uploaded reference at an unguessable URL of
      its own for an hour; the mock records the URL it was handed.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 4000 }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      data_uri: false
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [mock, test, refs-url]

  - id: mock/base64-refs-image
    provider: mock
    media_type: image
    display_name: Mock Base64-Refs Image
    description: Image-to-image with base64-form ref inputs. Use to test the base64 ref materialization path.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 4000 }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    tags: [mock, test, refs-base64]

  - id: mock/multipart-refs-image
    provider: mock
    media_type: image
    display_name: Mock Multipart-Refs Image
    description: Image-to-image with multipart-form ref inputs. Use to test the multipart ref materialization path.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 4000 }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: image } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    tags: [mock, test, refs-multipart]

  - id: mock/inpainting-image
    provider: mock
    media_type: image
    display_name: Mock Inpainting Image
    description: >-
      Inpainting with init + mask roles via multipart form, white-edits like
      Stability. Fills exactly the edit area — the mask, the region drawn as
      a mask, or where both overlap, grown by `mask_grow_px` — with #ffcd75
      and leaves every other pixel identical. Without a mask or region it
      renders a fresh image.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true, image_to_image: true, inpainting: true }
    prompt: { required: true, max_length: 4000 }
    preserves_unmasked: exact
    params:
      region:
        kind: region
        input: mask
        label: Region
        description: The rectangle to edit, sent to this model drawn as its mask.
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: multipart, field_map: { init: image, mask: mask } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1, convention: white_edits }
    tags: [mock, test, inpainting]

  - id: mock/passthrough-image
    provider: mock
    media_type: image
    display_name: Mock Passthrough Image
    description: Heavy extra_allowlist — safety_tolerance, output_format, output_quality, person_generation, style_preset, watermark, response_format are passed through verbatim. Use to test passthrough config.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 4000 }
    extra_allowlist:
      - safety_tolerance
      - output_format
      - output_quality
      - person_generation
      - style_preset
      - watermark
      - response_format
    tags: [mock, test, passthrough]

  - id: mock/expensive-image
    provider: mock
    media_type: image
    display_name: Mock Expensive Image
    description: Non-zero pricing ($5.00/request) and a very short prompt cap (100 chars). Use to test quota enforcement and prompt-length validation.
    pricing: { base_cost_usd: 5.00 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 100 }
    tags: [mock, test, expensive, quota-demo]

  # ─── Extended video mock models ──────────────────────────────────────────────

  - id: mock/slow-image
    provider: mock
    media_type: image
    display_name: Mock Slow Image
    description: >-
      Answers after 30 seconds, longer than any vendor timeout a test sets
      (server.vendor_timeout_secs), so the first attempt always times out. A
      timed-out vendor call is never sent again: the request is answered 504
      vendor_timeout and the mock counts exactly one call. Use with an
      Idempotency-Key to see the 504 replayed.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 1000 }
    tags: [mock, test, idempotency]

  - id: mock/keyframe-video
    provider: mock
    media_type: video
    display_name: Mock Keyframe Video
    description: Dual-keyframe image-to-video (Luma-style). Pass `first_frame` and `last_frame` reference images and the provider returns an animated GIF that cross-fades between them over 10 frames, proving the keyframe materialization flow end-to-end. With no refs supplied, falls back to a prompt-derived random animation.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 1000 }
    params:
      duration_seconds: { kind: float, min: 3.0, max: 9.0 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","4:3","3:4"]
      fps: { kind: int, min: 1, max: 60 }
      seed: { kind: seed, min: 0, max: 4294967294 }
    extra_allowlist: []
    ref_inputs:
      max_total: 3
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
    tags: [mock, test, keyframes]

  - id: mock/passthrough-video
    provider: mock
    media_type: video
    display_name: Mock Passthrough Video
    description: Heavy extra_allowlist for video — callback_url, loop, watermark, safety_tolerance, output_format. Use to test video passthrough config.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_video: true }
    prompt: { required: true, max_length: 1000 }
    extra_allowlist:
      - callback_url
      - loop
      - watermark
      - safety_tolerance
      - output_format
    tags: [mock, test, passthrough]

  - id: mock/strict-duration-video
    provider: mock
    media_type: video
    display_name: Mock Strict-Duration Video
    description: Exactly 5-second duration (min == max == 5.0). Use to test that any other duration value is rejected with 400.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_video: true }
    prompt: { required: true, max_length: 1000 }
    params:
      duration_seconds: { kind: float, min: 5.0, max: 5.0 }
    tags: [mock, test, strict-bounds]

  - id: mock/expensive-video
    provider: mock
    media_type: video
    display_name: Mock Expensive Video
    description: Non-zero pricing ($0.50/request). Use to test video quota enforcement.
    pricing: { base_cost_usd: 0.50 }
    capabilities: { text_to_video: true }
    prompt: { required: true, max_length: 4000 }
    params:
      duration_seconds: { kind: float, min: 1.0, max: 10.0 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1","16:9","9:16","4:3","3:4"]
      fps: { kind: int, min: 1, max: 60 }
      seed: { kind: seed, min: 0, max: 4294967294 }
    tags: [mock, test, expensive, quota-demo]

  # ─── 3D model (mesh) mocks ───────────────────────────────────────────────────

  - id: mock/mesh-3d
    provider: mock
    media_type: model3d
    display_name: Mock Mesh 3D
    description: Real glTF 2.0 binary cube, prompt-tinted. Reports progress across three polls so the async path is genuinely exercised.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_3d: true, image_to_3d: true }
    prompt: { required: true, max_length: 4000 }
    params:
      output_formats:
        kind: string_array
        enum_values: [glb]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Mesh containers. This model only emits glb.
      texture: { kind: bool, default: true, label: Textures }
      target_polycount:
        kind: int
        min: 100
        max: 300000
        label: Target polycount
        description: Approximate triangle budget.
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [mock, test, visual]

  - id: mock/all-params-3d
    provider: mock
    media_type: model3d
    display_name: Mock All-Params 3D
    description: Every 3D param kind exposed — output_format, texture, pbr, rig, symmetry, topology, target_polycount, seed. Use to test the full 3D validation surface.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_3d: true, image_to_3d: true, multiview_to_3d: true }
    prompt: { required: true, max_length: 4000 }
    params:
      # glb, obj and stl are what the mock can genuinely write. fbx and usdz
      # were declared here before and never produced — a model must not
      # advertise a container its provider cannot emit.
      output_formats:
        kind: string_array
        enum_values: [glb, obj, stl]
        max_items: 3
        default: [glb]
        label: Output formats
        description: Mesh containers to produce. Every one asked for is delivered or the generation fails.
      texture: { kind: bool, default: true, label: Textures }
      pbr: { kind: bool, default: false, label: PBR materials }
      rig: { kind: bool, default: false, label: Auto-rig }
      symmetry:
        kind: string
        enum_values: [off, auto, on]
        default: auto
        label: Symmetry
      topology:
        kind: string
        enum_values: [triangle, quad]
        default: triangle
        label: Topology
      target_polycount:
        kind: int
        min: 100
        max: 300000
        label: Target polycount
        description: Approximate triangle budget for the generated mesh.
      seed: { kind: seed, min: 0, max: 2147483647 }
    ref_inputs:
      max_total: 6
      default_role: init
      provider_format: { form: base64 }
      roles:
        init:        { required: false, min_count: 0, max_count: 1 }
        view-front:  { required: false, min_count: 0, max_count: 1 }
        view-back:   { required: false, min_count: 0, max_count: 1 }
        view-left:   { required: false, min_count: 0, max_count: 1 }
        view-right:  { required: false, min_count: 0, max_count: 1 }
        view-top:    { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [mock, test]

  - id: mock/rig-3d
    provider: mock
    media_type: model3d
    task: rig
    native_orientation:
      up: "+y"
      front: "+z"
      evidence: litegen builds this rig itself, standing on +Y and facing +Z (litegen-core/src/providers/model3d/humanoid.rs)
    display_name: Mock Rig 3D
    description: >-
      Rigs any mesh it can read as the same skinned box humanoid: joints hips,
      torso, head, arm_l, arm_r, leg_l and leg_r (VRM 1.0 bone names with
      `joint_naming: vrm`), +Y up, facing +Z, metres, T-pose, `height_m` tall.
      Takes its source by generation id (a mock generation is chained by the
      mock's own task id, as Tripo and Meshy chain theirs), URL or base64, as
      glb only — anything else litegen reads is converted — and refuses a
      source over 20,000 triangles before anything runs. Its free preflight,
      like Tripo's rig-check, refuses a flat source (one whose thinnest side is
      under 1% of its longest) as `not_riggable`, billing nothing.
    pricing: { base_cost_usd: 0.0 }
    capabilities: {}
    prompt: { required: false, max_length: 0 }
    params:
      source_model:
        kind: source_model
        formats: [glb]
        max_bytes: 52428800
        max_faces: 20000
        label: Source mesh
        description: The mesh to rig.
      skeleton:
        kind: string
        enum_values: [humanoid]
        default: humanoid
        label: Skeleton
        description: The skeleton to rig for. The mock rigs humanoids only.
      joint_naming:
        kind: string
        enum_values: [vendor, vrm]
        default: vendor
        label: Joint naming
        description: >-
          `vendor` keeps the mock's own joint names (hips, torso, head, arm_l,
          arm_r, leg_l, leg_r); `vrm` names them as VRM 1.0 humanoid bones.
      height_m:
        kind: float
        min: 0.5
        max: 3.0
        default: 1.75
        label: Height (m)
        description: The rigged character's height in metres; the mock scales its humanoid to it.
      output_formats:
        kind: string_array
        enum_values: [glb]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Mesh containers. The mock emits glb; litegen derives the rest.
    extra_allowlist: []
    tags: [mock, test, rig]

  - id: mock/animate-3d
    provider: mock
    media_type: model3d
    task: animate
    native_orientation:
      up: source
      front: source
      evidence: the mock hands back its source mesh unchanged, plus clips (litegen-core/src/providers/model3d/mock.rs)
    display_name: Mock Animate 3D
    description: >-
      Returns the rigged source plus one LINEAR clip per requested `name`, in
      order — 1 s for a preset, `duration_s` for a prompt. The root travels
      1 m along +Z unless the clip asks `in_place`; like Tripo's single flag,
      the mock keeps clips in place itself only when every clip asks, and
      otherwise litegen removes the travel. Keys at `fps` (30 by default).
      Refuses an unrigged source (`source_not_rigged`) before anything runs.
    pricing: { base_cost_usd: 0.0 }
    capabilities: {}
    prompt: { required: false, max_length: 0 }
    params:
      source_model:
        kind: source_model
        formats: [glb]
        max_bytes: 52428800
        requires_skin: true
        label: Source mesh
        description: The rigged mesh to animate.
      animations:
        kind: animation_list
        max_items: 5
        presets:
          - { id: "mock:idle", canonical: idle, loopable: true }
          - { id: "mock:walk", canonical: walk, loopable: true }
          - { id: "mock:run", canonical: run, loopable: true }
          - { id: "mock:wave" }
        text_to_motion: { min_duration_s: 1, max_duration_s: 10 }
        in_place: native
        label: Animations
        description: Clips to make, in order, each named as given.
      fps:
        kind: int
        min: 1
        max: 60
        default: 30
        label: Frames per second
      output_formats:
        kind: string_array
        enum_values: [glb]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Mesh containers. The mock emits glb; litegen derives the rest.
    extra_allowlist: []
    tags: [mock, test]

  - id: mock/region-image
    provider: mock
    media_type: image
    display_name: Mock Region Edit
    description: >-
      Takes a region as its own box, at least 256 px a side within 1:6–6:1 —
      Ideogram 4.5 Precise Edit's limits — and a black-edits mask beside it.
      litegen enlarges a smaller region's window and sends the exact region
      as the mask; the mock fills the edit area with #ffcd75 and leaves every
      other pixel identical.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_image: false, image_to_image: true, inpainting: true }
    prompt: { required: true, max_length: 1000 }
    preserves_unmasked: exact
    params:
      region:
        kind: region
        input: box
        min_window_px: 256
        max_aspect: 6.0
        label: Region
        description: The rectangle to edit.
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1, convention: black_edits }
    extra_allowlist: []
    tags: [mock, test, inpainting]

  - id: mock/turned-3d
    provider: mock
    media_type: model3d
    native_orientation:
      up: "+y"
      front: "+x"
      evidence: litegen builds this mesh itself, turned a quarter left to face +X (litegen-core/src/providers/model3d/humanoid.rs, turned_humanoid_glb)
    display_name: Mock Turned 3D
    description: >-
      Emits the skinned box humanoid turned to face +X, the way a vendor that
      builds +X-forward delivers its meshes, and declares it in
      native_orientation. litegen turns the delivered file to face +Z
      (`oriented_by: "litegen"`) and keeps the vendor's file as the asset of
      kind `original`.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_3d: true }
    prompt: { required: true, max_length: 1000 }
    params:
      output_formats:
        kind: string_array
        enum_values: [glb]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Mesh containers. The mock emits glb; litegen derives the rest.
    extra_allowlist: []
    tags: [mock, test]

  - id: mock/fail-3d
    provider: mock
    media_type: model3d
    display_name: Mock Failing 3D
    description: Always terminates in `failed` with an error string. Use to test refund / error-surface handling.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_3d: true }
    prompt: { required: true, max_length: 1000 }
    params: {}
    extra_allowlist: []
    tags: [mock, test]

  - id: mock/partial-3d
    provider: mock
    media_type: model3d
    display_name: Mock Partial-Delivery 3D
    description: >-
      Reports `completed` while returning only a glb, whatever was asked for —
      and a glb litegen cannot read, because it declares
      KHR_draco_mesh_compression as required, the way a vendor that compresses
      its meshes under-delivers. litegen delivers only meshes it can read and
      describe, so every request FAILS, at every observer: `[glb]` because the
      glb could not be read, `[glb, fbx]` naming the fbx that never arrived.
    pricing: { base_cost_usd: 0.0 }
    capabilities: { text_to_3d: true }
    prompt: { required: true, max_length: 1000 }
    params:
      output_formats:
        kind: string_array
        enum_values: [glb, fbx]
        max_items: 2
        default: [glb]
        label: Output formats
    extra_allowlist: []
    tags: [mock, test]
