models:
  # Recraft (external.api.recraft.ai/v1). Sync, OpenAI-compatible. Bearer auth.
  # `style` selects the recraft style family (V2/V3 only); `size` is an enumerated
  # set of WxH pairs that Recraft documents as supported (freeform pixel sizes are
  # rejected upstream).
  - id: recraft/recraftv3
    provider: recraft
    media_type: image
    display_name: Recraft V3
    description: Recraft V3 raster image generation.
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    pricing: { base_cost_usd: 0.04 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 1000 }
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
      negative_prompt: { kind: string, max_length: 1000 }
      style:
        kind: string
        # No icon: "`icon` — V2 models only" (endpoints.md, 2026-10-30).
        enum_values: [realistic_image, digital_illustration, vector_illustration, any]
        default: realistic_image
      size:
        kind: size
        mode: enum
        # V2/V3 sizes incl. 16:9 1820x1024 / 9:16 1024x1820: https://www.recraft.ai/docs/api-reference/appendix.md
        values: [[1024,1024],[1365,1024],[1024,1365],[1536,1024],[1024,1536],[1024,1280],[1280,1024],[1024,1707],[1707,1024],[1434,1024],[1024,1434],[1024,2048],[2048,1024],[1820,1024],[1024,1820]]
      # Text layout (PixelGenie 3D doc §4): "supported by Recraft V3 and
      # Recraft V3 Vector models only"; "Each text element consists of an
      # individual word and its bounding box", 4 relative points.
      # @see https://www.recraft.ai/docs/api-reference/endpoints.md (read 2026-10-30)
      layout:
        kind: layout
        kinds: [text]
        max_items: 32
        single_word_text: true
        label: Text layout
        description: Words to render, one per box, as fractions of the canvas.
    # No substyle: Generate has no such field (endpoints.md, 2026-10-30).
    extra_allowlist: [style_id, controls]
    tags: [text-to-image]

  - id: recraft/recraftv3_vector
    provider: recraft
    media_type: image
    display_name: Recraft V3 Vector
    description: Recraft V3 vector (SVG) image generation.
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    pricing: { base_cost_usd: 0.08 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 1000 }
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
      negative_prompt: { kind: string, max_length: 1000 }
      style:
        kind: string
        # No icon: "`icon` — V2 models only" (endpoints.md, 2026-10-30).
        enum_values: [vector_illustration]
        default: vector_illustration
      # No size: "Vector models (every `_vector` model) accept the same 14
      # ratios as `w:h` only; SVG output has no fixed pixel size."
      # @see https://www.recraft.ai/docs/api-reference/appendix.md (2026-10-30)
      # Text layout (PixelGenie 3D doc §4): "supported by Recraft V3 and
      # Recraft V3 Vector models only"; "Each text element consists of an
      # individual word and its bounding box", 4 relative points.
      # @see https://www.recraft.ai/docs/api-reference/endpoints.md (read 2026-10-30)
      layout:
        kind: layout
        kinds: [text]
        max_items: 32
        single_word_text: true
        label: Text layout
        description: Words to render, one per box, as fractions of the canvas.
    # No substyle: Generate has no such field (endpoints.md, 2026-10-30).
    extra_allowlist: [style_id, controls]
    tags: [text-to-image, vector]

  - id: recraft/recraftv2
    provider: recraft
    media_type: image
    display_name: Recraft V2
    description: Recraft V2 raster image generation.
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    pricing: { base_cost_usd: 0.022 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 1000 }
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # negative_prompt: "V2 / V3 models": https://www.recraft.ai/docs/api-reference/endpoints.md
      negative_prompt: { kind: string, max_length: 1000 }
      style:
        kind: string
        enum_values: [realistic_image, digital_illustration, vector_illustration, icon, any]
        default: realistic_image
      size:
        kind: size
        mode: enum
        # V2/V3 sizes incl. 16:9 1820x1024 / 9:16 1024x1820: https://www.recraft.ai/docs/api-reference/appendix.md
        values: [[1024,1024],[1365,1024],[1024,1365],[1536,1024],[1024,1536],[1024,1280],[1280,1024],[1024,1707],[1707,1024],[1434,1024],[1024,1434],[1024,2048],[2048,1024],[1820,1024],[1024,1820]]
    # No substyle: Generate has no such field (endpoints.md, 2026-10-30).
    extra_allowlist: [style_id, controls]
    tags: [text-to-image]

  - id: recraft/recraftv4_1
    provider: recraft
    media_type: image
    display_name: Recraft V4.1
    description: Recraft V4.1 raster image generation (current default).
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    # "$0.035 per image": https://www.recraft.ai/docs/api-reference/pricing.md (2026-09-11)
    pricing: { base_cost_usd: 0.035 }
    capabilities: { text_to_image: true }
    # V4 / V4.1 prompts go to 10000 chars: https://www.recraft.ai/docs/api-reference/appendix.md
    prompt: { required: true, max_length: 10000 }
    # No negative_prompt ("V2 / V3 models"), text_layout ("V3 models only") or
    # curated `style`/substyle (V4.1 styles come via style_id):
    # https://www.recraft.ai/docs/api-reference/endpoints.md,
    # https://www.recraft.ai/docs/api-reference/models/recraft-v4-1.md
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
      size:
        kind: size
        mode: enum
        # V4 / V4.1 sizes: https://www.recraft.ai/docs/api-reference/appendix.md
        values: [[1024,1024],[1536,768],[768,1536],[1280,832],[832,1280],[1216,896],[896,1216],[1152,896],[896,1152],[832,1344],[1280,896],[896,1280],[1344,768],[768,1344]]
    extra_allowlist: [style_id, controls]
    tags: [text-to-image]

  - id: recraft/recraftv4_1_pro
    provider: recraft
    media_type: image
    display_name: Recraft V4.1 Pro
    description: Recraft V4.1 Pro raster image generation.
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    # "$0.21 per image": https://www.recraft.ai/docs/api-reference/pricing.md (2026-09-11)
    pricing: { base_cost_usd: 0.21 }
    capabilities: { text_to_image: true }
    # V4 / V4.1 prompts go to 10000 chars: https://www.recraft.ai/docs/api-reference/appendix.md
    prompt: { required: true, max_length: 10000 }
    # No negative_prompt ("V2 / V3 models"), text_layout ("V3 models only") or
    # curated `style`/substyle (V4.1 styles come via style_id):
    # https://www.recraft.ai/docs/api-reference/endpoints.md,
    # https://www.recraft.ai/docs/api-reference/models/recraft-v4-1.md
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
      size:
        kind: size
        mode: enum
        # V4 Pro / V4.1 Pro (2K) sizes: https://www.recraft.ai/docs/api-reference/appendix.md
        values: [[2048,2048],[3072,1536],[1536,3072],[2560,1664],[1664,2560],[2432,1792],[1792,2432],[2304,1792],[1792,2304],[1664,2688],[2560,1792],[1792,2560],[2688,1536],[1536,2688]]
    extra_allowlist: [style_id, controls]
    tags: [text-to-image]

  # ─── Vector (SVG) models (added 2026-09-11, model-drift) ───────────────────
  # Vector models take `size` as an aspect ratio only ("1:1", "16:9", ...; the
  # Appendix gives them no WxH sizes), which the enumerated WxH `size` param
  # cannot express, so they declare no `size`: Recraft then "auto-selects"
  # the size from the prompt.
  # https://www.recraft.ai/docs/api-reference/appendix.md ("List of supported image sizes")
  - id: recraft/recraftv4_1_vector
    provider: recraft
    media_type: image
    display_name: Recraft V4.1 Vector
    description: Recraft V4.1 vector (SVG) image generation.
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    # "$0.08 per image": https://www.recraft.ai/docs/api-reference/pricing.md (2026-09-11)
    pricing: { base_cost_usd: 0.08 }
    capabilities: { text_to_image: true }
    # V4 / V4.1 prompts go to 10000 chars: https://www.recraft.ai/docs/api-reference/appendix.md
    prompt: { required: true, max_length: 10000 }
    # No negative_prompt ("V2 / V3 models"), text_layout ("V3 models only") or
    # curated `style` (V4.1 styles come via style_id); controls are partial
    # ("colors and background_color"):
    # https://www.recraft.ai/docs/api-reference/endpoints.md,
    # https://www.recraft.ai/docs/api-reference/models/recraft-v4-1.md
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
    extra_allowlist: [style_id, controls]
    tags: [text-to-image, vector]

  - id: recraft/recraftv4_1_pro_vector
    provider: recraft
    media_type: image
    display_name: Recraft V4.1 Pro Vector
    description: Recraft V4.1 Pro vector (SVG) image generation.
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    # "$0.30 per image": https://www.recraft.ai/docs/api-reference/pricing.md (2026-09-11)
    pricing: { base_cost_usd: 0.30 }
    capabilities: { text_to_image: true }
    # V4 / V4.1 prompts go to 10000 chars: https://www.recraft.ai/docs/api-reference/appendix.md
    prompt: { required: true, max_length: 10000 }
    # Same V4.1 parameter rules as recraftv4_1_vector.
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
    extra_allowlist: [style_id, controls]
    tags: [text-to-image, vector]

  - id: recraft/recraftv2_vector
    provider: recraft
    media_type: image
    display_name: Recraft V2 Vector
    description: Recraft V2 vector (SVG) image generation (the cheapest vector model).
    docs_url: https://www.recraft.ai/docs/api-reference/endpoints#generate-image
    # "$0.044 per image": https://www.recraft.ai/docs/api-reference/pricing.md (2026-09-11)
    pricing: { base_cost_usd: 0.044 }
    capabilities: { text_to_image: true }
    # V2 prompts go to 1000 chars: https://www.recraft.ai/docs/api-reference/appendix.md
    prompt: { required: true, max_length: 1000 }
    params:
      # PixelGenie L16, a hint: controls.colors, "An array of preferable colors", at most 10.
      palette: { kind: palette, forced: false, max_colors: 10, label: Palette, description: "Colours to prefer, as #rrggbb (Recraft's controls.colors)." }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # negative_prompt: "V2 / V3 models": https://www.recraft.ai/docs/api-reference/endpoints.md
      negative_prompt: { kind: string, max_length: 1000 }
      style:
        kind: string
        # The Recraft V2 Vector curated styles (vector and icon groups); the
        # default when neither style nor style_id is sent is `Vector art`.
        # https://www.recraft.ai/docs/api-reference/styles.md ("List of curated styles")
        enum_values: ["Vector art", "Line art", "Linocut", "Cartoon", "Flat 2.0", "Color blobs", "Vector Kawaii", "Doodle Line art", "Seamless Vector", "Engraving", "Icon", "Outline", "Pictogram", "Colored outline", "Doodle", "Colored shape", "Gradient outline", "Offset doodle", "Gradient shape", "Broken line", "Offset fill"]
        default: "Vector art"
    # No text_layout ("V3 models only").
    extra_allowlist: [style_id, controls]
    tags: [text-to-image, vector]

  # PixelGenie L8. POST /v1/images/removeBackground: image_url (JSON) or file
  # (multipart); response_format url | b64_json | multipart; image_format webp
  # (lossless, the default) | png. "The input image must be PNG, JPG, WEBP, or
  # SVG, under 20 MB, up to 16 MP, with sides between 256 and 4096 px."
  # Answers {created, credits, image: {image_id, url | b64_json}}.
  # @see https://www.recraft.ai/docs/api-reference/tools/remove-background.md (read 2026-10-30)
  - id: recraft/remove-background
    provider: recraft
    media_type: image
    display_name: Recraft Remove Background
    description: >-
      Recraft's Remove Background: one image in, the subject on a transparent
      background out.
    docs_url: https://www.recraft.ai/docs/api-reference/tools/remove-background
    # "Remove background | POST /images/removeBackground | $0.01" (read 2026-10-30)
    # @see https://www.recraft.ai/docs/api-reference/endpoints.md
    pricing: { base_cost_usd: 0.01 }
    capabilities: { background_removal: true }
    prompt: { required: false, max_length: 0 }
    params:
      # Its image_format; litegen asks for png unless webp is asked.
      output_format: { kind: string, enum_values: [png, webp], default: png }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: file } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: []
    tags: [background-removal]

  # PixelGenie 3D doc §4 (P2), task background_swap. POST
  # /v1/images/replaceBackground: image (multipart) or image_url, prompt
  # (required, "Up to 1,000 characters"), model recraftv3 | recraftv3_vector,
  # style, n, negative_prompt, response_format, image_format webp (lossless,
  # the default) | png. Answers {created, credits, data: [{image_id, url |
  # b64_json}]}.
  # @see https://www.recraft.ai/docs/api-reference/tools/background.md (read 2026-10-30)
  - id: recraft/replace-background
    provider: recraft
    media_type: image
    task: background_swap
    display_name: Recraft Replace Background
    description: >-
      Recraft's Replace Background: finds the init image's background and
      redraws it from the prompt, keeping the subject.
    docs_url: https://www.recraft.ai/docs/api-reference/tools/background
    # "$0.04 / $0.08 per image, raster / vector" (read 2026-10-30); litegen
    # asks for raster (recraftv3).
    pricing: { base_cost_usd: 0.04 }
    capabilities: { image_to_image: true }
    prompt: { required: true, max_length: 1000 }
    params:
      negative_prompt: { kind: string, max_length: 1000 }
      output_format: { kind: string, enum_values: [png, webp], default: png }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: image } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: [style]
    tags: [image-to-image, background-swap]
