models:
  - id: stability/sd3-large
    provider: stability
    media_type: image
    display_name: Stable Diffusion 3 Large
    description: Latest Stability AI model with excellent prompt adherence.
    docs_url: https://docs.stability.ai/api-reference/generate/stable-diffusion-35
    pricing: { base_cost_usd: 0.065 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      # PixelGenie L9: output_format png | jpeg | webp, default png (v2beta).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      negative_prompt: { kind: string, max_length: 10000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "16:9", "9:16", "3:2", "2:3", "4:5", "5:4", "21:9", "9:21"]
        default: "1:1"
      strength: { kind: float, min: 0.0, max: 1.0 }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: image } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [style_preset]
    tags: [text-to-image, image-to-image]

  # SD 3.5 Medium on the same /v2beta/stable-image/generate/sd3 route and body
  # as sd3-large (`model: sd3.5-medium`; text-to-image, or image-to-image with
  # `image` + `strength`), so the typings mirror sd3-large.
  # @see https://api.stability.ai/v2alpha/openapi (/v2beta/stable-image/generate/sd3, re-read 2026-09-11)
  - id: stability/sd3.5-medium
    provider: stability
    media_type: image
    display_name: Stable Diffusion 3.5 Medium
    description: Stable Diffusion 3.5 Medium (2.5B parameters) — a balance of
    docs_url: https://docs.stability.ai/api-reference/generate/stable-diffusion-35
      prompt accuracy and image quality for fast generation.
    # "`sd3.5-medium` requires 3.5 credits per generation" (the sd3 `model`
    # description); 1 credit = $0.01 (re-read 2026-09-11).
    # @see https://docs.stability.ai/pricing.md
    pricing: { base_cost_usd: 0.035 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      # PixelGenie L9: output_format png | jpeg | webp, default png (v2beta).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      negative_prompt: { kind: string, max_length: 10000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "16:9", "9:16", "3:2", "2:3", "4:5", "5:4", "21:9", "9:21"]
        default: "1:1"
      strength: { kind: float, min: 0.0, max: 1.0 }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: image } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [style_preset]
    tags: [text-to-image, image-to-image]

  - id: stability/sd3-turbo
    provider: stability
    media_type: image
    display_name: Stable Diffusion 3 Turbo
    description: Faster, cheaper SD3 variant.
    docs_url: https://docs.stability.ai/api-reference/generate/stable-diffusion-35
    pricing: { base_cost_usd: 0.04 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      # PixelGenie L9: output_format png | jpeg | webp, default png (v2beta).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      negative_prompt: { kind: string, max_length: 10000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        # The /generate/sd3 aspect_ratio enum applies to every sd3.5 model, turbo included
        # (https://api.stability.ai/v2alpha/openapi).
        allowed: ["1:1", "16:9", "9:16", "3:2", "2:3", "4:5", "5:4", "21:9", "9:21"]
        default: "1:1"
    extra_allowlist: []
    tags: [text-to-image, fast]

  - id: stability/core
    provider: stability
    media_type: image
    display_name: Stable Image Core
    description: Fast, affordable image generation.
    docs_url: https://docs.stability.ai/api-reference/generate/stable-image-core
    pricing: { base_cost_usd: 0.03 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      # PixelGenie L9: output_format png | jpeg | webp, default png (v2beta).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      negative_prompt: { kind: string, max_length: 10000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "16:9", "21:9", "2:3", "3:2", "4:5", "5:4", "9:16", "9:21"]
        default: "1:1"
      style:
        kind: string
        enum_values: [3d-model, analog-film, anime, cinematic, comic-book, digital-art, enhance, fantasy-art, isometric, line-art, low-poly, modeling-compound, neon-punk, origami, photographic, pixel-art, tile-texture]
    extra_allowlist: []
    tags: [text-to-image, fast, affordable]

  - id: stability/ultra
    provider: stability
    media_type: image
    display_name: Stable Image Ultra
    description: Highest-quality Stability generation.
    docs_url: https://docs.stability.ai/api-reference/generate/stable-image-ultra
    pricing: { base_cost_usd: 0.08 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      # PixelGenie L9: output_format png | jpeg | webp, default png (v2beta).
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      negative_prompt: { kind: string, max_length: 10000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "16:9", "21:9", "2:3", "3:2", "4:5", "5:4", "9:16", "9:21"]
        default: "1:1"
    extra_allowlist: []
    tags: [text-to-image, premium, photorealistic]

  - id: stability/sdxl
    provider: stability
    media_type: image
    display_name: Stable Diffusion XL
    description: High-quality general purpose image generation.
    docs_url: https://docs.stability.ai/api-reference/sdxl-10/text-to-image
    # "When specifying 30 steps or fewer, generation costs 0.9 credits" ($0.009;
    # the default is 30 steps), re-read 2026-09-11. Above 30 steps the cost is
    # 0.9 * (steps / 30), so our 50-step max is 1.5 credits.
    # @see https://docs.stability.ai/pricing.md
    # @see https://docs.stability.ai/api-reference/sdxl-10/text-to-image (SDXL 1.0 Pricing)
    pricing: { base_cost_usd: 0.009 }
    capabilities: { text_to_image: true, image_to_image: true, inpainting: true }
    prompt: { required: true, max_length: 2000 }
    params:
      negative_prompt: { kind: string, max_length: 2000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      steps: { kind: int, min: 10, max: 50, default: 30 }
      guidance_scale: { kind: float, min: 0.0, max: 35.0, default: 7.0 }
      # Image-to-image only, sent inverted as `image_strength` ("Values close
      # to `1` will yield images very similar to the `init_image`"), so 0 keeps
      # the image as it does on sd3; masking takes none.
      # @see https://docs.stability.ai/openapi-v1.json (2026-10-30)
      strength: { kind: float, min: 0.0, max: 1.0 }
      # The SDXL 1.0 engine accepts only these eight dimension pairs; 512x512 is
      # not one (https://docs.stability.ai/api-reference/sdxl-10/text-to-image).
      # Text-to-image only: image-to-image and masking take the init image's size.
      size:
        kind: size
        mode: enum
        values: [[1024,1024],[1152,896],[896,1152],[1216,832],[1344,768],[768,1344],[1536,640],[640,1536]]
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: multipart, field_map: { init: init_image, mask: mask_image } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        # White edits (sent with mask_source=MASK_IMAGE_WHITE), and a mask needs
        # an init image: masking is `required: ["text_prompts","init_image",
        # "mask_source"]`, and the adapter refuses a mask alone.
        mask: { required: false, min_count: 0, max_count: 1, convention: white_edits }
    extra_allowlist: []
    tags: [text-to-image, image-to-image, inpainting]

  # ─── Edits (PixelGenie 3D doc §4) ──────────────────────────────────────────
  # @see https://api.stability.ai/v2alpha/openapi (2026-10-30), POST
  #   /v2beta/stable-image/edit/inpaint: image and prompt required; mask ("a
  #   black and white image that represents, at any pixel, the strength of
  #   inpainting" — white is full strength); grow_mask 0–100, default 5
  #   ("Grows the edges of the mask outward in all directions"); seed;
  #   negative_prompt; output_format (jpeg | png | webp).
  - id: stability/inpaint
    provider: stability
    media_type: image
    display_name: Stable Image Inpaint
    description: >-
      Replaces the masked part of an image (Stability's Inpaint). The mask is
      white-edits, Stability's own convention, and `mask_grow_px` goes to its
      `grow_mask` (sent as 0 unless asked: Stability's default is 5). A
      region is sent drawn as the mask.
    docs_url: https://docs.stability.ai/api-reference/edit/inpaint
    # @see https://docs.stability.ai/pricing.md (2026-10-30): "Inpaint — Use a
    #   mask (or alpha channel) to replace anything in an image — 5" credits;
    #   "1 credit equals $0.01" → $0.05.
    pricing: { base_cost_usd: 0.05 }
    capabilities: { text_to_image: false, image_to_image: true, inpainting: true }
    prompt: { required: true }
    preserves_unmasked: unspecified
    params:
      negative_prompt: { kind: string }
      seed: { kind: seed, min: 0, max: 4294967294 }
      region:
        kind: region
        input: mask
        label: Region
        description: The rectangle to edit, sent drawn as the mask.
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: multipart, field_map: { init: image, mask: mask } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1, convention: white_edits, native_grow: true }
    extra_allowlist: []
    tags: [image-to-image, inpainting]

  # 3D doc §4 (P2), a mask named in text. Multipart: image (required), prompt
  # (required), search_prompt (required, "Short description of what to
  # inpaint", maxLength 10000), negative_prompt, grow_mask (0–20, default 3;
  # litegen sends 0, as for inpaint), seed, output_format png | jpeg | webp,
  # style_preset.
  # @see https://api.stability.ai/v2alpha/openapi (read 2026-10-30)
  - id: stability/search-and-replace
    provider: stability
    media_type: image
    display_name: Stable Image Search and Replace
    description: >-
      Stability's Search and Replace: finds what `mask_prompt` names in the
      init image and replaces it with what the prompt describes.
    docs_url: https://docs.stability.ai/api-reference/edit/search-and-replace
    # "Search and Replace | Use simple words to automatically find an object in
    # image and replace it with the desired prompt | 5" credits; "1 credit =
    # $0.01" → $0.05 (docs.stability.ai/pricing.md, read 2026-10-30).
    pricing: { base_cost_usd: 0.05 }
    capabilities: { image_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      mask_prompt: { kind: string, max_length: 10000, label: Find, description: What to replace, named (Stability's search_prompt). }
      negative_prompt: { kind: string, max_length: 10000 }
      seed: { kind: seed, min: 0, max: 4294967294 }
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: image } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: []
    tags: [image-to-image, inpainting]

  # 3D doc §4 (P2). Multipart: image (required; jpeg, png or webp, "Every side
  # must be at least 64 pixels", "Total pixel count must be between 4,096 and
  # 9,437,184 pixels", "aspect ratio must be between 1:2.5 and 2.5:1"), left,
  # right, up, down (0–2000; "At least one outpainting direction must be
  # supplied with a non-zero value"), prompt, creativity, seed, output_format
  # png | jpeg | webp, style_preset.
  # @see https://api.stability.ai/v2alpha/openapi (read 2026-10-30)
  - id: stability/outpaint
    provider: stability
    media_type: image
    display_name: Stable Image Outpaint
    description: >-
      Stability's Outpaint: grows the init image's canvas by up to 2,000 px a
      side, filling the new space, optionally guided by a prompt.
    docs_url: https://docs.stability.ai/api-reference/edit/outpaint
    # "Outpaint | Inserts additional content in an image to fill in the space
    # in any direction | 4" credits; "1 credit = $0.01" → $0.04
    # (docs.stability.ai/pricing.md, read 2026-10-30).
    pricing: { base_cost_usd: 0.04 }
    capabilities: { image_to_image: true }
    prompt: { required: false, max_length: 10000 }
    params:
      expand:
        kind: expand
        max_px: 2000
        label: Expand
        description: Pixels to add to each side (Stability's left, up, right, down).
      seed: { kind: seed, min: 0, max: 4294967294 }
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: image } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: [creativity]
    tags: [image-to-image, outpainting]

  # PixelGenie L8. Multipart: image (required; jpeg, png or webp, "Every side
  # must be at least 64 pixels", "Total pixel count must be between 4,096 and
  # 4,194,304 pixels"), output_format png | webp (default png). No prompt.
  # @see https://api.stability.ai/v2alpha/openapi (read 2026-10-30)
  - id: stability/remove-background
    provider: stability
    media_type: image
    display_name: Stable Image Remove Background
    description: >-
      Stability's Remove Background: one image in, the subject on a
      transparent background out.
    docs_url: https://docs.stability.ai/api-reference/edit/remove-background
    # "Remove Background | Removes the background while preserving foreground
    # | 5" credits; "1 credit = $0.01" → $0.05 (docs.stability.ai/pricing.md,
    # read 2026-10-30).
    pricing: { base_cost_usd: 0.05 }
    capabilities: { background_removal: true }
    prompt: { required: false, max_length: 0 }
    params:
      output_format: { kind: string, enum_values: [png, webp], default: png }
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: multipart, field_map: { init: image } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: []
    tags: [background-removal]
