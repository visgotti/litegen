# Meshy — first-party 3D operations on Meshy's API (https://api.meshy.ai/openapi).
# Auth: `Authorization: Bearer msy_…`. API credits are prepaid and bought
# separately: "The Meshy API uses prepaid credits. Before you send API
# requests, buy API credits in your subscription settings"
# (https://docs.meshy.ai/en/api/pricing, 2026-10-30), and no USD price for
# them is published. Prices below use the Pro plan's $20 for 1,000 credits
# ($0.02 a credit, https://www.meshy.ai/pricing, 2026-10-30) — provisional.
# @see https://docs.meshy.ai/openapi.json (RiggingRequest, AnimationRequest; 2026-10-30)

models:
  # ─── Rigging (PixelGenie 3D doc §3B) ───────────────────────────────────────
  # @see https://docs.meshy.ai/en/api/rigging (2026-11-09): model_url ("a GLB
  #   (`.glb`) file of at most 400 MB from an `http` or `https` URL, or 100 MB
  #   as a data URI") or input_task_id; height_meters (default 1.7); "The
  #   model can have at most 380,000 triangles (a quad counts as 2), and a
  #   model with more returns `400`." (max_faces below stays at 320,000, the
  #   limit Meshy published before; a test pins it); "Rigging isn't suitable
  #   for these models: - Untextured meshes - Non-humanoid assets - Humanoid
  #   assets with an unclear limb and body structure"; "The character's face
  #   must point toward the +Z axis". animation_type (biped | quadruped,
  #   default biped) is in the OpenAPI spec only (2026-11-09).
  - id: meshy/rig
    provider: meshy
    media_type: model3d
    task: rig
    display_name: Meshy Auto Rig
    description: >-
      Meshy's auto-rigger: a textured character GLB facing +Z in, a rigged
      GLB out (with Meshy's own FBX when one is promised). Humanoids by
      default; `skeleton: quadruped` for four-legged characters. Chain
      meshy/animate onto the result.
    docs_url: https://docs.meshy.ai/en/api/rigging
    # "Automatic rigging | 5 per request" (credits) × $0.02 = $0.10, provisional.
    pricing: { base_cost_usd: 0.10 }
    capabilities: {}
    prompt: { required: false, max_length: 0 }
    params:
      source_model:
        kind: source_model
        formats: [glb]
        max_bytes: 100000000
        max_faces: 320000
        requires_texture: true
        label: Source mesh
        description: A textured character facing +Z, sent inline (at most 100 MB and 320,000 faces).
      skeleton:
        kind: string
        enum_values: [humanoid, quadruped]
        default: humanoid
        label: Skeleton
        description: Meshy's animation_type (biped or quadruped).
      height_m:
        kind: float
        default: 1.7
        label: Height (m)
        description: The character's height in metres (Meshy's height_meters).
      joint_naming:
        kind: string
        enum_values: [vendor, vrm, unity, mixamo]
        default: vendor
        label: Joint naming
        description: >-
          `vendor` keeps Meshy's own joint names; `vrm`, `unity` and `mixamo`
          are litegen's renames of them, from the humanoid table it reads
          Meshy's rigs with (3D doc §3B). Humanoids only.
      output_formats:
        kind: string_array
        enum_values: [glb, fbx]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Meshy returns glb and fbx; litegen derives the rest.
    extra_allowlist: []
    tags: [rig, 3d-operation]

  # ─── Animation (PixelGenie 3D doc §3C) ─────────────────────────────────────
  # @see https://docs.meshy.ai/en/api/animation (2026-10-30): rig_task_id ("The
  #   ID of the Rigging task whose character to animate"), action_ids ("The
  #   IDs of 1 to 10 preset animations to apply at once, with no repeats"; one
  #   merged file, one clip per action in order), post_process {operation_type:
  #   change_fps, fps: 24 | 25 | 30 | 60}, which returns
  #   processed_animation_fps_fbx_url. Meshy has no in-place flag (its library
  #   has `_inplace` variants), so litegen holds in-place clips itself.
  # @see https://api.meshy.ai/web/public/animations/resources (2026-10-30): the
  #   library, every id below with Meshy's name. The canonical tags are
  #   litegen's choice of the plainest clip for each.
  - id: meshy/animate
    provider: meshy
    media_type: model3d
    task: animate
    native_orientation:
      up: source
      front: source
      evidence: Meshy retargets the clips onto the character it rigged (rig_task_id) and returns it with its skin
    display_name: Meshy Animation
    description: >-
      Up to ten clips from Meshy's animation library on a rig made by
      meshy/rig on the same Meshy account — Meshy animates only its own rig,
      so any other source is refused 422 `source_not_chainable` — merged into
      one file in request order. Each action at most once per request.
    docs_url: https://docs.meshy.ai/en/api/animation
    # "3 per action" (credits) × $0.02 = $0.06 for one clip, provisional;
    # Billed per clip.
    pricing:
      base_cost_usd: 0.06
      variable_pricing:
        - { per_item_usd: 0.06, per_item: animations }
    capabilities: {}
    prompt: { required: false, max_length: 0 }
    params:
      source_model:
        kind: source_model
        formats: [glb]
        requires_skin: true
        label: Source rig
        description: A meshy/rig generation made on the same Meshy account (Meshy animates only its own rig task).
      animations:
        kind: animation_list
        max_items: 10
        in_place: litegen
        label: Animations
