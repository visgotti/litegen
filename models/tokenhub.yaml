  # polled at GET /v1/wand/vidu/tasks/{task_id} ("state … created / queueing /
  # processing / success / failed", creations[].url). The endpoint follows the
  # images (as video/vidu.rs picks it); each row's duration range is valid on
  # every endpoint it reaches. Images are data URIs ("格式要求：
  # data:image/<图片格式>;base64,"). References go in the images form (litegen sends
  # no `subjects`), "支持1张-3张图片输入" (q4-preview: "参考图最多 15 张"), with a prompt
  # "直接参考方式 ≤ 2000 字符"; audio on references "非主体调用时仅 q3 支持".
  # Prices: per second of output (10 ¥ per million tokens), × 0.14987.
  # @see https://cloud.tencent.com/document/product/1823/135756 (2026-11-09)
  # @see https://cloud.tencent.com/document/product/1823/130055 (2026-11-09)
  - id: tokenhub/vidu-video-q4-preview
    provider: tokenhub
    media_type: video
    display_name: Vidu Q4 Preview (TokenHub)
    description: Vidu Q4 Preview through Tencent TokenHub — a first frame or up to 15 references, 3–16 s, 540p to 4K, with sound.
    docs_url: https://cloud.tencent.com/document/product/1823/135756
    # "Vidu-Video-q4-preview | 图生 / 参考生 / 音画同出 | 540P | … 0.28125 元/秒", 720P 0.59375,
    # 1080P 0.75, 2K 1.1875, 4K 2.4375: $0.0422 / $0.0890 / $0.1124 / $0.1780 /
    # $0.3653 per s; 5 s at 720p = $0.445.
    pricing:
      base_cost_usd: 0.445
      variable_pricing:
        - { per_second_usd: 0.089 }
        - { when: { resolution: 540p }, per_second_usd: 0.0422 }
        - { when: { resolution: 1080p }, per_second_usd: 0.1124 }
        - { when: { resolution: 2K }, per_second_usd: 0.178 }
        - { when: { resolution: 4K }, per_second_usd: 0.3653 }
    # No text-to-video ("文生视频 | 不支持"): a first frame or references are required.
    capabilities: { text_to_video: false, image_to_video: true }
    prompt: { required: false, max_length: 5000 }
    params:
      # "q3-pro / q3-turbo、q4-preview 默认 true" (image-to-video); with references
      # only q3 has sound ("非主体调用时仅 q3 支持"), so audio there is refused.
      audio: { kind: bool, default: true }
      duration_seconds: { kind: int, min: 3, max: 16, default: 5 }
      resolution: { kind: string, enum_values: [540p, 720p, 1080p, 2K, 4K], default: 720p }
      # References only; an image sets the shape.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16", "1:1", "3:4", "4:3"]
        default: "16:9"
        # "图生视频、首尾帧生视频无此参数，输出画幅跟随输入图片比例。" (E5)
        # @see https://cloud.tencent.com/document/product/1823/135756 (2026-11-11)
        frames_set_shape: without_references
      seed: { kind: seed, min: 1, max: 2147483647 }
    ref_inputs:
      max_total: 15
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 15 }
    extra_allowlist: []
    tags: [image-to-video, reference-to-video]

