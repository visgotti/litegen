  # ── MiniMax video, resold on TokenHub ────────────────────────────────────────
  # The models minimax/* serve direct, through TokenHub's key and bill. v2.3 and
  # v2.3-fast take flat fields at POST /v1/wand/minimax-video/generation
  # (first_frame_image, last_frame_image; answer {task_id, base_resp}; polled at
  # GET …/minimax-video/tasks/{task_id}: "Processing / Success / Fail",
  # content.url); H3 and H3-Max take a `content` list at POST
  # /v1/wand/minimax-video-v2/generation (a text part, then image_url parts with
  # role first_frame | last_frame | reference_image; polled at
  # …/minimax-video-v2/tasks/{task_id}: task.status "queued / running /
  # succeeded / failed / cancelled"). Frames and references are not mixed (the
  # guide's text-to-video, image-to-video and reference sections are separate).
  # @see https://cloud.tencent.com/document/product/1823/135737 (2026-11-09)
  # @see https://cloud.tencent.com/document/product/1823/130055 (2026-11-09)
  - id: tokenhub/minimax-video-v2.3
    provider: tokenhub
    media_type: video
    display_name: MiniMax Hailuo 2.3 (TokenHub)
    description: MiniMax Hailuo 2.3 through Tencent TokenHub — text or first/last frames, 6 or 10 s.
    docs_url: https://cloud.tencent.com/document/product/1823/135737
    # "MiniMax-Video-v2.3 | 文 / 图生视频 6s | 768P | … 0.333333 元/秒", 6s 1080P 0.583333,
    # 10s 768P 0.4: ¥2 = $0.2997 (the default, 6 s 768P), ¥3.5 = $0.5245, ¥4 = $0.5995.
    pricing:
      base_cost_usd: 0.2997
      variable_pricing:
        - { when: { duration_seconds: 10 }, usd: 0.5995 }
        - { when: { resolution: 1080P }, usd: 0.5245 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "文本提示词，≤ 2000 字符" — required without an image (the adapter refuses neither).
    prompt: { required: false, max_length: 2000 }
    params:
      # "768P：6 或 10；1080P：仅 6。默认值：6。" — 10 s at 1080P is refused.
      duration_seconds: { kind: int, min: 6, max: 10, default: 6, values: [6, 10] }
      resolution: { kind: string, enum_values: [768P, 1080P], default: 768P }
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
    # prompt_optimizer ("默认值：true"), fast_pretreatment, aigc_watermark.
    extra_allowlist: [prompt_optimizer, fast_pretreatment, aigc_watermark]
    extra_params:
      # From the comment above (prompt_optimizer "默认值：true").
      prompt_optimizer: { kind: bool, default: true }
      fast_pretreatment: { kind: bool }
      aigc_watermark: { kind: bool }
    tags: [text-to-video, image-to-video]

