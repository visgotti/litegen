  # YouTu image-to-video (腾讯优图, Tencent's own): the model hunyuan/hunyuan-video-i2v
  # calls on the old platform (SubmitImageToVideoGeneralJob), on TokenHub's
  # OpenAI-style video API: POST /v1/api/video/submit {model, image, …} →
  # {id, status: queued}; POST /v1/api/video/query {model, id} → {status,
  # progress, data: {url}}. "请求的具体参数与原接口一致 … 参数统一以小写下划线形式呈现": the old
  # action's Image / Prompt / Resolution / Fps as image / prompt / resolution / fps.
  # @see https://cloud.tencent.com/document/product/1823/135716 (2026-11-09)
  # @see https://cloud.tencent.com/document/api/1616/124465 (the action's fields; 2026-09-11)
  - id: tokenhub/yt-video-2.0
    provider: tokenhub
    media_type: video
    display_name: YouTu Video 2.0 (TokenHub)
    description: Tencent YouTu image-to-video on TokenHub — 5 s at 480p, 720p or 1080p.
    docs_url: https://cloud.tencent.com/document/product/1823/135716
    # "YT-Video-2.0 | 1.0 | 按次计算消耗。480p：2 积分/次 720p/1080p：5 积分/次": ¥2 = $0.2997 at
    # 480p, ¥5 = $0.7494 at 720p (the default) and 1080p.
    pricing:
      base_cost_usd: 0.7494
      variable_pricing:
        - { when: { resolution: 480p }, usd: 0.2997 }
    capabilities: { text_to_video: false, image_to_video: true }
    # The action's Prompt: "最多支持200个 utf-8 字符" (optional).
    prompt: { required: false, max_length: 200 }
    params:
      # A 5 s clip; no duration field.
      duration_seconds: { kind: float, min: 5.0, max: 5.0, default: 5.0 }
      # Resolution "480p | 720p | 1080p" (no documented default: 720p is sent).
      resolution: { kind: string, enum_values: ["480p", "720p", "1080p"], default: "720p" }
      # Fps "16 | 24 | 30" (default 30).
      fps: { kind: int, min: 16, max: 30, default: 30, values: [16, 24, 30] }
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: true, min_count: 1, max_count: 1 }
    # logo_add (the action's LogoAdd).
    extra_allowlist: [logo_add]
    extra_params:
      # From the comment above (the action's LogoAdd, an *int64 in hunyuan/vclm-*.txt).
      logo_add: { kind: int }
    tags: [image-to-video]
