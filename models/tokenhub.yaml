  # Hy-Video 1.5 (hy-video-v1.5): POST /v1/wand/hunyuan-video/generation, then
  # GET /v1/wand/hunyuan-video/tasks/{task_id} ("任务状态统一为：queued（等待调度）/
  # running（生成中）/ succeeded（成功）/ failed（失败）"); the video is videos[].url, a
  # signed COS link. Text-to-video without an image, image-to-video with one
  # ("携带 image 或 image_url 即图生视频，否则为文生视频"). The model list spells the
  # retired per-second version "hy-video-1.5" (offline 2026-09-21); the guide's
  # "取值：hy-video-v1.5" is the token-billed one litegen calls.
  # @see https://cloud.tencent.com/document/product/1823/137202 (2026-11-09)
  - id: tokenhub/hy-video-v1.5
    provider: tokenhub
    media_type: video
    display_name: Hy-Video 1.5
    description: Tencent Hunyuan Video 1.5 on TokenHub — 5 s 720p clips from text or a first frame.
    docs_url: https://cloud.tencent.com/document/product/1823/137202
    # "Hy-Video-1.5 | 文 / 图生视频 | 720P | 10元/百万 tokens | 30,000 tokens/秒 |
    # 0.3 元/秒": a 5 s clip is ¥1.5 = $0.2248 (1.5 × 0.14987), text or image.
    # @see https://cloud.tencent.com/document/product/1823/130055 (2026-11-09)
    pricing: { base_cost_usd: 0.2248 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "文本提示词。文生视频必选；图生视频可选" — the adapter refuses a request with
    # neither a prompt nor an image. TokenHub documents no prompt limit here.
    prompt: { required: false }
    params:
      negative_prompt: { kind: string }
      # "视频时长（秒），小数将截断为整数。当前版本固定生成 5 秒。" — sent as 5.
      duration_seconds: { kind: float, min: 5.0, max: 5.0, default: 5.0 }
      # "清晰度。当前版本固定输出 720p。"
      resolution: { kind: string, enum_values: ["720p"], default: "720p" }
      # "画面宽高比，仅文生视频有效。枚举：16:9 / 9:16 / 1:1 / 4:3 / 3:4" — image-to-video
      # follows its image ("图生视频的画面比例由输入图片决定，不支持 aspect_ratio 参数"),
      # so the adapter sends it only without one.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16", "1:1", "4:3", "3:4"]
        # The quote above: a frame sets the shape (E5).
        # @see https://cloud.tencent.com/document/product/1823/137202 (2026-11-11)
        frames_set_shape: without_references
    # image: "图片（单张）… 图片格式：jpg/jpeg/png，图片大小≤10MB … Base64：格式要求：
    # data:image/<图片格式>;base64,<Base64 编码>" — sent as a data URI.
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
    # revise ("是否开启提示词智能改写") and footnote (a watermark, "限制 16 个字符长度").
    # Not seed ("是否生效以模型侧为准": its effect is not promised), n (one video
    # is billed), nor moderation (the vendor's moderation stays on).
    extra_allowlist: [revise, footnote]
    extra_params:
      # From TokenHub's docs (drift snapshot hunyuan/tokenhub-hy-video.txt).
      revise: { kind: bool }
      footnote: { kind: string, max_length: 16 }
    tags: [text-to-video, image-to-video]

  # WAND-Vega-Video-1.0-Lite (Tencent Cloud WAND, "腾讯云面向音视频场景打造的 AI 能力品牌"):
  # POST /v1/wand/vega-videos/tasks ("提交成功以 HTTP 状态码 201 + 返回 id 为准"), then GET
  # /v1/wand/vega-videos/tasks/{id} ("queued（排队中）、running（生成中）、succeeded（生成
  # 成功）、failed（生成失败）"); the video is content.video_url, a temporary link
  # (12 h). "三种生成形态（文生、首尾帧生、参考生）共用本接口，通过 content 数组中元素的 type
  # 与 role 组合区分": the adapter keeps them apart (frames or references, not
  # both; a last frame only after a first). Reference videos and audio
  # (reference_video / reference_audio) are not offered.
  # @see https://cloud.tencent.com/document/product/1823/138195 (2026-11-09)
  - id: tokenhub/wand-vega-video-1.0-lite
    provider: tokenhub
    media_type: video
    display_name: WAND-Vega Video 1.0 Lite
    description: Tencent Cloud WAND-Vega video on TokenHub — text, first/last frames or up to 9 reference images; 4–15 s, 768P to 4K.
    docs_url: https://cloud.tencent.com/document/product/1823/138195
    # "WAND-Vega-Video-1.0-Lite | 文 / 图生视频、参考生视频 | 768P | … 输出视频 37500
    # tokens/秒 … 输出视频0.375元/秒 输入图片前5张免费 第6张起0.15元/张"; 1080P 0.5,
    # 2K 0.625, 4K 0.75 元/秒. Per second: $0.0562 (768P), $0.0749, $0.0937,
    # $0.1124 (× 0.14987). The default request (5 s; resolution has no
    # documented default, so the adapter sends 768P): ¥1.875 = $0.2810. From the
    # 6th input image, + ¥0.15 = $0.0225 each.
    # @see https://cloud.tencent.com/document/product/1823/130055 (2026-11-09)
    pricing:
      base_cost_usd: 0.281
      variable_pricing:
        - { per_second_usd: 0.0562 }
        - { when: { resolution: 1080P }, per_second_usd: 0.0749 }
        - { when: { resolution: 2K }, per_second_usd: 0.0937 }
        - { when: { resolution: 4K }, per_second_usd: 0.1124 }
        - { when: { references: 6 }, add_usd: 0.0225 }
        - { when: { references: 7 }, add_usd: 0.045 }
        - { when: { references: 8 }, add_usd: 0.0675 }
        - { when: { references: 9 }, add_usd: 0.09 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "content … 必须包含至少 1 个 type=text 元素（生成需要文本提示词）… type=text 时必填且不可为空串"
    prompt: { required: true }
    params:
      # "视频时长（秒）。取值：4 ~ 15 的整数，默认 5。"
      duration_seconds: { kind: int, min: 4, max: 15, default: 5 }
      # "视频分辨率。Lite 取值：768P、1080P、2K、4K" (no default given; "超出当前模型档位的
      # resolution 会在提交阶段直接返回 400").
      resolution: { kind: string, enum_values: ["768P", "1080P", "2K", "4K"], default: "768P" }
      # "画面宽高比。取值：21:9、16:9、4:3、1:1、3:4、9:16、adaptive（默认）" — unset is
      # adaptive ("由模型或输入素材自动决定").
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
    # image_url parts with a role: "首帧（role=first_frame）最多 1 张，尾帧（role=last_frame）
    # 最多 1 张"; references "建议参考图不超过 9 张 … 素材合计不超过 12 个". The url is sent
    # as a data URI (the guide shows only https URLs: not verified live).
    ref_inputs:
      max_total: 9
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 9 }
    # options.return_last_frame is not offered: litegen delivers one video.
    extra_allowlist: []
    tags: [text-to-video, image-to-video, reference-to-video]

