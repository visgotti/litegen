models:
  # Tencent TokenHub (大模型服务平台 TokenHub): Tencent's model hub, where
  # Tencent moves every Hunyuan model ("腾讯混元大模型相关功能将逐步迁移至 TokenHub。
  # 迁移后，原平台将不再新增模型能力，并停止支持新购模型服务。用户已购买的模型服务可继续
  # 使用" — the old platform keeps serving existing buyers, so the `hunyuan`
  # provider stays for them; new Hunyuan models and new customers are here).
  # One TokenHub API key for every model: "鉴权方式为请求头 Authorization: Bearer
  # YOUR_API_KEY". Host https://tokenhub.tencentmaas.com (`api_base`).
  # Carried: Tencent's own generation models. Third-party models TokenHub
  # resells (Kling, Vidu, Seedream, MiniMax, PixVerse, Tripo, Rodin, Hi3D) are
  # skipped: litegen calls those vendors direct (scripts/model-drift/providers/tokenhub.mjs).
  # Prices are in CNY ("按 Token 计费", 10 ¥ per million tokens, at the price
  # table's per-output token counts), converted at the ECB reference rate for
  # 2026-11-03 (1 CNY = 0.14987 USD, via
  # https://api.frankfurter.dev/v1/latest?base=CNY&symbols=USD).
  # @see https://cloud.tencent.com/document/product/1729/105925 (the migration notice; 2026-11-09)
  # @see https://cloud.tencent.com/document/product/1823/130051 (model list; 2026-11-09)
  # @see https://cloud.tencent.com/document/product/1823/130055 (prices; 2026-11-09)

  # Hy-Image-3.5-preview: POST /v1/wand/hunyuan-image/v35-generation, a
  # synchronous call ("两个模型均为同步调用：一次请求直接返回生成结果，无需提交任务与轮询")
  # in an OpenAI Chat-style `messages` shape; the answer's
  # choices[0].delta.image.url is the image ("业务侧判断是否成功建议依据
  # choices[0].delta.image.url 是否存在"), a signed COS link valid 12 h, which the
  # adapter downloads. Its sibling hy-image-v3 is not carried: TokenHub retires
  # it on 2026-11-12 ("Hy-Image-3.0（2026-11-12 下线）", the model list and the
  # price table cited above).
  # @see https://cloud.tencent.com/document/product/1823/135745 (2026-11-09)
  - id: tokenhub/hy-image-v3.5-preview
    provider: tokenhub
    media_type: image
    display_name: Hy-Image 3.5 Preview
    description: Tencent Hunyuan Image 3.5 preview on TokenHub — text-to-image and edits from up to 20 images, up to 4K.
    docs_url: https://cloud.tencent.com/document/product/1823/135745
    # "Hy-Image-3.5-preview | 文生图、参考生图、多轮编辑 | 1K | 10 元/百万 tokens |
    # 15,000 tokens/张 | 0.15 元/张", 2K the same, 4K "20,000 tokens/张 | 0.2 元/张".
    # The default request (no size: the model picks one at its 1.5K tier) is
    # ¥0.15 = $0.0225 (0.15 × 0.14987). A size above the 2K tier (4,194,304 px,
    # generate_max_pixels' top) is the 4K row: ¥0.20 = $0.0300. TokenHub bills
    # the tokens an answer reports (tokenhub_usage.total_tokens); litegen bills
    # the table's figure per image (known-gaps.md).
    # @see https://cloud.tencent.com/document/product/1823/130055 (2026-11-09)
    pricing:
      base_cost_usd: 0.0225
      variable_pricing:
        - { when: { size: '*', megapixels: { gt: 4.194304 } }, usd: 0.03 }
    capabilities: { text_to_image: true, image_to_image: true }
    # The model list gives the input limit as "100k tokens" (text and images
    # together), not characters; 8192 characters (Hy-Image-3.0's and
    # WAND-Vega's stated limit) keeps the text well inside it whatever the
    # tokenizer does.
    prompt: { required: true, max_length: 8192 }
    params:
      # size: "生成尺寸，格式 ${宽}x${高}。约束：1. 宽、高均为正整数，取值范围 [256, 8192]。
      # 2. 宽 × 高（面积）不超过 16777216，即最高支持 4096×4096（4K）。… 传入具体值时强制按
      # 指定尺寸出图" — an exact size; 4K is reached only this way.
      size:
        kind: size
        mode: freeform
        min_width: 256
        max_width: 8192
        min_height: 256
        max_height: 8192
        max_pixels: 16777216
      # resolution → generate_max_pixels: "支持 3 个枚举档位：1048576（1K，1024×1024）、
      # 2359296（1.5K，默认）、4194304（2K）… 仅在未传 size 时生效". Alone it gives a
      # square image ("只传 generate_max_pixels：默认 1:1 比例"); with neither, the
      # model picks the shape from the prompt at the 1.5K tier ("都不传：由模型基于
      # prompt 语义自主决定（默认走 1.5K 档）").
      resolution: { kind: string, enum_values: ["1K", "1.5K", "2K"], default: "1.5K" }
      # aspect_ratio → a size of that ratio sent beside generate_max_pixels (the
      # tier asked for, else 1.5K): "size + generate_max_pixels：最终宽高由内部逻辑综合
      # 计算，尽量贴近 size 的宽高比例与 generate_max_pixels 的面积档位" — the vendor
      # keeps close to the ratio and picks the exact sides. Not with `size`.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16", "21:9", "9:21"]
      # seed: "int64 类型，范围 [0, 2^63-1]；为 0 或不传时服务端随机分配。负值将被拒绝。"
      # 0 is the vendor's random seed, so a fixed seed starts at 1.
      seed: { kind: seed, min: 1, max: 9223372036854775807 }
    # Images go in the user message as image_url parts: "支持 http(s) 公网 URL 或
    # data:image/...;base64,... 形态；单图大小 ≤ 20MB，图片总数量 ≤ 20 张"; png / jpeg /
    # jpg. The prompt says what each image is for (reference, edit), so they
    # share one role. Sent as data URIs: a URL must be public and unauthenticated
    # ("若为内网/带鉴权域名，需联系 TokenHub 侧加入白名单").
    ref_inputs:
      max_total: 20
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 20 }
    # footnote: "业务自定义水印内容，最长 16 字符 … 生成在图片右下角"; use_search_tool:
    # "外部搜索增强开关，结构固定为 {"value": true} 或 {"value": false}". Not
    # resize_max_pixels (it raises the input-image tokens TokenHub bills) nor
    # session (a multi-turn affinity key).
    extra_allowlist: [footnote, use_search_tool]
    extra_params:
      # From the comment above; use_search_tool (an object) stays untyped.
      footnote: { kind: string, max_length: 16 }
    tags: [text-to-image, image-to-image]

  # Kling Omni, resold: POST /v1/wand/kling/omni-video for text and frames alike
  # (`contents`: the prompt, then first_frame / last_frame; `settings` as the
  # other Kling rows, aspect_ratio "无首帧且无参考视频时必填"). refer_image, videos,
  # elements and voices are not offered: the guide gives no refer_image count for
  # V3 Omni or O1, and the reference-video prices need inputs litegen does not send.
  - id: tokenhub/kling-video-v3-omni
    provider: tokenhub
    media_type: video
    display_name: Kling Video 3.0 Omni (TokenHub)
    description: Kling 3.0 Omni through Tencent TokenHub — text or first/last frames, native audio, multi-shot, up to 4K.
    docs_url: https://cloud.tencent.com/document/product/1823/135742
    # "Kling-Video-V3-omni | 无参考视频 - 无声 | 720P | 60,000 tokens/秒 | 0.6 元/秒", 1080P 0.8, 4K 3;
    # "无参考视频 - 有声" 720P 0.8, 1080P 1, 4K 3: $0.0899 / $0.1199 / $0.4496 silent,
    # $0.1199 / $0.1499 / $0.4496 with sound; 5 s at 720p silent = $0.4495.
    pricing:
      base_cost_usd: 0.4495
      variable_pricing:
        - { per_second_usd: 0.0899 }
        - { when: { audio: true }, per_second_usd: 0.1199 }
        - { when: { resolution: 1080p }, per_second_usd: 0.1199 }
        - { when: { resolution: 1080p, audio: true }, per_second_usd: 0.1499 }
        - { when: { resolution: 4k }, per_second_usd: 0.4496 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "≤ 2500 字符（V3 Omni 建议 ≤ 2500，上限 3072）"
    prompt: { required: true, max_length: 2500 }
    params:
      # "V3 Omni：native / original / off（默认 off）" — native or off (original needs a reference video).
      audio: { kind: bool, default: false }
      duration_seconds: { kind: int, min: 3, max: 15, default: 5 }
      resolution: { kind: string, enum_values: [720p, 1080p, 4k], default: 720p }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16", "1:1"]
        # "注意：图生视频无 aspect_ratio 参数，画幅由输入图片决定。" — a frame sets the shape (E5).
        # @see https://cloud.tencent.com/document/product/1823/135742 (2026-11-11)
        frames_set_shape: without_references
        default: "16:9"
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
    # "multi_shot | 否 | 仅 V3 Omni。是否生成多镜头视频，默认 true。"
    extra_allowlist: [multi_shot]
    extra_params:
      # From the comment above ("默认 true").
      multi_shot: { kind: bool, default: true }
    tags: [text-to-video, image-to-video]

  - id: tokenhub/kling-video-o1
    provider: tokenhub
    media_type: video
    display_name: Kling Video O1 (TokenHub)
    description: Kling O1 through Tencent TokenHub — text or first/last frames, 3–10 s, 720p or 1080p.
    docs_url: https://cloud.tencent.com/document/product/1823/135742
    # "Kling-Video-O1 | 无参考视频 | 720P | 60,000 tokens/秒 | 0.6 元/秒", 1080P 0.8: $0.0899 /
    # $0.1199 per s; 5 s at 720p = $0.4495.
    pricing:
      base_cost_usd: 0.4495
      variable_pricing:
        - { per_second_usd: 0.0899 }
        - { when: { resolution: 1080p }, per_second_usd: 0.1199 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 2500 }
    params:
      # "O1：3~10（O1 仅用首帧且无其他参考时仅支持 5 / 10）" — a first frame alone is refused
      # at any other length. No audio ("O1：original / off": original needs a
      # reference video).
      duration_seconds: { kind: int, min: 3, max: 10, default: 5 }
      resolution: { kind: string, enum_values: [720p, 1080p], default: 720p }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16", "1:1"]
        # "注意：图生视频无 aspect_ratio 参数，画幅由输入图片决定。" — a frame sets the shape (E5).
        # @see https://cloud.tencent.com/document/product/1823/135742 (2026-11-11)
        frames_set_shape: without_references
        default: "16:9"
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video]

  # ── Seedream, resold on TokenHub ─────────────────────────────────────────────
  # The models bytedance/dola-seedream-5-0-* serve on BytePlus, through
  # TokenHub's key and bill: POST /v1/wand/si-image/generation, synchronous, in
  # Ark's image shape (data[].url | b64_json; litegen asks for b64_json).
  # `size` is a tier "可选值：1K、1.5K、2K" ("默认值：2K"; the shape then follows the
  # prompt) or "宽 x 高 … 总像素取值范围：[1280x720（921600）, 2048x2048x1.1025
  # （4624220）] 宽高比取值范围：[1/16, 16]" — "不可混用", so litegen's `resolution`
  # and `size` are not sent together. seedream-image-v5.0-lite is not carried:
  # TokenHub retires it on 2026-11-24.
  # @see https://cloud.tencent.com/document/product/1823/136609 (2026-11-09)
  # @see https://cloud.tencent.com/document/product/1823/130055 (2026-11-09)
  - id: tokenhub/seedream-image-v5.0-pro
    provider: tokenhub
    media_type: image
    display_name: Seedream 5.0 Pro (TokenHub)
    description: ByteDance Seedream 5.0 Pro through Tencent TokenHub — text-to-image and edits from up to 10 images.
    docs_url: https://cloud.tencent.com/document/product/1823/136609
    # "Seedream-Image-v5.0-pro | 文生图、参考生图 | 输出图≤261万像素 | … 30,000 tokens/张 … 0.3 元/
    # 张", ">261万像素 … 0.6 元/张", "输入图片首张免费，第二张起0.02 元/张": $0.045 / $0.0899,
    # + $0.003 per input image from the second. The default 2K (2048² = 4.19 MP)
    # is the > 2.61 MP price, $0.0899; 1K and 1.5K are $0.045.
    pricing:
      base_cost_usd: 0.0899
      variable_pricing:
        - { when: { resolution: 1K }, usd: 0.045 }
        - { when: { resolution: 1.5K }, usd: 0.045 }
        - { when: { size: '*', megapixels: { gt: 2.61 } }, usd: 0.0899 }
        - { when: { size: '*', megapixels: { lte: 2.61 } }, usd: 0.045 }
        - { when: { references: 2 }, add_usd: 0.003 }
        - { when: { references: 3 }, add_usd: 0.006 }
        - { when: { references: 4 }, add_usd: 0.009 }
        - { when: { references: 5 }, add_usd: 0.012 }
        - { when: { references: 6 }, add_usd: 0.015 }
        - { when: { references: 7 }, add_usd: 0.018 }
        - { when: { references: 8 }, add_usd: 0.021 }
        - { when: { references: 9 }, add_usd: 0.024 }
        - { when: { references: 10 }, add_usd: 0.027 }
    capabilities: { text_to_image: true, image_to_image: true }
    # "文本提示词，长度 ≤ 600 字符。"
    prompt: { required: true, max_length: 600 }
    params:
      resolution: { kind: string, enum_values: ["1K", "1.5K", "2K"], default: "2K" }
      size:
        kind: size
        mode: freeform
        min_width: 240
        max_width: 8601
        min_height: 240
        max_height: 8601
        min_pixels: 921600
        max_pixels: 4624220
        max_aspect: 16.0
      # "图像格式 … 可选值：png jpeg"
      output_format: { kind: string, enum_values: [png, jpeg] }
      # "图片透明通道 … transparent … opaque … 模型支持：seedream-image-v5.0-pro seedream-image-v5.0-flash"
      background: { kind: string, enum_values: [transparent, opaque] }
    # "图片 images：seedream-image-v5.0-pro、seedream-image-v5.0-flash 支持最多10 张，
    # seedream-image-v5.0-lite 支持最多14 张， 支持 URL 和 Base64格式。" — sent as data
    # URIs (Lite, with its 14, is not carried).
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 10 }
    # watermark ("true：在图片右下角添加"AI 生成"字样的水印标识") and
    # optimize_prompt_options (standard | fast; Pro only). Not
    # layer_decomposition (it returns several layer images; litegen delivers
    # one) nor response_format (owned).
    extra_allowlist: [watermark, optimize_prompt_options]
    extra_params:
      # From the comment above; optimize_prompt_options (an object) stays untyped.
      watermark: { kind: bool }
    tags: [text-to-image, image-to-image]

  - id: tokenhub/seedream-image-v5.0-flash
    provider: tokenhub
    media_type: image
    display_name: Seedream 5.0 Flash (TokenHub)
    description: ByteDance Seedream 5.0 Flash through Tencent TokenHub — fast text-to-image and edits from up to 10 images.
    docs_url: https://cloud.tencent.com/document/product/1823/136609
    # "Seedream-Image-v5.0-flash | 文生图、参考生图 | 不区分 | 10 元/百万 tokens | 12,000 tokens/张
    # | 0.12 元/张": $0.018 at every size, input images included.
    pricing: { base_cost_usd: 0.018 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 600 }
    params:
      resolution: { kind: string, enum_values: ["1K", "1.5K", "2K"], default: "2K" }
      size:
        kind: size
        mode: freeform
        min_width: 240
        max_width: 8601
        min_height: 240
        max_height: 8601
        min_pixels: 921600
        max_pixels: 4624220
        max_aspect: 16.0
      output_format: { kind: string, enum_values: [png, jpeg] }
      background: { kind: string, enum_values: [transparent, opaque] }
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 10 }
    # "optimize_prompt_options.mode … seedream-image-v5.0-lite、seedream-image-v5.0-flash 当前不支持"
    extra_allowlist: [watermark]
    extra_params:
      # From the comment above.
      watermark: { kind: bool }
    tags: [text-to-image, image-to-image, fast]

  # ── Kling and Vidu images, resold on TokenHub (asynchronous) ─────────────────
  # The models kling/kling-v3 and Vidu's image API serve direct, through
  # TokenHub's key and bill. Each is submit-then-poll: the image adapter
  # records the accepted task (so a timeout is never sent again), polls within
  # litegen's deadline, and downloads the result (late delivery picks it up).
  # Kling: POST /v1/wand/kling-image/generation ({code, data: {task_id}}), GET
  # …/kling-image/tasks/{task_id} ("task_status … submitted（已提交）、processing（处理中）、
  # succeed（成功）、failed（失败）", data.task_result.images[].url); images are raw
  # base64 ("无须添加 data:image/png;base64, 前缀"). One image is asked for (`n: 1`).
  # @see https://cloud.tencent.com/document/product/1823/138803 (2026-11-09)
  # @see https://cloud.tencent.com/document/product/1823/130055 (2026-11-09)
  - id: tokenhub/kling-image-v3
    provider: tokenhub
    media_type: image
    display_name: Kling Image 3.0 (TokenHub)
    description: Kling Image 3.0 through Tencent TokenHub — text-to-image or one reference image, 1K/2K.
    docs_url: https://cloud.tencent.com/document/product/1823/138803
    # "Kling-Image-v3 | 文生图、图生图 | 1K / 2K | 10 元/百万 tokens | 20,000 tokens/张 | 0.2 元/张": $0.03.
    pricing: { base_cost_usd: 0.03 }
    capabilities: { text_to_image: true, image_to_image: true }
    # "正向文本提示词，长度 ≤ 2500 字符"
    prompt: { required: true, max_length: 2500 }
    params:
      # "负向文本提示词 … 仅文生图支持；图生图（image 不为空）场景下不支持" — refused with an image.
      negative_prompt: { kind: string, max_length: 2500 }
      # "可选值：16:9、9:16、1:1、4:3、3:4、3:2、2:3、21:9。默认值 16:9。"
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3", "21:9"]
        default: "16:9"
      # "可选值：1k（1K 标清）、2k（2K 高清）。默认值 1k。"
      resolution: { kind: string, enum_values: ["1K", "2K"], default: "1K" }
    # "image … 参考图片（单图）。传入后即为图生图。"
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    # Not element_list (TokenHub's subject library ids) nor watermark_info's
    # second, watermarked result.
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

  - id: tokenhub/kling-image-o1
    provider: tokenhub
    media_type: image
    display_name: Kling Image O1 (TokenHub)
    description: Kling Image O1 through Tencent TokenHub — text-to-image or up to 10 reference images, 1K/2K.
    docs_url: https://cloud.tencent.com/document/product/1823/138803
    # "Kling-Image-o1 | 文生图、图生图 | 1K / 2K | … 0.2 元/张": $0.03.
    pricing: { base_cost_usd: 0.03 }
    capabilities: { text_to_image: true, image_to_image: true }
    # "可包含正向描述与负向描述，长度 ≤ 2500 字符" (no negative_prompt field); "<<<image_1>>>"
    # names a reference.
    prompt: { required: true, max_length: 2500 }
    params:
      # The listed ratios. "默认值 auto。注：文生图场景（未传 image_list）不支持 auto"
      # (auto is the default, and text-to-image does not take it): with images
      # litegen sends no ratio unless asked, so auto follows them; a text-only
      # request that names none goes as 16:9 (image/tokenhub.rs
      # KLING_OMNI_TEXT_TO_IMAGE_RATIO). No `default` here: the dashboard would
      # send it with images too.
      # @see https://cloud.tencent.com/document/product/1823/138803 (2026-11-09)
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3", "21:9"]
      # "4K 仅 kling-image-v3-omni 支持；kling-image-o1 支持 1K / 2K。"
      resolution: { kind: string, enum_values: ["1K", "2K"], default: "1K" }
    # "image_list … 参考图片列表（多图），最多 10 张"
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 10 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

  - id: tokenhub/kling-image-v3-omni
    provider: tokenhub
    media_type: image
    display_name: Kling Image 3.0 Omni (TokenHub)
