        - { when: { resolution: 4K }, usd: 0.0468 }
        - { when: { references: { gte: 1, lte: 3 } }, usd: 0.0375 }
        - { when: { references: { gte: 1, lte: 3 }, resolution: 2K }, usd: 0.0562 }
        - { when: { references: { gte: 1, lte: 3 }, resolution: 4K }, usd: 0.0937 }
