  - id: tokenhub/minimax-video-h3
    provider: tokenhub
    media_type: video
    display_name: MiniMax H3 (TokenHub)
    description: MiniMax H3 through Tencent TokenHub — text, first/last frames or up to 9 reference images; 4–15 s at 768P or 2K.
    docs_url: https://cloud.tencent.com/document/product/1823/135737
    # "MiniMax-Video-H3 | … | 768P | … 输出视频0.5元/秒 输入图片前5张免费第六张起0.2元/张", 2K 0.8:
    # $0.0749 / $0.1199 per s, + $0.03 per image from the 6th; 5 s at 768P = $0.3745.
    pricing:
      base_cost_usd: 0.3745
      variable_pricing:
        - { per_second_usd: 0.0749 }
        - { when: { resolution: 2K }, per_second_usd: 0.1199 }
        - { when: { references: 6 }, add_usd: 0.03 }
        - { when: { references: 7 }, add_usd: 0.06 }
        - { when: { references: 8 }, add_usd: 0.09 }
        - { when: { references: 9 }, add_usd: 0.12 }
    capabilities: { text_to_video: true, image_to_video: true }
    # "text 必须非空，最多 7000 个字符"
    prompt: { required: true, max_length: 7000 }
    params:
      # "h3：4 ~ 15 的整数" (required: litegen always sends one)
      duration_seconds: { kind: int, min: 4, max: 15, default: 5 }
      # "h3：768P / 2K" (required; 768P when none is asked)
      resolution: { kind: string, enum_values: [768P, 2K], default: 768P }
      # "ratio … 文生视频必填且不能为 adaptive … 可选：21:9 / 16:9 / 4:3 / 1:1 / 3:4 / 9:16" —
      # sent on text-to-video (16:9 when none is asked); frames follow the image.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
        default: "16:9"
        # "图生视频恒为 adaptive（宽高比由输入图片决定）；显式传入 … 不会报错，但会被忽略并按
        # adaptive 处理。" Frames and references "互斥" (E5).
        # @see https://cloud.tencent.com/document/product/1823/135737 (2026-11-11)
        frames_set_shape: without_references
    # "首帧 ≤ 1 张、尾帧 ≤ 1 张"; references "参考图 ≤ 9 张" (role reference_image). Data URIs.
    ref_inputs:
      max_total: 9
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 9 }
    extra_allowlist: [aigc_watermark]
    extra_params:
      # From a switch (video/tokenhub.rs tests send it as a boolean).
      aigc_watermark: { kind: bool }
    tags: [text-to-video, image-to-video, reference-to-video]

