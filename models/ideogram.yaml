  # ─── Edits (PixelGenie 3D doc §4) ──────────────────────────────────────────
  # @see https://developer.ideogram.ai/v2/api-reference/images/precise-edit/ideogram-4-5.md
  #   (2026-10-30): "POST https://api.ideogram.ai/v2/image/precise-edit/ideogram-4-5
  #   / Content-Type: multipart/form-data"; image (required; "pixels the edit
  #   did not meaningfully change are copied exactly from it"), mask ("Black
  #   marks the area to edit and white the area to keep"), context_window
  #   (`y_min,x_min,y_max,x_max`, ends exclusive; "measure at least 256px on
  #   each side … have an aspect ratio between 1:6 and 6:1"), quality
  #   (very_low | low | medium | high, default medium), seed (0–2147483647).
  # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json
  - id: ideogram/ideogram-4-5-precise-edit
    provider: ideogram
    media_type: image
    display_name: Ideogram 4.5 Precise Edit
    description: >-
      Edits part of an image, keeping its size: a region becomes Ideogram's
      own box (`context_window`, at least 256 px a side within 1:6–6:1 —
      litegen enlarges a smaller one and sends the exact area as the mask),
      and a mask goes in Ideogram's black-edits convention. Pixels the edit
      did not meaningfully change come back exactly.
    docs_url: https://developer.ideogram.ai/v2/api-reference/images/precise-edit/ideogram-4-5
    # Ideogram's price catalog (US$ micros): "Ideogram 4.5 Precise Edit Very
    # Low 1K" 8000 ($0.008), "… Low 1K" 30000 ($0.03), "… Medium 1K" 60000
    # ($0.06), "… High 1K" 220000 ($0.22); each 2K label costs the same. The
    # v2 spec on `quality`: "This is the only field that affects the price".
    # Default medium → $0.06.
    # @see https://ideogram.ai/api/usage-pricing/catalog (2026-11-09)
    # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-09)
    pricing:
      base_cost_usd: 0.06
      variable_pricing:
        - { when: { quality: very_low }, usd: 0.008 }
        - { when: { quality: low }, usd: 0.03 }
        - { when: { quality: high }, usd: 0.22 }
    capabilities: { text_to_image: false, image_to_image: true, inpainting: true }
    prompt: { required: true, max_length: 10000 }
    preserves_unmasked: exact
    params:
      quality:
        kind: string
        enum_values: [very_low, low, medium, high]
        default: medium
        label: Quality
        description: The only setting that changes Ideogram's price.
      seed: { kind: seed, min: 0, max: 2147483647 }
      region:
        kind: region
        input: box
        min_window_px: 256
        max_aspect: 6.0
        label: Region
        description: The rectangle to edit, as Ideogram's context_window.
    # "`reference_images` … Optional images to guide the edit (max 4 …). They
    # are never edited themselves … A request with a `mask` can include at
    # most three, because the mask takes up one reference slot": the image
    # plus 4 shared slots is 5 in all; the adapter refuses 4 references beside
    # a mask it drew from a region.
    # @see https://developer.ideogram.ai/v2/api-reference/images/precise-edit/ideogram-4-5.md (2026-11-03)
    ref_inputs:
      max_total: 5
      default_role: init
      provider_format: { form: multipart, field_map: { init: image, mask: mask, reference: reference_images } }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1, convention: black_edits }
        reference: { required: false, min_count: 0, max_count: 4 }
    extra_allowlist: []
    tags: [image-to-image, inpainting, region-edit]

  # Ideogram 4.5 (v2 only): POST /v2/image/generate/ideogram-4-5, multipart:
  # prompt, magic_prompt (auto | on | off), images ("Optional source images to
  # edit (max 5 …). The first image is the one being edited; any others are
  # extra references"), mask (black edits; "A masked request can include at
  # most three other source images … With a mask, the output is always the
  # first source image's own size, so `size` cannot be set" — the adapter
  # refuses both), size, background (transparent | opaque | auto), quality
  # ("Defaults to `medium` with source images and `high` without. `very_low`
  # … requires source images" — refused without one), seed, num_images
  # (litegen asks for one), enable_copyright_detection, async (litegen waits)
  # and webhook_url (litegen fires its own).
  # @see https://developer.ideogram.ai/v2/api-reference/images/generate/ideogram-4-5.md (2026-11-03)
  # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-03)
  - id: ideogram/ideogram-4-5
    provider: ideogram
    media_type: image
    display_name: Ideogram 4.5
    description: Ideogram 4.5 — text-to-image and editing with up to five source images and an optional mask.
    docs_url: https://developer.ideogram.ai/v2/api-reference/images/generate/ideogram-4-5
    # Ideogram's price catalog (US$ micros): "Ideogram 4.5 Generate Low 1K"
    # 30000 ($0.03), Medium 60000 ($0.06), High 100000 ($0.10); "Generate has
    # its own rates when the request includes source images": "Ideogram 4.5
    # Generate Very Low 1K with source images" 8000 ($0.008), Low 30000
    # ($0.03), Medium 60000 ($0.06), High 220000 ($0.22) — each 2K label costs
    # the same. The default request is text-to-image at high, $0.10; with
    # source images the default is medium, $0.06 (the first rule).
    # @see https://ideogram.ai/api/usage-pricing/catalog (2026-11-09)
    pricing:
      base_cost_usd: 0.10
      variable_pricing:
        - { when: { references: '*' }, usd: 0.06 }
        - { when: { quality: low }, usd: 0.03 }
        - { when: { quality: medium }, usd: 0.06 }
        - { when: { quality: high }, usd: 0.10 }
        - { when: { quality: high, references: '*' }, usd: 0.22 }
        - { when: { quality: very_low }, usd: 0.008 }
    capabilities: { text_to_image: true, image_to_image: true, inpainting: true }
    # `prompt`: "minLength: 1", "maxLength: 10000".
    # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (/v2/image/generate/ideogram-4-5, 2026-11-09)
    prompt: { required: true, max_length: 10000 }
    params:
      # No default: Ideogram's differs by mode (high without images, medium
      # with them), and the price follows the one it applies.
      quality:
        kind: string
        enum_values: [very_low, low, medium, high]
        label: Quality
        description: Rendering quality, the setting that changes Ideogram's price; very_low needs a source image.
      background: { kind: string, enum_values: [transparent, opaque] }
      seed: { kind: seed, min: 0, max: 2147483647 }
      # A region is drawn as the mask (black edits), as on every mask-taking row.
      region: { kind: region, input: mask, label: Region, description: "The rectangle to edit, sent drawn as the mask." }
      # "Without source images, an exact size must be one of the supported
      # 1K/2K presets" (the ResolutionV4 enum, "The 1K and 2K resolutions
      # supported for Ideogram 4.0"); with them "both sides a multiple of 32
      # and at least 256px, a total of at most 2048x2048 pixels, and an aspect
      # ratio of at most 6:1" — the presets that hold in both modes (all but
      # 1296x3168, 3168x1296, 720x1280, 1280x720, 720x1440, 1440x720).
      size:
        kind: size
        mode: enum
        values: [[2048,2048],[1440,2880],[2880,1440],[1664,2496],[2496,1664],[1792,2240],[2240,1792],[1440,2560],[2560,1440],[1600,2560],[2560,1600],[1728,2304],[2304,1728],[1152,2944],[2944,1152],[1248,3328],[3328,1248],[1280,3072],[3072,1280],[1024,3072],[3072,1024],[1024,1024],[896,1120],[1120,896],[864,1152],[1152,864],[832,1248],[1248,832],[800,1280],[1280,800],[512,1536],[1536,512]]
    ref_inputs:
      max_total: 6
      default_role: init
      provider_format: { form: multipart, field_map: { init: images, reference: images, mask: mask } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 4 }
        mask: { required: false, min_count: 0, max_count: 1, convention: black_edits }
    extra_allowlist: [magic_prompt, enable_copyright_detection]
    extra_params:
      # From Ideogram's OpenAPI (drift snapshot ideogram/openapi-v2.txt); magic_prompt's values are unstated.
      magic_prompt: { kind: string }
      enable_copyright_detection: { kind: bool }
    tags: [text-to-image, image-to-image, inpainting]

  # ── Models Ideogram resells on v2 ───────────────────────────────────────────
  # Carried as Ideogram routes beside google/* (the user, 2026-11-04: "like how
  # litellm can still use openrouter"): POST /v2/image/generate/{model}
  # (multipart, synchronous by default), answered in the same `data[]` shape as
  # Ideogram 4.5. Fields: prompt ("passed to the model as written"), images
  # ("max 10, max 25MB each; JPEG, PNG, or WEBP"; the edited one first),
  # aspect_ratio, resolution_tier, seed, num_images (litegen sends 1). Not async
  # or webhook_url.
  # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-03)
  # @see https://ideogram.ai/api/usage-pricing/catalog (2026-11-09)
  - id: ideogram/nano-banana-2
    provider: ideogram
    media_type: image
    display_name: Nano Banana 2 (Ideogram)
    description: Google's Nano Banana 2 (Gemini) through Ideogram — text-to-image and edits from up to 10 images, 1K to 4K.
    docs_url: https://developer.ideogram.ai/v2/api-reference/images/generate/nano-banana-2
    # Ideogram's price catalog (US$ micros): "Nano Banana 2 Generate 1K" 67200
    # ($0.0672), "… 2K" 100800 ($0.1008), "… 4K" 151200 ($0.1512).
    pricing:
      base_cost_usd: 0.0672
      variable_pricing:
        - { when: { resolution: 2K }, usd: 0.1008 }
        - { when: { resolution: 4K }, usd: 0.1512 }
    capabilities: { text_to_image: true, image_to_image: true }
    # Ideogram's own limit is `prompt` "maxLength: 10000"
    # (https://developer.ideogram.ai/openapi/ideogram-api-v2.json, 2026-11-09);
    # Gemini's 8000 characters (google/* rows) is the stricter.
    prompt: { required: true, max_length: 8000 }
    params:
      # "Output aspect ratios Nano Banana 2 serves" (unset is "auto": the model chooses).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:1", "3:2", "2:3", "4:3", "3:4", "5:4", "4:5", "16:9", "9:16", "21:9", "4:1", "1:4", "8:1", "1:8"]
      # resolution_tier "1K","2K","4K" (1K when none is asked).
      resolution: { kind: string, enum_values: ["1K", "2K", "4K"], default: "1K" }
      seed: { kind: seed, min: 0, max: 2147483647 }
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: multipart, field_map: { init: images, reference: images } }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 9 }
    extra_allowlist: []
    tags: [text-to-image, image-to-image]

  - id: ideogram/nano-banana-pro
