      duration_seconds: { kind: int, min: 4, max: 30, default: 5 }
      audio: { kind: bool, default: false }
      resolution: { kind: string, enum_values: [480p, 720p, 1080p], default: 720p }
      # aspect_ratio on text and reference to video (default "auto", sent only
      # when asked); image-to-video has none (the frame sets it).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
        # seedance-2-5-image-to-video's form: duration, end_image,
        # generate_audio, image, prompt, resolution, webhook_url — no
        # aspect_ratio, so a frame sets the shape (E5).
        # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-11)
        frames_set_shape: without_references
    ref_inputs:
      max_total: 9
      default_role: first_frame
      provider_format: { form: multipart, field_map: { first_frame: image, last_frame: end_image, reference: reference_images } }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 9 }
    extra_allowlist: []
    tags: [text-to-video, image-to-video, reference-to-video]
