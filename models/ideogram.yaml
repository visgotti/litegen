models:
  # Ideogram 3.0 (api.ideogram.ai). Sync. Auth: Api-Key header.
  # aspect_ratio is sent as "WxH" by the provider; refs are multipart files.
  - id: ideogram/ideogram-v3
    provider: ideogram
    media_type: image
    display_name: Ideogram 3.0
    description: Ideogram 3.0 text-to-image with style/character reference images.
    docs_url: https://developer.ideogram.ai/v1/api-reference/generate-images/generate-v3
    # Ideogram's price catalog (US$ micros): "Ideogram 3.0 Default" 60000 ($0.06),
    # "Ideogram 3.0 Default with Character Reference" 150000 ($0.15). The v3
    # page: "Generations with character reference are subject to the character
    # reference pricing"; a style reference keeps the model's rate.
    # @see https://ideogram.ai/api/usage-pricing/catalog (2026-11-09)
    # @see https://developer.ideogram.ai/v1/api-reference/generate-images/generate-v3.md (2026-11-09)
    pricing:
      base_cost_usd: 0.06
      variable_pricing:
        - { when: { references.character: '*' }, usd: 0.15 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      negative_prompt: { kind: string, max_length: 10000 }
      seed: { kind: seed, min: 0, max: 2147483647 }
      aspect_ratio:
        kind: aspect_ratio
        # AspectRatioV3 enum (1x2/2x1 included): https://developer.ideogram.ai/openapi/ideogram-api-v1.json
        allowed: ["1:1","16:9","9:16","3:2","2:3","4:3","3:4","4:5","5:4","16:10","10:16","3:1","1:3","2:1","1:2"]
        default: "1:1"
      style:
        kind: string
        enum_values: [AUTO, GENERAL, REALISTIC, DESIGN, FICTION]
      # "resolution … The resolutions supported for Ideogram 3.0" (ResolutionV3),
      # sent as `resolution`; "aspect_ratio … Cannot be combined with
      # resolution", so an exact size wins and no ratio goes beside it.
      # @see https://developer.ideogram.ai/openapi/ideogram-api-v1.json (2026-11-03)
      size:
        kind: size
        mode: enum
        values: [
          [512,1536],[576,1408],[576,1472],[576,1536],[640,1344],[640,1408],[640,1472],[640,1536],
          [704,1152],[704,1216],[704,1280],[704,1344],[704,1408],[704,1472],[736,1312],[768,1088],
          [768,1216],[768,1280],[768,1344],[800,1280],[832,960],[832,1024],[832,1088],[832,1152],
          [832,1216],[832,1248],[864,1152],[896,960],[896,1024],[896,1088],[896,1120],[896,1152],
          [960,832],[960,896],[960,1024],[960,1088],[1024,832],[1024,896],[1024,960],[1024,1024],
          [1088,768],[1088,832],[1088,896],[1088,960],[1120,896],[1152,704],[1152,832],[1152,864],
          [1152,896],[1216,704],[1216,768],[1216,832],[1248,832],[1280,704],[1280,768],[1280,800],
          [1312,736],[1344,640],[1344,704],[1344,768],[1408,576],[1408,640],[1408,704],[1472,576],
          [1472,640],[1472,704],[1536,512],[1536,576],[1536,640]
        ]
    ref_inputs:
      max_total: 3
      default_role: style
      provider_format:
        form: multipart
        field_map:
          style: style_reference_images
          character: character_reference_images
      roles:
        style:     { required: false, min_count: 0, max_count: 3 }
        character: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [magic_prompt, style_codes, style_preset, color_palette]
    extra_params:
      # From Ideogram's OpenAPI (drift snapshot ideogram/openapi.txt, POST /v1/ideogram-v3/generate); color_palette (an object) stays untyped.
      magic_prompt: { kind: string, enum_values: ["AUTO", "ON", "OFF"] }
      style_codes: { kind: string_array }
      style_preset: { kind: string, enum_values: ["80S_ILLUSTRATION", "90S_NOSTALGIA", "ABSTRACT_ORGANIC", "ANALOG_NOSTALGIA", "ART_BRUT", "ART_DECO", "ART_POSTER", "AURA", "AVANT_GARDE", "BAUHAUS", "BLUEPRINT", "BLURRY_MOTION", "BRIGHT_ART", "C4D_CARTOON", "CHILDRENS_BOOK", "COLLAGE", "COLORING_BOOK_I", "COLORING_BOOK_II", "CUBISM", "DARK_AURA", "DOODLE", "DOUBLE_EXPOSURE", "DRAMATIC_CINEMA", "EDITORIAL", "EMOTIONAL_MINIMAL", "ETHEREAL_PARTY", "EXPIRED_FILM", "FLAT_ART", "FLAT_VECTOR", "FOREST_REVERIE", "GEO_MINIMALIST", "GLASS_PRISM", "GOLDEN_HOUR", "GRAFFITI_I", "GRAFFITI_II", "HALFTONE_PRINT", "HIGH_CONTRAST", "HIPPIE_ERA", "ICONIC", "JAPANDI_FUSION", "JAZZY", "LONG_EXPOSURE", "MAGAZINE_EDITORIAL", "MINIMAL_ILLUSTRATION", "MIXED_MEDIA", "MONOCHROME", "NIGHTLIFE", "OIL_PAINTING", "OLD_CARTOONS", "PAINT_GESTURE", "POP_ART", "RETRO_ETCHING", "RIVIERA_POP", "SPOTLIGHT_80S", "STYLIZED_RED", "SURREAL_COLLAGE", "TRAVEL_POSTER", "VINTAGE_GEO", "VINTAGE_POSTER", "WATERCOLOR", "WEIRD", "WOODBLOCK_PRINT"] }
    tags: [text-to-image, image-to-image]

