  # Ideogram 4.0 (api.ideogram.ai). Sync. Auth: Api-Key header. The adapter
  # POSTs these three ids to /v1/ideogram-v4/generate as multipart/form-data
  # (the only request content type the spec declares) and varies only
  # `rendering_speed` (omitted = DEFAULT / TURBO / QUALITY), like the 3.0 rows.
  # FLASH is in the RenderingSpeed enum but "coming soon" on 4.0: "requests
  # with rendering_speed=FLASH currently return a 400", so no FLASH row.
  # The request takes `text_prompt` (or a structured `json_prompt`), `resolution`,
  # `rendering_speed` and `enable_copyright_detection` — no aspect_ratio, seed,
  # negative prompt, num_images, style or reference images. No prompt length
  # limit is documented.
  # @see https://developer.ideogram.ai/openapi.json (POST /v1/ideogram-v4/generate), read 2026-09-11
  # @see https://developer.ideogram.ai/api-reference/generate-images/generate-v4.md
  - id: ideogram/ideogram-v4
    provider: ideogram
    media_type: image
    display_name: Ideogram 4.0
    description: Ideogram 4.0 text-to-image, Ideogram's flagship for prompt fidelity and text rendering.
    # "4.0 Default": US $0.06 (1K and 2K alike), read 2026-09-11.
    # @see https://ideogram.ai/pricing/?pricing_tab=api
    pricing: { base_cost_usd: 0.06 }
    capabilities: { text_to_image: true }
    prompt: { required: true }
    params:
      size:
        kind: size
        mode: enum
        # ResolutionV4 enum ("The 1K and 2K resolutions supported for Ideogram 4.0"),
        # sent as `resolution` = "WxH": https://developer.ideogram.ai/openapi.json
        values: [[2048,2048],[1440,2880],[2880,1440],[1664,2496],[2496,1664],[1792,2240],[2240,1792],[1440,2560],[2560,1440],[1600,2560],[2560,1600],[1728,2304],[2304,1728],[1296,3168],[3168,1296],[1152,2944],[2944,1152],[1248,3328],[3328,1248],[1280,3072],[3072,1280],[1024,3072],[3072,1024],[1024,1024],[896,1120],[1120,896],[864,1152],[1152,864],[832,1248],[1248,832],[800,1280],[1280,800],[720,1280],[1280,720],[720,1440],[1440,720],[512,1536],[1536,512]]
    extra_allowlist: [enable_copyright_detection]
    tags: [text-to-image]

  - id: ideogram/ideogram-v4-turbo
