  # P-Image on Ideogram v2 (`POST /v2/image/generate/p-image-ideogram`, JSON),
  # Ideogram's budget tier: prompt (maxLength 10000), quality (very_low, low,
  # medium, high, very_high; "Defaults to `medium`"), resolution "1k" | "2k"
  # ("Defaults to `1k`"; litegen's 1K | 2K), aspect_ratio (15, as "16x9"),
  # seed, magic_prompt, enable_copyright_detection; text to image only. The
  # adapter always sends a quality, so the bill is deterministic.
  # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-04)
  - id: ideogram/p-image-ideogram
    provider: ideogram
    media_type: image
    display_name: P-Image Ideogram
    description: Ideogram's fast, low-cost P-Image text-to-image, priced by quality and resolution.
    docs_url: https://developer.ideogram.ai/v2/api-reference/images/generate/p-image-ideogram
    # Ideogram's price catalog (US$ micros), group "P-Image Ideogram" ("Fast,
    # low-cost generation priced by quality and resolution"): "P-Image Ideogram
    # Very Low 1K" 3000 ($0.003), Very Low 2K 6000, Low 1K 7500, Low 2K 15000,
    # Medium 1K 10000, Medium 2K 20000, High 1K 15000, High 2K 30000, Very High
    # 1K 33000, Very High 2K 66000. The default (medium, 1K) is $0.01.
    # @see https://ideogram.ai/api/usage-pricing/catalog (2026-11-09)
    pricing:
      base_cost_usd: 0.01
      variable_pricing:
        - { when: { quality: very_low }, usd: 0.003 }
        - { when: { quality: very_low, resolution: 2K }, usd: 0.006 }
        - { when: { quality: low }, usd: 0.0075 }
        - { when: { quality: low, resolution: 2K }, usd: 0.015 }
        - { when: { quality: medium, resolution: 2K }, usd: 0.02 }
        - { when: { quality: high }, usd: 0.015 }
        - { when: { quality: high, resolution: 2K }, usd: 0.03 }
        - { when: { quality: very_high }, usd: 0.033 }
        - { when: { quality: very_high, resolution: 2K }, usd: 0.066 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 10000 }
    params:
      quality: { kind: string, enum_values: [very_low, low, medium, high, very_high], default: medium }
      resolution: { kind: string, enum_values: ["1K", "2K"], default: "1K" }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["1:3", "3:1", "1:2", "2:1", "9:16", "16:9", "10:16", "16:10", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "1:1"]
      seed: { kind: seed, min: 0, max: 2147483647 }
    # magic_prompt (auto | on | off), enable_copyright_detection.
    extra_allowlist: [magic_prompt, enable_copyright_detection]
    extra_params:
      # From the comment above.
      magic_prompt: { kind: string, enum_values: ["auto", "on", "off"] }
      enable_copyright_detection: { kind: bool }
    tags: [text-to-image, fast]

  # ─── Video, resold on v2 ─────────────────────────────────────────────────
  # The video models Ideogram resells, carried as Ideogram routes (the hub-
  # route policy, 2026-11-04), through video/ideogram.rs. Each has
  # `POST /v2/video/generate/{model}-text-to-video` (JSON), `…-image-to-video`
  # ("Upload the first frame as `image`, and optionally a final frame as
  # `end_image`, using `multipart/form-data`") and, but Kling, `…-reference-
  # to-video` (`reference_images`, multipart). Each answers {generation_id,
  # created}; `GET /v2/generations/{generation_id}` says pending | completed |
  # failed, and a completed one's data[] holds a `video.generation` with "The
  # direct link to the generated video". Frames and references go to
  # different endpoints, so they aren't mixed; `reference_audios` and
  # `webhook_url` are not sent. Prices: "Billed per second of output at the
  # provider's list rate" (US$ micros in the catalog). Not carried: Kling 4.0
  # (priced at /v2/video/generate/kling-4, but in neither the spec nor the
  # docs) and the Seedance 2.0 video edit (no endpoint documented).
  # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-10)
  # @see https://ideogram.ai/api/usage-pricing/catalog (2026-11-10)
  - id: ideogram/kling-3-standard
    provider: ideogram
    media_type: video
    display_name: Kling 3.0 Standard (Ideogram)
    description: Kling's 3.0 Standard through Ideogram — text-to-video or first/last-frame image-to-video, 3–15 s at 1080p, with optional audio.
    docs_url: https://developer.ideogram.ai/v2/api-reference/video/generate/kling-3-standard-text-to-video
    # "Kling 3.0 Standard … Audio costs 1.5 times the silent rate": "1080p |
    # silent 84000 | audio 126000" US$ micros a second. The default request
    # (5 s, silent) is 5 × $0.084 = $0.42.
    pricing:
      base_cost_usd: 0.42
      variable_pricing:
        - { per_second_usd: 0.084 }
        - { when: { audio: true }, per_second_usd: 0.126 }
    capabilities: { text_to_video: true, image_to_video: true }
    # prompt "minLength: 1, maxLength: 2000" (both endpoints).
    prompt: { required: true, max_length: 2000 }
    params:
      # duration "minimum: 3, maximum: 15"; "Defaults to 5 seconds when omitted".
      duration_seconds: { kind: int, min: 3, max: 15, default: 5 }
      # generate_audio "default: false".
      audio: { kind: bool, default: false }
      negative_prompt: { kind: string, max_length: 2000 }
      # Text-to-video's aspect_ratio "16x9" | "9x16" | "1x1" (default 16x9),
      # sent as Ideogram spells it; image-to-video has none (the frame sets it).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["16:9", "9:16", "1:1"]
        default: "16:9"
        # kling-3-standard-image-to-video's form: cfg_scale, duration, end_image,
        # generate_audio, image, negative_prompt, prompt, shot_type, webhook_url —
        # no aspect_ratio, so a frame sets the shape (E5).
        # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-11)
        frames_set_shape: without_references
    ref_inputs:
      max_total: 2
      default_role: first_frame
      provider_format: { form: multipart, field_map: { first_frame: image, last_frame: end_image } }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
    # shot_type "customize" | "intelligent"; cfg_scale "from 0 to 1" (a string).
    extra_allowlist: [shot_type, cfg_scale]
    extra_params:
      # From the comment above (cfg_scale is a string).
      shot_type: { kind: string, enum_values: ["customize", "intelligent"] }
      cfg_scale: { kind: string }
    tags: [text-to-video, image-to-video]

  - id: ideogram/minimax-h3
    provider: ideogram
    media_type: video
    display_name: MiniMax H3 (Ideogram)
    description: MiniMax's Hailuo 3 (H3) through Ideogram — text-to-video, first/last-frame image-to-video, or up to 9 reference images; 5–15 s, 480P to 4K, with audio.
    docs_url: https://developer.ideogram.ai/v2/api-reference/video/generate/minimax-h3-text-to-video
    # "MiniMax Hailuo 3": "480P | 50000", "768P | 80000", "2K | 130000", "4K
    # | 160000" US$ micros a second; reference to video: "The first five
    # reference images are free; each one after that adds US $0.04". The
    # default request (2K, 5 s) is 5 × $0.13 = $0.65.
    pricing:
      base_cost_usd: 0.65
      variable_pricing:
        - { per_second_usd: 0.13 }
        - { when: { resolution: 480P }, per_second_usd: 0.05 }
        - { when: { resolution: 768P }, per_second_usd: 0.08 }
        - { when: { resolution: 4K }, per_second_usd: 0.16 }
        - { when: { references: 6 }, add_usd: 0.04 }
        - { when: { references: 7 }, add_usd: 0.08 }
        - { when: { references: 8 }, add_usd: 0.12 }
        - { when: { references: 9 }, add_usd: 0.16 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 2000 }
    params:
      # duration "minimum: 5, maximum: 15, default: 5".
      duration_seconds: { kind: int, min: 5, max: 15, default: 5 }
      # resolution "480P" | "768P" | "2K" | "4K", "default: 2K", every mode
      # ("`480P` and `768P` are generated natively; `2K` and `4K` are upscaled").
      resolution: { kind: string, enum_values: [480P, 768P, 2K, 4K], default: 2K }
      # aspect_ratio on text and reference to video ("21x9" … "9x16", default
      # 16x9); image-to-video has none (the frame sets it).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
        default: "16:9"
        # minimax-h3-image-to-video's form: duration, end_image, image, prompt,
        # resolution, webhook_url — no aspect_ratio, so a frame sets the shape
        # (E5); frames and references go to different endpoints.
        # @see https://developer.ideogram.ai/openapi/ideogram-api-v2.json (2026-11-11)
        frames_set_shape: without_references
    # reference_images: no stated maximum; 9, MiniMax's own cap (minimax/MiniMax-H3).
    ref_inputs:
      max_total: 9
      default_role: first_frame
      provider_format: { form: multipart, field_map: { first_frame: image, last_frame: end_image, reference: reference_images } }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
        last_frame: { required: false, min_count: 0, max_count: 1 }
        reference: { required: false, min_count: 0, max_count: 9 }
    # prompt_expansion_mode "disabled" | "fast" | "balanced" | "quality": on
    # reference to video only (refused on the other two).
    extra_allowlist: [prompt_expansion_mode]
    extra_params:
      # From the comment above.
      prompt_expansion_mode: { kind: string, enum_values: ["disabled", "fast", "balanced", "quality"] }
    tags: [text-to-video, image-to-video, reference-to-video]

  - id: ideogram/seedance-2
    provider: ideogram
    media_type: video
    display_name: Seedance 2.0 (Ideogram)
