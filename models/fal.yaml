    params:
      # PixelGenie L9: output_format jpeg | png, default jpeg.
      output_format: { kind: string, enum_values: [png, jpeg], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # guidance_scale 1-20, default 3.5 (https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux/dev, 2026-10-30)
      guidance_scale: { kind: float, min: 1.0, max: 20.0, default: 3.5 }
      steps: { kind: int, min: 1, max: 50, default: 28 }
      size:
        kind: size
        mode: freeform
        min_width: 512
        max_width: 2048
        min_height: 512
        max_height: 2048
        multiple_of: 8
    extra_allowlist: []
    tags: [text-to-image]

  # fal-ai/flux-2 is FLUX.2 [dev] text-to-image (BFL hosts no [dev] API).
  # Input: prompt, guidance_scale 0-20 (default 2.5), seed, num_inference_steps
  # 4-50 (default 28), image_size (width and height 512-2048), num_images,
  # acceleration, enable_prompt_expansion, sync_mode, enable_safety_checker,
  # output_format. With images the adapter calls the /edit twin, fal-ai/flux-2/edit
  # (`image_urls`: "A maximum of 4 images are allowed"), since 2026-11-04.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-2 (re-read 2026-09-11)
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-2/edit (2026-11-04)
  - id: fal/flux-2
    provider: fal
    media_type: image
    display_name: FLUX.2 [dev] (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-2/api
    description: Black Forest Labs FLUX.2 dev on Fal — text-to-image, or edits from up to 4 images.
    # "$0.012 per megapixels": $0.012 for the default 1 MP request, then by
    # the asked size's megapixels (re-read 2026-09-11). Edits: "$0.012 per
    # megapixel of input and output. Input images will be resized to 1MP".
    # @see https://fal.ai/models/fal-ai/flux-2/llms.txt
    # @see https://fal.ai/models/fal-ai/flux-2/edit/llms.txt (2026-11-04)
    pricing:
      base_cost_usd: 0.012
      variable_pricing:
        - { per_megapixel_usd: 0.012 }
        - { when: { references: 1 }, add_usd: 0.012 }
        - { when: { references: 2 }, add_usd: 0.024 }
        - { when: { references: 3 }, add_usd: 0.036 }
        - { when: { references: 4 }, add_usd: 0.048 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format jpeg | png | webp, default png.
      output_format: { kind: string, enum_values: [png, webp, jpeg], default: png }
      seed: { kind: seed, min: 0, max: 4294967294 }
      guidance_scale: { kind: float, min: 0.0, max: 20.0, default: 2.5 }
      steps: { kind: int, min: 4, max: 50, default: 28 }
      # "The width and height must be between 512 and 2048 pixels."
      size:
        kind: size
        mode: freeform
        min_width: 512
        max_width: 2048
        min_height: 512
        max_height: 2048
    ref_inputs:
      max_total: 4
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 4 }
    # acceleration none|regular|high; output_format jpeg|png|webp. Not
    # sync_mode: it returns a data URI instead of the URL the adapter fetches.
    extra_allowlist: [acceleration, enable_prompt_expansion]
    extra_params:
      # From fal's OpenAPI (drift snapshot fal/carried-image.txt, fal-ai/flux-2).
      acceleration: { kind: string, enum_values: ["none", "regular", "high"], default: "regular" }
      enable_prompt_expansion: { kind: bool }
    tags: [text-to-image, image-to-image]

  # FLUX.2 [dev] turbo and flash on fal: faster distillations of FLUX.2 [dev],
