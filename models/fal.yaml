    docs_url: https://fal.ai/models/blackforestlabs/flux-3/text-to-video/api
    description: Black Forest Labs FLUX 3 video with native audio on fal — from text, a first frame, first and last frames, or up to 10 keyframes; 5 to 20 s, 720p to 4K.
    # Text- and image-to-video: "$0.17 per second of generated video at 720p,
    # $0.29 per second at 1080p, $0.32 per second at 2K (1440p), and $0.47 per
    # second at 4K (2160p)". The first-last and keyframe endpoints price "$0.17
    # per second … at 720p, and $0.29 per second at 1080p" only, so the adapter
    # refuses 1440p and 2160p there. The default request (5 s, 720p) is 5 ×
    # $0.17 = $0.85.
