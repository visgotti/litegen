  # png | webp (default png), enable_prompt_expansion; no num_inference_steps.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-2/turbo (2026-11-04)
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-2/flash/edit (2026-11-04)
  - id: fal/flux-2-turbo
    provider: fal
    media_type: image
    display_name: FLUX.2 [dev] Turbo (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-2/turbo/api
    description: FLUX.2 dev turbo on Fal — fast text-to-image, or edits from up to 4 images.
    # "$0.008 per megapixels"; edits "$0.008 per megapixel of input and
    # output. Input images will be resized to 1MP".
    # @see https://fal.ai/models/fal-ai/flux-2/turbo/llms.txt (2026-11-04)
    # @see https://fal.ai/models/fal-ai/flux-2/turbo/edit/llms.txt (2026-11-04)
    pricing:
      base_cost_usd: 0.008
      variable_pricing:
        - { per_megapixel_usd: 0.008 }
        - { when: { references: 1 }, add_usd: 0.008 }
        - { when: { references: 2 }, add_usd: 0.016 }
        - { when: { references: 3 }, add_usd: 0.024 }
        - { when: { references: 4 }, add_usd: 0.032 }
    capabilities: { text_to_image: true, image_to_image: true }
