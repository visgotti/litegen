      resolution:
        kind: string
        enum_values: [720p, 1080p, 1440p, 2160p]
        default: 720p
      # Left out, fal uses `auto`.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "2:1", "16:9", "4:3", "1:1", "3:4", "9:16"]
    ref_inputs:
      max_total: 10
