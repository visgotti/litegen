    # @see https://fal.ai/models/blackforestlabs/flux-3/first-last-frame-to-video/llms.txt (2026-11-04)
    # @see https://fal.ai/models/blackforestlabs/flux-3/keyframes-to-video/llms.txt (2026-11-04)
    pricing:
      base_cost_usd: 0.85
      variable_pricing:
        - { per_second_usd: 0.17 }
        - { when: { resolution: 1080p }, per_second_usd: 0.29 }
        - { when: { resolution: 1440p }, per_second_usd: 0.32 }
        - { when: { resolution: 2160p }, per_second_usd: 0.47 }
