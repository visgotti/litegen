  # ─── 3D (mesh) ──────────────────────────────────────────────────────────────
  #
  # Every field below was read from that endpoint's own OpenAPI document,
  # https://fal.ai/api/openapi/queue/openapi.json?endpoint_id={endpoint}, and
  # every price from https://fal.ai/models/{endpoint}/llms.txt — first on
  # 2026-09-12, re-read 2026-10-12. The adapter that maps these params onto
  # each endpoint's own field names is litegen-core/src/providers/model3d/fal.rs,
  # and a test there ties each row below to its arm of that adapter's table.
  #
  # `output_formats` declares only what the VENDOR emits. litegen derives
  # every container it converts (all ten, `model3d_convert::derivable_formats`)
  # from any vendor mesh it can read (see litegen-core/src/mesh/), so the set
  # a caller may request — what GET /v1/models/{id} serves — is wider than
  # these enums, which is why a glb-only endpoint is still worth having.

  - id: fal/hyper3d-rodin
    provider: fal
    media_type: model3d
    display_name: Hyper3D Rodin (Fal)
    description: Deemos Rodin via Fal. Text- or image-to-3D, and the only fal 3D endpoint that lets you pick the container.
    docs_url: https://fal.ai/models/fal-ai/hyper3d/rodin/api
    # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/hyper3d/rodin
    #   (Hyper3dRodinInput / Hyper3dRodinOutput, re-read 2026-10-12)
    # @see https://fal.ai/models/fal-ai/hyper3d/rodin/llms.txt
    # "$0.4 per generations". The HighPack addon "will cost triple the billable
    # units"; it is an extra_allowlist passthrough, so the quote here is the base.
    pricing:
      base_cost_usd: 0.4
      variable_pricing:
        - { when: { extra.addons: HighPack }, multiply: 3 }
    # condition_mode "concat" (the default) takes "multiple multi-view images
    # of the same object … in any order, regardless of the order of view":
    # view-* references go there front first, at most five (3D doc §3E, §3H).
    capabilities: { text_to_3d: true, image_to_3d: true, multiview_to_3d: true }
    # Hyper3dRodinInput.prompt is `maxLength: 1024`: "Required for Text-to-3D
    # mode. Optional for Image-to-3D mode." Not required here because images
    # make it optional; validate_model3d still refuses a request with neither.
    prompt: { required: false, max_length: 1024 }
    params:
      output_formats:
        kind: string_array
        # geometry_file_format is a SCALAR on fal's side, so max_items is 1:
        # one container per vendor job. litegen still delivers every container
        # a request names, deriving the rest from the one it asks for: Rodin's
        # own fbx or usdz when one is requested (`prefers_vendor_native`), else
        # glb, or glb always with `format_source: glb`.
        enum_values: [glb, usdz, fbx, obj, stl]
        max_items: 1
        default: [glb]
        label: Output formats
      pbr:
        kind: bool
        default: true
        label: PBR materials
        description: Off sends Rodin's `material=Shaded` — flat shading, not "no material".
      seed:
        kind: seed
        min: 0
        # Rodin's schema says `maximum: 65535`, not the u32 the rest of fal
        # takes. A larger value is a 422, so it is rejected here instead.
        max: 65535
    ref_inputs:
      max_total: 5
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 5 }
        view-front: { required: false, min_count: 0, max_count: 1 }
        view-front-left: { required: false, min_count: 0, max_count: 1 }
        view-left: { required: false, min_count: 0, max_count: 1 }
        view-back-left: { required: false, min_count: 0, max_count: 1 }
        view-back: { required: false, min_count: 0, max_count: 1 }
        view-back-right: { required: false, min_count: 0, max_count: 1 }
        view-right: { required: false, min_count: 0, max_count: 1 }
        view-front-right: { required: false, min_count: 0, max_count: 1 }
        view-top: { required: false, min_count: 0, max_count: 1 }
        view-bottom: { required: false, min_count: 0, max_count: 1 }
    # quality (high|medium|low|extra-low), tier, use_hyper, TAPose,
    # condition_mode, bbox_condition, addons — no canonical param maps to any of
    # these without distorting it, so they stay explicit passthroughs.
    extra_allowlist: [quality, tier, use_hyper, TAPose, condition_mode, bbox_condition, addons]
    extra_params:
      # Hyper3dRodinInput.addons: anyOf [{const: "HighPack", type: string}, {type: null}] (fal's OpenAPI, above).
      addons: { kind: string, enum_values: [HighPack] }
      # From fal's OpenAPI (drift snapshot fal/carried-3d.txt); bbox_condition (an integer list) stays untyped.
      quality: { kind: string, enum_values: ["high", "medium", "low", "extra-low"], default: "medium" }
      tier: { kind: string, enum_values: ["Regular", "Sketch"], default: "Regular" }
      use_hyper: { kind: bool, default: false }
      TAPose: { kind: bool, default: false }
      condition_mode: { kind: string, enum_values: ["fuse", "concat"], default: "concat" }
    tags: [3d, mesh, rodin]

