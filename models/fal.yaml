    description: >-
      Tencent Hunyuan3D 3.1 Pro via Fal, from one image or from up to eight
      views of one subject (front required; back, left, right, top, bottom,
      front-left and front-right optional). GLB out; litegen derives the
      other containers.
    docs_url: https://fal.ai/models/fal-ai/hunyuan-3d/v3.1/pro/image-to-3d/api
    # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/hunyuan-3d/v3.1/pro/image-to-3d
    #   (Hunyuan3dV31ProImageTo3dInput / …Output, read 2026-10-30):
    #   input_image_url (REQUIRED) "Front view image URL", back_image_url,
    #   left_image_url, right_image_url, top_image_url, bottom_image_url,
    #   left_front_image_url and right_front_image_url ("left-front 45
    #   degree angle view"), enable_pbr (default false), face_count
    #   40000–1500000 (default 500000), generate_type Normal | Geometry
    #   ("Geometry: geometry-only white model (no textures)"). No prompt, no
    #   seed. Output: model_glb, model_urls, thumbnail.
    # Tencent names a view for the side of the subject it shows, as litegen
    # does: in its own multiview example
    # (github.com/Tencent-Hunyuan/Hunyuan3D-2, assets/example_mv_images/1),
    # left.png shows the arm the front view puts on the subject's left.
    # @see https://fal.ai/models/fal-ai/hunyuan-3d/v3.1/pro/image-to-3d/llms.txt (2026-10-30)
    #   "Your request will cost **$0.375** per generation." "Enabling PBR
    #   materials adds **$0.15**. Using multi-view images adds **$0.15**.
    #   Custom face count adds **$0.15**."
    pricing:
      base_cost_usd: 0.375
      variable_pricing:
        - { when: { pbr: true }, add_usd: 0.15 }
        # Any view besides the front: a lone front view is input_image_url,
        # the plain image-to-3D input.
        - { when: { added_views: "*" }, add_usd: 0.15 }
        - { when: { target_polycount: "*" }, add_usd: 0.15 }
    capabilities: { image_to_3d: true, multiview_to_3d: true }
    prompt: { required: false, max_length: 0 }
    params:
      output_formats:
        kind: string_array
        enum_values: [glb]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Hunyuan3D emits glb; litegen derives the other containers.
      texture: { kind: bool, default: true, label: Textures, description: "Sends generate_type: Normal (textured) or Geometry (white model)." }
      pbr: { kind: bool, default: false, label: PBR materials, description: Sends `enable_pbr`. fal adds $0.15. }
      target_polycount:
        kind: int
        min: 40000
        max: 1500000
        label: Target polycount
        description: Sends `face_count` (Hunyuan's default is 500,000). fal adds $0.15.
    ref_inputs:
      max_total: 8
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
        view-front: { required: false, min_count: 0, max_count: 1 }
        view-back: { required: false, min_count: 0, max_count: 1 }
        view-left: { required: false, min_count: 0, max_count: 1 }
        view-right: { required: false, min_count: 0, max_count: 1 }
        view-top: { required: false, min_count: 0, max_count: 1 }
        view-bottom: { required: false, min_count: 0, max_count: 1 }
        view-front-left: { required: false, min_count: 0, max_count: 1 }
        view-front-right: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: []
    tags: [3d, mesh, hunyuan, multiview]

  # ─── 3D operations (PixelGenie 3D doc §3A, §3B) ────────────────────────────
  - id: fal/meshy-rig
    provider: fal
    media_type: model3d
    task: rig
    display_name: Meshy Auto Rig (Fal)
    description: >-
      Meshy's auto-rigger via Fal: a textured humanoid GLB in, a rigged GLB
      (and Meshy's own FBX) out. The character must face +Z with clearly
      defined limbs. litegen sends no animation, so none is billed.
    docs_url: https://fal.ai/models/fal-ai/meshy/rigging/api
    # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/meshy/rigging
    #   (MeshyRiggingInput / MeshyRiggingOutput, read 2026-11-09): model_url
    #   (GLB), height_meters (default 1.7), enable_animation (default false).
    # @see https://docs.meshy.ai/en/api/rigging (2026-11-09), the limits fal
    #   forwards: "100 MB as a data URI"; "The model can have at most 380,000
    #   triangles (a quad counts as 2), and a model with more returns `400`."
    #   (max_faces below stays at 320,000, the limit Meshy published before;
    #   a test pins it); "Rigging isn't suitable for these models: -
    #   Untextured meshes - Non-humanoid assets - Humanoid assets with an
    #   unclear limb and body structure".
    # @see https://fal.ai/models/fal-ai/meshy/rigging (2026-11-09)
    #   "$0.20 per request. +$0.12 when enable_animation=true".
    pricing: { base_cost_usd: 0.20 }
    capabilities: {}
    prompt: { required: false, max_length: 0 }
    params:
      source_model:
        kind: source_model
        formats: [glb]
        max_bytes: 100000000
        max_faces: 320000
        requires_texture: true
        label: Source mesh
        description: A textured humanoid facing +Z, sent to fal inline (at most 100 MB, 320,000 faces).
      # §3B: "A model lists the ones it rigs" — Meshy on fal rigs humanoids
      # only ("Non-humanoid assets" are unsuitable); fal takes no field for it.
      skeleton:
        kind: string
        enum_values: [humanoid]
        default: humanoid
        label: Skeleton
        description: What it rigs. Meshy on fal rigs humanoids only.
      height_m:
        kind: float
        default: 1.7
        label: Height (m)
        description: The character's height in metres (Meshy's height_meters; any positive value).
      joint_naming:
        kind: string
        enum_values: [vendor, vrm, unity, mixamo]
        default: vendor
        label: Joint naming
        description: >-
          `vendor` keeps Meshy's own joint names; `vrm`, `unity` and `mixamo`
          are litegen's renames of them, from the humanoid table it reads
          Meshy's rigs with (3D doc §3B). Humanoids only.
      output_formats:
        kind: string_array
        enum_values: [glb, fbx]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Meshy returns glb and fbx; litegen derives the rest.
    extra_allowlist: []
    tags: [3d, rig, meshy, 3d-operation]

  # FLUX 3 on fal, carried as fal routes beside bfl/flux-3-* and
  # replicate/flux-3-image (the user, 2026-11-04: "like how litellm can still
  # use openrouter"). Each model is two endpoints: text-to-image, and its
  # /edit-image twin, which the adapter calls when images are attached
  # ("image_urls … maxItems 10").
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=blackforestlabs/flux-3/text-to-image (2026-11-04)
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=blackforestlabs/flux-3/edit-image (2026-11-04)
  - id: fal/flux-3-image
    provider: fal
    media_type: image
    display_name: FLUX 3 Image (fal)
    description: Black Forest Labs FLUX 3 Image on fal — text-to-image, or edits from up to 10 images, at 1K.
    docs_url: https://fal.ai/models/blackforestlabs/flux-3/text-to-image/api
    # "Image pricing varies by resolution. A 1K (1 MP) image costs $0.048." — fal
    # prices no other tier, so only 1K is offered.
    # @see https://fal.ai/models/blackforestlabs/flux-3/text-to-image/llms.txt (2026-11-04)
    pricing: { base_cost_usd: 0.048 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true }
    params:
      # "resolution … 768sq, 1k, 1.5k, 2k, 4k (default 1k)": 1k, the priced one.
      resolution: { kind: string, enum_values: ["1K"], default: "1K" }
      # "aspect_ratio … auto, 21:9, 2:1, 16:9, 3:2, 7:5, 4:3, 5:4, 1:1, 4:5, 3:4, 5:7,
      # 2:3, 9:16, 1:2" (unset is auto).
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "2:1", "16:9", "3:2", "7:5", "4:3", "5:4", "1:1", "4:5", "3:4", "5:7", "2:3", "9:16", "1:2"]
      # "output_format … jpeg, png (default jpeg)"
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 10 }
    # safety_tolerance (0-4, default 2), enable_prompt_expansion (default false).
    extra_allowlist: [safety_tolerance, enable_prompt_expansion]
    extra_params:
      # From the comment above (safety_tolerance 0-4, an integer).
      safety_tolerance: { kind: int, min: 0, max: 4, default: 2 }
      enable_prompt_expansion: { kind: bool, default: false }
    tags: [text-to-image, image-to-image]

  # Klein on fal: image_size instead of a tier ("Each side can be 256 to 4096
  # pixels (native 4K)", multiple_of 16, max_area 16777216; default square_hd,
  # 1024²), seed, output_format jpeg | png | webp (default png).
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=blackforestlabs/flux-3/klein/text-to-image (2026-11-04)
  - id: fal/flux-3-image-klein
    provider: fal
    media_type: image
    display_name: FLUX 3 Image Klein (fal)
    description: Black Forest Labs FLUX 3 Klein on fal — fast text-to-image, or edits from up to 10 images, 256 to 4096 px.
    docs_url: https://fal.ai/models/blackforestlabs/flux-3/klein/text-to-image/api
    # "Pricing per output image is $0.008 at 768 × 768, $0.009 at 1K, $0.011 at 1.5K,
    # $0.014 at 2K, and $0.036 at 4K. The same planned rates apply to generation and
    # editing" — by output pixels, the bands bfl/flux-3-image-klein uses; the
    # default square_hd (1024²) is $0.009.
    # @see https://fal.ai/models/blackforestlabs/flux-3/klein/text-to-image/llms.txt (2026-11-04)
    pricing:
      base_cost_usd: 0.009
      variable_pricing:
        - { when: { size: '*', megapixels: { lte: 0.589824 } }, usd: 0.008 }
        - { when: { size: '*', megapixels: { gt: 0.589824, lte: 1.048576 } }, usd: 0.009 }
        - { when: { size: '*', megapixels: { gt: 1.048576, lte: 2.359296 } }, usd: 0.011 }
        - { when: { size: '*', megapixels: { gt: 2.359296, lte: 4.194304 } }, usd: 0.014 }
        - { when: { size: '*', megapixels: { gt: 4.194304 } }, usd: 0.036 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true }
    params:
      size:
        kind: size
        mode: freeform
        min_width: 256
        max_width: 4096
        min_height: 256
        max_height: 4096
        multiple_of: 16
        max_pixels: 16777216
      seed: { kind: seed, min: 0, max: 4294967295 }
      output_format: { kind: string, enum_values: [png, jpeg, webp], default: png }
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 10 }
    # enable_prompt_expansion (default true). Not bounding_boxes (litegen's
    # layout maps to BFL's in-prompt boxes, not this field) nor
    # enable_safety_checker.
    extra_allowlist: [enable_prompt_expansion]
    extra_params:
      # From the comment above.
      enable_prompt_expansion: { kind: bool, default: true }
    tags: [text-to-image, image-to-image, fast]

  # Klein *base* on fal ("undistilled, CFG"), a model of its own. fal serves it
  # only at …/klein/base/text-to-image/lora and …/klein/base/edit-image/lora,
  # whose `loras` is optional ("Default: []"), and litegen sends none. "Same
  # inputs as the text-to-image endpoint": image_size 256 to 4096 a side
  # (multiple_of 16), seed, output_format jpeg | png | webp (default png),
  # edits from at most 10 image_urls.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=blackforestlabs/flux-3/klein/base/text-to-image/lora (2026-11-04)
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=blackforestlabs/flux-3/klein/base/edit-image/lora (2026-11-04)
  - id: fal/flux-3-image-klein-base
    provider: fal
    media_type: image
    display_name: FLUX 3 Image Klein Base (fal)
    description: Black Forest Labs FLUX 3 Klein base (undistilled) on fal — text-to-image, or edits from up to 10 images, up to 4.2 megapixels.
    docs_url: https://fal.ai/models/blackforestlabs/flux-3/klein/base/text-to-image/lora/api
    # "Your request will cost $0.035 per megapixel of output … Billed per output
    # image by size: up to 1024x1024 counts as 1 megapixel, 2048x2048 as 1.56":
    # $0.035 up to 1 MP (the default square_hd is 1024²), and 1.56 × $0.035 =
    # $0.0546 above it. fal gives no price past 2048², so the row stops at
    # 4,194,304 pixels.
    # @see https://fal.ai/models/blackforestlabs/flux-3/klein/base/text-to-image/lora/llms.txt (2026-11-04)
    # @see https://fal.ai/models/blackforestlabs/flux-3/klein/base/edit-image/lora/llms.txt (2026-11-04)
    pricing:
      base_cost_usd: 0.035
      variable_pricing:
        - { when: { size: '*', megapixels: { gt: 1.048576 } }, usd: 0.0546 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true }
    params:
      size:
        kind: size
        mode: freeform
        min_width: 256
        max_width: 4096
        min_height: 256
        max_height: 4096
        multiple_of: 16
        max_pixels: 4194304
      seed: { kind: seed, min: 0, max: 4294967295 }
      output_format: { kind: string, enum_values: [png, jpeg, webp], default: png }
    ref_inputs:
      max_total: 10
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 10 }
    # enable_prompt_expansion (default true), as on fal/flux-3-image-klein. Not
    # loras: litegen takes no LoRA input.
    extra_allowlist: [enable_prompt_expansion]
    extra_params:
      # From the comment above.
      enable_prompt_expansion: { kind: bool, default: true }
    tags: [text-to-image, image-to-image]
