models:
  - id: fal/flux-pro
    provider: fal
    media_type: image
    display_name: Flux Pro (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/v1.1/api
    description: Flux Pro hosted on Fal.
    # "$0.04 per megapixels" (re-read 2026-10-30): $0.04 for the default 1 MP
    # request, then by the asked size's megapixels (width × height ÷ 10⁶;
    # fal documents no rounding).
    # @see https://fal.ai/models/fal-ai/flux-pro/v1.1/llms.txt
    pricing:
      base_cost_usd: 0.04
      variable_pricing:
        - { per_megapixel_usd: 0.04 }
    capabilities: { text_to_image: true }
    prompt: { required: true, max_length: 5000 }
    params:
      # PixelGenie L9: output_format jpeg | png, default jpeg.
      output_format: { kind: string, enum_values: [png, jpeg], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # No guidance_scale / steps: FLUX1.1 [pro]'s input schema has neither
      # (https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/v1.1).
      size:
        kind: size
        mode: freeform
        min_width: 512
        max_width: 2048
        min_height: 512
        max_height: 2048
        multiple_of: 8
    extra_allowlist: [safety_tolerance]
    extra_params:
      # From fal's OpenAPI (drift snapshot fal/carried-image.txt, fal-ai/flux-pro/v1.1).
      safety_tolerance: { kind: string, enum_values: ["1", "2", "3", "4", "5", "6"], default: "2" }
    tags: [text-to-image]

  # FLUX.1 Kontext [pro] and [max] on fal, carried as fal routes beside
  # bfl/flux-kontext-* (the hub-route policy, 2026-11-04). The adapter picks
  # the endpoint by image count:
  # - none: …/kontext[/max]/text-to-image;
  # - one: …/kontext[/max] (`image_url`);
  # - two to four: …/kontext[/max]/multi (`image_urls`). BFL's own API takes
  #   input_image … input_image_4, "*Experimental Multiref*".
  # Each takes prompt, aspect_ratio (21:9 … 9:21), guidance_scale 1-20
  # (default 3.5), seed, output_format jpeg | png (default jpeg),
  # safety_tolerance "1"-"6" and enhance_prompt.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/kontext/text-to-image (2026-11-04)
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/kontext (2026-11-04)
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/kontext/multi (2026-11-04)
  # @see https://api.bfl.ai/openapi.json (/v1/flux-kontext-pro, 2026-11-04)
  - id: fal/flux-kontext-pro
    provider: fal
    media_type: image
    display_name: FLUX.1 Kontext [pro] (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/kontext/api
    description: Black Forest Labs FLUX.1 Kontext pro on Fal — text-to-image, or edits from up to 4 images.
    # "$0.04 per images" on all three endpoints.
    # @see https://fal.ai/models/fal-ai/flux-pro/kontext/llms.txt (2026-11-04)
    pricing: { base_cost_usd: 0.04 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true }
    params:
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      guidance_scale: { kind: float, min: 1.0, max: 20.0, default: 3.5 }
      # Left out, text-to-image makes 1:1 and an edit follows its image.
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "3:2", "1:1", "2:3", "3:4", "9:16", "9:21"]
    ref_inputs:
      max_total: 4
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 4 }
    # safety_tolerance "1"-"6" (a string, default "2"); enhance_prompt.
    extra_allowlist: [safety_tolerance, enhance_prompt]
    extra_params:
      # From the kontext comment above ("1"-"6", a string).
      safety_tolerance: { kind: string, enum_values: ["1", "2", "3", "4", "5", "6"], default: "2" }
      enhance_prompt: { kind: bool }
    tags: [text-to-image, image-to-image]

  - id: fal/flux-kontext-max
    provider: fal
    media_type: image
    display_name: FLUX.1 Kontext [max] (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/kontext/max/api
    description: Black Forest Labs FLUX.1 Kontext max on Fal — text-to-image, or edits from up to 4 images.
    # "$0.08 per images" on all three endpoints.
    # @see https://fal.ai/models/fal-ai/flux-pro/kontext/max/llms.txt (2026-11-04)
    pricing: { base_cost_usd: 0.08 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true }
    params:
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      guidance_scale: { kind: float, min: 1.0, max: 20.0, default: 3.5 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "3:2", "1:1", "2:3", "3:4", "9:16", "9:21"]
    ref_inputs:
      max_total: 4
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: false, min_count: 0, max_count: 4 }
    extra_allowlist: [safety_tolerance, enhance_prompt]
    extra_params:
      # From the kontext comment above ("1"-"6", a string).
      safety_tolerance: { kind: string, enum_values: ["1", "2", "3", "4", "5", "6"], default: "2" }
      enhance_prompt: { kind: bool }
    tags: [text-to-image, image-to-image]

  # FLUX1.1 [pro] ultra on fal (fal-ai/flux-pro/v1.1-ultra): BFL's "4MP"
  # images by aspect_ratio, with an optional image prompt (`image_url`; the
  # role `redux`, as on bfl/flux-pro-1.1-ultra) blended by
  # image_prompt_strength (0-1, default 0.1). Input: prompt, aspect_ratio
  # (default 16:9), raw, seed, output_format jpeg | png, safety_tolerance,
  # enhance_prompt.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/v1.1-ultra (2026-11-04)
  - id: fal/flux-pro-1.1-ultra
    provider: fal
    media_type: image
    display_name: FLUX1.1 [pro] Ultra (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/v1.1-ultra/api
    description: Black Forest Labs FLUX1.1 pro ultra on Fal — 4 MP images by aspect ratio, optionally guided by an image prompt.
    # "$0.06 per images".
    # @see https://fal.ai/models/fal-ai/flux-pro/v1.1-ultra/llms.txt (2026-11-04)
    pricing: { base_cost_usd: 0.06 }
    capabilities: { text_to_image: true }
    prompt: { required: true }
    params:
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "3:2", "1:1", "2:3", "3:4", "9:16", "9:21"]
        default: "16:9"
    ref_inputs:
      max_total: 1
      default_role: redux
      provider_format: { form: url }
      roles:
        redux: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [raw, safety_tolerance, image_prompt_strength, enhance_prompt]
    extra_params:
      # From the comment above; fal's FLUX.1 [pro] endpoints take safety_tolerance as a string.
      raw: { kind: bool }
      safety_tolerance: { kind: string }
      image_prompt_strength: { kind: float, min: 0, max: 1, default: 0.1 }
      enhance_prompt: { kind: bool }
    tags: [text-to-image]

  # FLUX1.1 [pro] Redux on fal (fal-ai/flux-pro/v1.1/redux): variations of one
  # image (`image_url`), steered by an optional prompt (default ""). Input:
  # image_size, guidance_scale 1-20 (default 3.5), num_inference_steps 1-50
  # (default 28), seed, output_format jpeg | png, safety_tolerance,
  # enhance_prompt. Sizes as fal/flux-pro.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/v1.1/redux (2026-11-04)
  - id: fal/flux-pro-1.1-redux
    provider: fal
    media_type: image
    display_name: FLUX1.1 [pro] Redux (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/v1.1/redux/api
    description: Black Forest Labs FLUX1.1 pro Redux on Fal — variations of an image, optionally steered by a prompt.
    # "$0.05 per megapixels": $0.05 for the default 1 MP, then by the asked
    # size's megapixels, as on fal/flux-pro.
    # @see https://fal.ai/models/fal-ai/flux-pro/v1.1/redux/llms.txt (2026-11-04)
    pricing:
      base_cost_usd: 0.05
      variable_pricing:
        - { per_megapixel_usd: 0.05 }
    capabilities: { image_to_image: true }
    prompt: { required: false }
    params:
      output_format: { kind: string, enum_values: [png, jpeg], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      guidance_scale: { kind: float, min: 1.0, max: 20.0, default: 3.5 }
      steps: { kind: int, min: 1, max: 50, default: 28 }
      size:
        kind: size
        mode: freeform
        min_width: 512
        max_width: 2048
        min_height: 512
        max_height: 2048
        multiple_of: 8
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: [safety_tolerance, enhance_prompt]
    extra_params:
      # From the comment above; fal's FLUX.1 [pro] endpoints take safety_tolerance as a string.
      safety_tolerance: { kind: string }
      enhance_prompt: { kind: bool }
    tags: [image-to-image]

  # FLUX1.1 [pro] ultra Redux on fal (fal-ai/flux-pro/v1.1-ultra/redux): 4 MP
  # variations of one image by aspect_ratio, with an optional prompt,
  # image_prompt_strength (0-1, default 0.1), raw, seed, output_format,
  # safety_tolerance, enhance_prompt.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/v1.1-ultra/redux (2026-11-04)
  - id: fal/flux-pro-1.1-ultra-redux
    provider: fal
    media_type: image
    display_name: FLUX1.1 [pro] Ultra Redux (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/v1.1-ultra/redux/api
    description: Black Forest Labs FLUX1.1 pro ultra Redux on Fal — 4 MP variations of an image, optionally steered by a prompt.
    # "$0.05 per megapixels" (fal) of ultra's output, which BFL sizes only as
    # "Generate up to 4MP resolution images" and names no size per ratio. The
    # 2752 × 1536 output size is litegen's own assumption, taken from the
    # dimensions of the sample images on BFL's page (…-2752x1536.jpg):
    # 4.227072 MP × $0.05 = $0.2113536.
    # @see https://fal.ai/models/fal-ai/flux-pro/v1.1-ultra/redux/llms.txt (2026-11-09)
    # @see https://docs.bfl.ml/flux_models/flux_1_1_pro_ultra_raw.md (2026-11-09)
    pricing: { base_cost_usd: 0.2113536 }
    capabilities: { image_to_image: true }
    prompt: { required: false }
    params:
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      aspect_ratio:
        kind: aspect_ratio
        allowed: ["21:9", "16:9", "4:3", "3:2", "1:1", "2:3", "3:4", "9:16", "9:21"]
        default: "16:9"
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: [raw, image_prompt_strength, safety_tolerance, enhance_prompt]
    extra_params:
      # From the comment above; fal's FLUX.1 [pro] endpoints take safety_tolerance as a string.
      raw: { kind: bool }
      safety_tolerance: { kind: string }
      image_prompt_strength: { kind: float, min: 0, max: 1, default: 0.1 }
      enhance_prompt: { kind: bool }
    tags: [image-to-image]

  # FLUX.1 [pro] Fill on fal (fal-ai/flux-pro/v1/fill): inpainting. Input:
  # image_url, mask_url ("Needs to match the dimensions of the input image"),
  # prompt, seed, output_format jpeg | png, safety_tolerance, enhance_prompt.
  # fal names no mask convention; BFL's own fill says "Black areas (0%)
  # indicate no modification, while white areas (100%) specify areas for
  # inpainting".
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/v1/fill (2026-11-04)
  # @see https://api.bfl.ai/openapi.json (/v1/flux-pro-1.0-fill, 2026-11-04)
  - id: fal/flux-pro-fill
    provider: fal
    media_type: image
    display_name: FLUX.1 [pro] Fill (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/v1/fill/api
    description: Black Forest Labs FLUX.1 pro Fill on Fal — repaints the masked part of an image from a prompt.
    # "$0.05 per megapixels" of output, which is the input image's size: $0.05
    # at 1 MP. A larger image bills more at fal than here, since its size
    # isn't known at the quote.
    # @see https://fal.ai/models/fal-ai/flux-pro/v1/fill/llms.txt (2026-11-04)
    pricing: { base_cost_usd: 0.05 }
    capabilities: { text_to_image: false, image_to_image: true, inpainting: true }
    prompt: { required: true }
    params:
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      seed: { kind: seed, min: 0, max: 4294967294 }
      # A region is drawn as the mask (white edits), as on every mask-taking row.
      region: { kind: region, input: mask, label: Region, description: "The rectangle to edit, sent drawn as the mask." }
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1, convention: white_edits }
    extra_allowlist: [safety_tolerance, enhance_prompt]
    extra_params:
      # From the comment above; fal's FLUX.1 [pro] endpoints take safety_tolerance as a string.
      safety_tolerance: { kind: string }
      enhance_prompt: { kind: bool }
    tags: [image-to-image, inpainting]

  # FLUX.1 [pro] Erase on fal (fal-ai/flux-pro/v1/erase): removes what the mask
  # covers and fills in behind it. Input: image_url, mask_url ("white (255)
  # marks pixels to erase and black (0) marks pixels to keep"), dilate_pixels
  # (0-100, default 10), output_format jpeg | png. It takes no prompt.
  # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=fal-ai/flux-pro/v1/erase (2026-11-04)
  - id: fal/flux-pro-erase
    provider: fal
    media_type: image
    display_name: FLUX.1 [pro] Erase (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux-pro/v1/erase/api
    description: Black Forest Labs FLUX.1 pro Erase on Fal — removes what a mask covers and fills in the background.
    # "$0.03 for the first megapixel generated, then $0.004 for each subsequent
    # megapixel. Each reference megapixel also costs $0.004 set at 3 MP
    # minimum": $0.03 + 3 × $0.004 = $0.042 at least. A larger image bills
    # more at fal than here.
    # @see https://fal.ai/models/fal-ai/flux-pro/v1/erase/llms.txt (2026-11-04)
    pricing: { base_cost_usd: 0.042 }
    capabilities: { text_to_image: false, image_to_image: true, inpainting: true }
    prompt: { required: false, max_length: 0 }
    params:
      output_format: { kind: string, enum_values: [jpeg, png], default: jpeg }
      region: { kind: region, input: mask, label: Region, description: "The rectangle to erase, sent drawn as the mask." }
    ref_inputs:
      max_total: 2
      default_role: init
      provider_format: { form: url }
      roles:
        init: { required: true, min_count: 1, max_count: 1 }
        mask: { required: false, min_count: 0, max_count: 1, convention: white_edits }
    # dilate_pixels (0-100, default 10): how far the mask grows.
    extra_allowlist: [dilate_pixels]
    extra_params:
      # From the comment above.
      dilate_pixels: { kind: int, min: 0, max: 100, default: 10 }
    tags: [image-to-image, inpainting]

  - id: fal/flux-dev
    provider: fal
    media_type: image
    display_name: Flux Dev (Fal)
    docs_url: https://fal.ai/models/fal-ai/flux/dev/api
    description: Flux Dev on Fal.
    # "$0.025 per megapixels" (read 2026-10-30): $0.025 for the default 1 MP
    # request, then by the asked size's megapixels.
