  # four ways:
  # - no frame: …/text-to-video;
  # - a first frame: …/image-to-video (`image_url`);
  # - a first and a last frame: …/first-last-frame-to-video (`start_image_url`,
  #   `end_image_url`);
  # - keyframes: …/keyframes-to-video (`keyframes` [{frame_index, image_url}],
  #   at most 10; "`frame_index` is a position at 24 fps").
  # Every endpoint takes prompt, duration ("auto" or 5-20 on text and image, an
  # integer 5-20 on the rest; litegen sends a whole number), aspect_ratio (auto,
  # 21:9, 2:1, 16:9, 4:3, 1:1, 3:4, 9:16), generate_audio (default true) and
  # safety_tolerance (0-4, default 2). None takes a seed.
