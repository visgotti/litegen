  # ─── Multiview-to-3D (PixelGenie 3D doc §3E) ───────────────────────────────
  # Views arrive as `view-<name>` references, named for the side of the
  # subject the camera sees (front 0°, left 90°, back 180°, right 270°).
  - id: fal/tripo-h3.1-multiview
    provider: fal
    media_type: model3d
    display_name: Tripo H3.1 Multiview to 3D (Fal)
    description: >-
      Tripo H3.1 via Fal: two to four views of one subject make one mesh.
      Tripo reads its views by position — front, left, back, right — so
      view-front and view-left are required and view-right needs view-back.
      litegen sends them in Tripo's order whatever order they arrive in.
    docs_url: https://fal.ai/models/tripo3d/h3.1/multiview-to-3d/api
    # @see https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=tripo3d/h3.1/multiview-to-3d
    #   (H31MultiviewTo3dInput / H31MultiviewTo3dOutput, read 2026-10-30):
    #   image_urls "2 to 4 image URLs of the same object from different
    #   angles. Order: [front, left, back, right]. Front view is required.";
    #   texture (default true), pbr (default true), face_limit 1000–2000000,
    #   model_seed, texture_seed, texture_quality / geometry_quality
    #   (standard | detailed), quad, orientation, auto_size,
    #   texture_alignment. No prompt. model_mesh "May be GLB or FBX
    #   depending on Tripo output" (FBX only for quad, which is not offered).
    #   Which side Tripo calls "left" is not documented (unverified): litegen
    #   sends the subject's left side, yaw 90.
    # @see https://fal.ai/models/tripo3d/h3.1/multiview-to-3d/llms.txt (2026-10-30)
    #   "Your request will cost **$0.20** (without textures), **$0.30** (with
    #   standard textures), or **$0.40** (with HD textures), plus an
    #   additional **$0.20** for detailed geometry and **$0.05** for quad mesh
    #   if selected." The default request is textured at standard quality.
    pricing:
      base_cost_usd: 0.30
      # pbr "If true, texture is also enabled", so only both off is untextured.
      variable_pricing:
        - { when: { texture: false, pbr: false }, usd: 0.20 }
    capabilities: { multiview_to_3d: true }
    prompt: { required: false, max_length: 0 }
    params:
      output_formats:
        kind: string_array
        enum_values: [glb]
        max_items: 1
        default: [glb]
        label: Output formats
        description: Tripo emits glb here; litegen derives the other containers.
      texture: { kind: bool, default: true, label: Textures, description: Sends `texture`. An untextured mesh costs $0.20 at fal. }
      pbr: { kind: bool, default: true, label: PBR materials, description: Sends `pbr`; PBR also turns textures on. }
      target_polycount:
        kind: int
        min: 1000
        max: 2000000
        label: Target polycount
        description: Sends `face_limit`. Left out, Tripo picks the count.
      # model_seed is an integer with no stated bounds; u32 is the range fal
      # documents elsewhere.
      seed: { kind: seed, min: 0, max: 4294967295 }
    ref_inputs:
      max_total: 4
      provider_format: { form: url }
      view_order: [front, left, back, right]
      roles:
        view-front: { required: true, min_count: 1, max_count: 1 }
        view-left: { required: true, min_count: 1, max_count: 1 }
        view-back: { required: false, min_count: 0, max_count: 1 }
        view-right: { required: false, min_count: 0, max_count: 1 }
    # texture_quality, geometry_quality and quad change the price (and quad
    # the container), so they wait for variable pricing (Task 17).
    extra_allowlist: [texture_alignment, texture_seed, orientation, auto_size]
    extra_params:
      # From fal's OpenAPI (drift snapshot fal/carried-3d.txt, tripo3d/h3.1/multiview-to-3d).
      texture_alignment: { kind: string, enum_values: ["original_image", "geometry"], default: "original_image" }
      texture_seed: { kind: int }
      orientation: { kind: string, enum_values: ["default", "align_image"], default: "default" }
      auto_size: { kind: bool, default: false }
    tags: [3d, mesh, tripo, multiview]

