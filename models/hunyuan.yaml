models:
  # Tencent Hunyuan. TC3-HMAC-SHA256 (SecretId=key_id, SecretKey=key_secret,
  # region=ap-guangzhou). RPC-style POST / with X-TC-Action header.
  # Image product: hunyuan.tencentcloudapi.com (v2023-09-01, async submit/query).
  - id: hunyuan/hunyuan-image
    provider: hunyuan
    media_type: image
    display_name: Hunyuan Image
    description: Tencent Hunyuan text-to-image (async SubmitHunyuanImageJob).
    # Pay-as-you-go (后付费) 0.5 CNY per image at every monthly volume, converted
    # at the ECB reference rate for 2026-09-11 (1 CNY = 0.14907 USD, via
    # https://api.frankfurter.dev/v1/latest?base=CNY&symbols=USD): $0.0745.
    # @see https://cloud.tencent.com/document/product/1729/105925 (2026-09-11)
    pricing: { base_cost_usd: 0.0745 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 1024 }
    params:
      negative_prompt: { kind: string, max_length: 1024 }
      seed: { kind: seed, min: 0, max: 2147483647 }
      # Resolution is an enum of eight W:H values (default 1024:1024); the
      # adapter sends WxH as W:H. With a ContentImage only the first four apply.
      # @see https://cloud.tencent.com/document/product/1729/105969 (2026-09-11)
      size:
        kind: size
        mode: enum
        values: [[768,768],[768,1024],[1024,768],[1024,1024],[720,1280],[1280,720],[768,1280],[1280,768]]
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    # Only SubmitHunyuanImageJob parameters: Tencent fails a request carrying an
    # undefined parameter (UnknownParameter). RspImgType belongs to the sync
    # TextToImageLite action, not this one.
    # @see https://cloud.tencent.com/document/api/1729/101847 (UnknownParameter)
    extra_allowlist: [Style, LogoAdd, Revise]
    tags: [text-to-image, image-to-image]

  # Video product (混元生视频 / vclm): vclm.tencentcloudapi.com (v2024-05-23).
  # Tencent's native Hunyuan video model: SubmitHunyuanToVideoJob, polled with
  # DescribeHunyuanToVideoJob (Status WAIT | RUN | FAIL | DONE, ResultVideoUrl).
  # (This row used to call the Kling-branded SubmitImageToVideoJob with Model
  # Kling-V1-6, which Kling retires 2026-09-15.) The request takes exactly
  # Prompt (required, at most 200 utf-8 characters), Image (optional: without
  # it the job is text-to-video), Resolution ("目前仅支持720p", default 720p),
  # LogoAdd and LogoParam. There is no duration (the output is 5 s), aspect
  # ratio or negative prompt, and Tencent fails an undefined parameter with
  # UnknownParameter, so none is advertised or allowlisted.
  # @see https://raw.githubusercontent.com/TencentCloud/tencentcloud-sdk-go/master/tencentcloud/vclm/v20240523/models.go
  #   (SubmitHunyuanToVideoJobRequestParams, DescribeHunyuanToVideoJobResponseParams; 2026-09-11)
  # @see https://raw.githubusercontent.com/TencentCloud/tencentcloud-cli/master/tccli/services/vclm/v20240523/api.json
  #   (Prompt is the only required member; 2026-09-11)
  - id: hunyuan/hunyuan-video
    provider: hunyuan
    media_type: video
    display_name: Hunyuan Video
    description: Tencent Hunyuan text/image-to-video (async SubmitHunyuanToVideoJob on vclm).
    # 混元生视频, 5 s 720p from text or an image: 1.5 credits (积分) per job;
    # pay-as-you-go credits are 1.2 CNY each, so 1.8 CNY, converted at the ECB
    # reference rate for 2026-09-11 (1 CNY = 0.14907 USD, via
    # https://api.frankfurter.dev/v1/latest?base=CNY&symbols=USD): $0.268.
    # (Prepaid credit packs are 1 CNY per credit. The page's second worked
    # example multiplies by 2.0, which contradicts its own 1.2 rate table.)
    # @see https://cloud.tencent.com/document/product/1616/118994 (2026-09-11)
    pricing: { base_cost_usd: 0.268 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 200 }
    params:
      # Forwarded as Resolution; 720p is the only value the action accepts.
      resolution: { kind: string, enum_values: ["720p"], default: "720p" }
    # Image: jpg/jpeg/png/webp/bmp/tiff, base64 at most 8 MB (URL 10 MB),
    # each side 50-5000 px, aspect ratio 1:4 to 4:1.
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [LogoAdd]
    tags: [text-to-video, image-to-video]
