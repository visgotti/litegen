models:
  # Tencent Hunyuan on the Tencent Cloud API. TC3-HMAC-SHA256 (SecretId=key_id,
  # SecretKey=key_secret, region=ap-guangzhou). RPC-style POST / with
  # X-TC-Action header. Tencent is moving Hunyuan to TokenHub: "迁移后，原平台将不再
  # 新增模型能力，并停止支持新购模型服务。用户已购买的模型服务可继续使用，暂不受影响" — these
  # rows stay for the buyers who still use them; new Hunyuan models and new
  # customers are the `tokenhub` provider (models/tokenhub.yaml).
  # @see https://cloud.tencent.com/document/product/1729/105925 (2026-11-04)
  # Image product: hunyuan.tencentcloudapi.com (v2023-09-01, async submit/query).
  - id: hunyuan/hunyuan-image
    provider: hunyuan
    media_type: image
    display_name: Hunyuan Image
    description: Tencent Hunyuan text-to-image (async SubmitHunyuanImageJob).
    docs_url: https://cloud.tencent.com/document/product/1729/105969
    # Pay-as-you-go (后付费) 0.5 CNY per image at every monthly volume, converted
    # at the ECB reference rate for 2026-09-11 (1 CNY = 0.14907 USD, via
    # https://api.frankfurter.dev/v1/latest?base=CNY&symbols=USD): $0.0745.
    # @see https://cloud.tencent.com/document/product/1729/105925 (2026-09-11)
    pricing: { base_cost_usd: 0.0745 }
    capabilities: { text_to_image: true, image_to_image: true }
    prompt: { required: true, max_length: 1024 }
    params:
      negative_prompt: { kind: string, max_length: 1024 }
      # Seed: "不传：随机种子生成。 正数：固定种子生成。 扩写开启时固定种子不生效，将保持随机。"
      # (unset is random, a positive seed is fixed, and a fixed seed has no effect
      # while Revise is on, which is the default). Revise: "如果上传了参考图，扩写关闭
      # 不生效，将保持开启。" (with a reference image Revise stays on). So a seed goes
      # with Revise 0 (prompt expansion off), and one beside a reference image
      # or an explicit Revise 1 is refused (2026-11-03).
      # @see https://raw.githubusercontent.com/TencentCloud/tencentcloud-sdk-go/master/tencentcloud/hunyuan/v20230901/models.go (2026-10-30)
      seed: { kind: seed, min: 1, max: 2147483647 }
      # Resolution is an enum of eight W:H values (default 1024:1024); the
      # adapter sends WxH as W:H. With a ContentImage only the first four apply,
      # and the adapter refuses the other four (2026-11-03).
      # @see https://cloud.tencent.com/document/product/1729/105969 (2026-09-11)
      size:
        kind: size
        mode: enum
        values: [[768,768],[768,1024],[1024,768],[1024,1024],[720,1280],[1280,720],[768,1280],[1280,768]]
    ref_inputs:
      max_total: 1
      default_role: init
      provider_format: { form: base64 }
      roles:
        init: { required: false, min_count: 0, max_count: 1 }
    # Only SubmitHunyuanImageJob parameters: Tencent fails a request carrying an
    # undefined parameter (UnknownParameter). RspImgType belongs to the sync
    # TextToImageLite action, not this one.
    # @see https://cloud.tencent.com/document/api/1729/101847 (UnknownParameter)
    extra_allowlist: [Style, LogoAdd, Revise]
    extra_params:
      # From Tencent Cloud's SDK models (drift snapshot hunyuan/hunyuan-models.txt: *int64); Revise 0 or 1 (the comment above); Style stays untyped.
      LogoAdd: { kind: int }
      Revise: { kind: int, values: [0, 1] }
    tags: [text-to-image, image-to-image]

  # Hunyuan Image 3.0 (混元生图 3.0) ran on aiart's SubmitTextToImageJob and
  # QueryTextToImageJob until aiart release 31 deleted both (2026-09-22); its
  # row was retired 2026-10-30. Its successor on TokenHub, hy-image-v3, retires
  # there on 2026-11-12; tokenhub/hy-image-v3.5-preview is carried instead.
  # @see https://cloud.tencent.com/document/product/1668/88078 (aiart release notes; 2026-10-30)

  # Video product (混元生视频 / vclm): vclm.tencentcloudapi.com (v2024-05-23).
  # Tencent's native Hunyuan video model: SubmitHunyuanToVideoJob, polled with
  # DescribeHunyuanToVideoJob (Status WAIT | RUN | FAIL | DONE, ResultVideoUrl).
  # (This row used to call the Kling-branded SubmitImageToVideoJob with Model
  # Kling-V1-6, which Kling retires 2026-09-15.) The request takes exactly
  # Prompt (required, at most 200 utf-8 characters), Image (optional: without
  # it the job is text-to-video), Resolution ("目前仅支持720p", default 720p),
  # LogoAdd and LogoParam. There is no duration field (the output is 5 s, so
  # duration_seconds is 5 only), aspect ratio or negative prompt, and Tencent
  # fails an undefined parameter with UnknownParameter, so none is sent.
  # @see https://raw.githubusercontent.com/TencentCloud/tencentcloud-sdk-go/master/tencentcloud/vclm/v20240523/models.go
  #   (SubmitHunyuanToVideoJobRequestParams, DescribeHunyuanToVideoJobResponseParams; 2026-09-11)
  # @see https://raw.githubusercontent.com/TencentCloud/tencentcloud-cli/master/tccli/services/vclm/v20240523/api.json
  #   (Prompt is the only required member; 2026-09-11)
  - id: hunyuan/hunyuan-video
    provider: hunyuan
    media_type: video
    display_name: Hunyuan Video
    description: Tencent Hunyuan text/image-to-video (async SubmitHunyuanToVideoJob on vclm).
    docs_url: https://cloud.tencent.com/document/api/1616/126160
    # 混元生视频, 5 s 720p from text or an image: 1.5 credits (积分) per job;
    # pay-as-you-go credits are 1.2 CNY each, so 1.8 CNY, converted at the ECB
    # reference rate for 2026-09-11 (1 CNY = 0.14907 USD, via
    # https://api.frankfurter.dev/v1/latest?base=CNY&symbols=USD): $0.268.
    # (Prepaid credit packs are 1 CNY per credit. The page's second worked
    # example multiplies by 2.0, which contradicts its own 1.2 rate table.)
    # @see https://cloud.tencent.com/document/product/1616/118994 (2026-09-11)
    pricing: { base_cost_usd: 0.268 }
    capabilities: { text_to_video: true, image_to_video: true }
    prompt: { required: true, max_length: 200 }
    params:
      # "生成一段5s" (a 5 s clip) and no duration field, so any other duration is
      # refused rather than billed and returned at 5 s.
      # @see https://cloud.tencent.com/document/product/1616/118994 (2026-10-30)
      duration_seconds: { kind: float, min: 5.0, max: 5.0, default: 5.0 }
      # Forwarded as Resolution; 720p is the only value the action accepts:
      # "目前仅支持720p视频分辨率，默认720p。" (the SDK). The price page also lists a
      # 1080p job at 3 credits (2026-10-30); the SDK's narrower reading stands.
      resolution: { kind: string, enum_values: ["720p"], default: "720p" }
    # Image: jpg/jpeg/png/webp/bmp/tiff, base64 at most 8 MB (URL 10 MB),
    # each side 50-5000 px, aspect ratio 1:4 to 4:1.
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: false, min_count: 0, max_count: 1 }
    extra_allowlist: [LogoAdd]
    extra_params:
      # From Tencent Cloud's SDK models (drift snapshots hunyuan/vclm-*.txt: LogoAdd *int64).
      LogoAdd: { kind: int }
    tags: [text-to-video, image-to-video]

  # Hunyuan image-to-video (图生视频通用能力) on vclm: SubmitImageToVideoGeneralJob,
  # polled with DescribeImageToVideoGeneralJob (Status WAIT | RUN | FAIL |
  # DONE, ResultVideoUrl valid 24 h, as for the Hunyuan video job). The API
  # overview lists it under 混元生视频相关接口, not the third-party section. The
  # request takes exactly Image (required: {Base64} or {Url}), Prompt
  # (optional, at most 200 utf-8 characters), Resolution (480p | 720p |
  # 1080p), Fps (16 | 24 | 30, default 30), LogoAdd and LogoParam; the output
  # is 5 s. Resolution has no documented default, so the adapter sends 720p
  # when none is given (the request the price below is for).
  # @see https://raw.githubusercontent.com/TencentCloud/tencentcloud-sdk-go/master/tencentcloud/vclm/v20240523/models.go
  #   (SubmitImageToVideoGeneralJobRequestParams, DescribeImageToVideoGeneralJobResponseParams; 2026-09-11)
  # @see https://cloud.tencent.com/document/api/1616/124465 (Image is the only required member; 2026-09-11)
  # @see https://cloud.tencent.com/document/api/1616/107795 (API overview; 2026-09-11)
  - id: hunyuan/hunyuan-video-i2v
    provider: hunyuan
    media_type: video
    display_name: Hunyuan Video I2V
    description: Tencent Hunyuan image-to-video at 480p/720p/1080p (async SubmitImageToVideoGeneralJob on vclm).
    docs_url: https://cloud.tencent.com/document/api/1616/124465
    # 图生视频, 5 s: 2 credits (积分) at 480p, 5 credits at 720p/1080p;
    # pay-as-you-go credits are 1.2 CNY each, so the default 720p job is 6 CNY
    # (480p: 2.4 CNY, $0.358), converted at the ECB reference rate for
    # 2026-09-11 (1 CNY = 0.14907 USD, via
    # https://api.frankfurter.dev/v1/latest?base=CNY&symbols=USD): $0.894.
    # @see https://cloud.tencent.com/document/product/1616/118994 (2026-09-11)
    pricing:
      base_cost_usd: 0.894
      variable_pricing:
        - { when: { resolution: 480p }, usd: 0.358 }
    capabilities: { image_to_video: true }
    prompt: { required: false, max_length: 200 }
    params:
      # "生成一段5s" (a 5 s clip) and no duration field, so any other duration is
      # refused rather than billed and returned at 5 s.
      # @see https://cloud.tencent.com/document/product/1616/118994 (2026-10-30)
      duration_seconds: { kind: float, min: 5.0, max: 5.0, default: 5.0 }
      resolution: { kind: string, enum_values: ["480p", "720p", "1080p"], default: "720p" }
      # Fps is one of 16, 24, 30 (default 30).
      fps: { kind: int, min: 16, max: 30, default: 30, values: [16, 24, 30] }
    # Image: jpg/jpeg/png/webp/bmp/tiff, URL at most 8 MB, each side 50-5000
    # px, aspect ratio 1:4 to 4:1.
    ref_inputs:
      max_total: 1
      default_role: first_frame
      provider_format: { form: base64 }
      roles:
        first_frame: { required: true, min_count: 1, max_count: 1 }
    extra_allowlist: [LogoAdd]
    extra_params:
      # From Tencent Cloud's SDK models (drift snapshots hunyuan/vclm-*.txt: LogoAdd *int64).
      LogoAdd: { kind: int }
    tags: [image-to-video]
